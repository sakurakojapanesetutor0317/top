<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5 Time Games | Sakura Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&family=Fredoka:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --text-primary: #34345B;
  --text-secondary: #7F86A6;
  --card-bg: #FFFFFF;
}
.category-minna {
  --category-bg: #FFF0F5;
  --category-border: #FAD6E5;
  --category-accent: #EC4899;
}
.category-verbs {
  --category-bg: #EFF6FF;
  --category-border: #DBEAFF;
  --category-accent: #60A5FA;
}
.category-grammar {
  --category-bg: #F5F3FF;
  --category-border: #E9D5FF;
  --category-accent: #A78BFA;
}
.category-simulation {
  --category-bg: #ECFDF5;
  --category-border: #D1FAE5;
  --category-accent: #34D399;
}
.category-vocabulary {
  --category-bg: #F4FAE9;
  --category-border: #DCEEBB;
  --category-accent: #A9D94E;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Poppins","Noto Sans JP",sans-serif;
  color: var(--text-primary);
  line-height: 1.5;
}
img {
  max-width: 100%;
}
.hero-copy {
  position: absolute;
  z-index: 2;
  left: 4%;
  top: 17%;
  width: 52%;
  height: 66%;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: clamp(12px,3vw,36px) clamp(15px,3.4vw,42px);
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.hero-copy .eyebrow {
  display: inline-block;
  padding: 3px 13px;
  border-radius: 999px;
  background: #D7C2F3;
  color: #594778;
  font: 600 .7rem/1.5 "Fredoka","Poppins",sans-serif;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: .55em;
}
.hero-copy h1 {
  font: 700 clamp(1.3rem,3vw,2.2rem)/1.15 "Fredoka","Poppins",sans-serif;
  color: #4F3A72;
  letter-spacing: .005em;
}
.hero-copy p {
  margin-top: .55em;
  font: 500 clamp(.85rem,1.4vw,1.05rem)/1.4 "Fredoka","Poppins",sans-serif;
  color: #826D9B;
}
@media (max-width:600px) {
  .hero-copy {
    position: static;
    left: auto;
    top: auto;
    width: auto;
    height: auto;
    align-items: center;
    text-align: center;
    padding: 14px 16px 16px;
  }
  .hero-copy h1 {
    font-size: 1.5rem;
  }
  .hero-copy p {
    font-size: .92rem;
  }
  .hero-copy .eyebrow {
    font-size: .62rem;
  }
}
.category {
  margin-top: 14px;
  padding: 14px 16px 16px;
  border-radius: 16px;
  background: var(--category-bg);
}
.category-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.category-icon {
  position: relative;
  flex: none;
  width: 52px;
  height: 52px;
}
.category-text {
  min-width: 0;
}
.category h2 {
  font-size: 1.3rem;
  font-weight: 600;
  line-height: 1.25;
  color: var(--category-accent);
}
.category-desc {
  margin-top: 2px;
  font-size: .86rem;
  color: var(--text-secondary);
}
.new-tag {
  margin-left: auto;
  flex: none;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1.5px solid var(--category-accent);
  background: var(--card-bg);
  color: var(--category-accent);
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.category-icon img,.game-icon img {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--s);
  height: var(--s);
  max-width: none;
  object-fit: contain;
  transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));
  pointer-events: none;
}
.game-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 12px;
}
.game-card {
  position: relative;
  display: grid;
  grid-template-columns: 44px minmax(0,1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 72px;
  padding: 12px 12px 12px 10px;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1.5px solid var(--category-border);
  box-shadow: 0 2px 8px rgba(52,52,91,.05);
  color: var(--text-primary);
  text-decoration: none;
  transition: transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
a.game-card:hover {
  transform: translateY(-3px);
  border-color: var(--category-accent);
  box-shadow: 0 6px 14px rgba(52,52,91,.08);
}
a.game-card:focus-visible {
  outline: 3px solid var(--category-accent);
  outline-offset: 3px;
}
.game-icon {
  position: relative;
  width: 44px;
  height: 44px;
}
.game-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.game-title {
  font-size: .92rem;
  font-weight: 600;
  line-height: 1.3;
}
.game-desc {
  word-break: keep-all;
  overflow-wrap: anywhere;
  margin-top: 2px;
  font-size: .78rem;
  line-height: 1.35;
  color: var(--text-secondary);
}
.game-arrow {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--category-accent);
  color: #fff;
}
.game-arrow svg {
  width: 16px;
  height: 16px;
}
.game-card.is-soon {
  cursor: not-allowed;
  box-shadow: none;
}
.game-card.is-soon .game-icon img {
  opacity: .5;
  filter: grayscale(.4);
}
.game-card.is-soon .game-title {
  color: #A3A8C0;
}
.game-card.is-soon .game-desc {
  color: #B5B9CC;
}
.soon-badge {
  align-self: flex-start;
  margin-top: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--category-bg);
  color: var(--text-secondary);
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: .03em;
  white-space: nowrap;
}
footer {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 36px 20px 48px;
  color: #8a869c;
  font-size: .85rem;
}
footer span {
  color: #e17055;
}
@media (max-width:1000px) {
  .game-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}
@media (max-width:600px) {
  .category {
    padding: 12px;
  }
  .category h2 {
    font-size: 1.12rem;
  }
  .category-desc {
    font-size: .78rem;
  }
  .category-icon {
    width: 44px;
    height: 44px;
  }
  .category-icon img {
    width: calc(var(--s) * .85);
    height: calc(var(--s) * .85);
  }
  .game-grid {
    gap: 10px;
  }
  .game-card {
    grid-template-columns: 44px 1fr auto;
    grid-template-areas: "icon . arrow" "text text text";
    align-items: start;
    row-gap: 8px;
    padding: 12px;
  }
  .game-icon {
    grid-area: icon;
    width: 44px;
    height: 44px;
  }
  .game-text {
    grid-area: text;
  }
  .game-arrow {
    grid-area: arrow;
  }
  .game-title {
    font-size: .9rem;
  }
}
@media (max-width:340px) {
  .game-grid {
    grid-template-columns: minmax(0,1fr);
  }
}
@media (hover:none) {
  a.game-card:hover {
    transform: none;
  }
}
@media (prefers-reduced-motion:reduce) {
  .game-card {
    transition: none;
  }
}
.adjective-grid {
  grid-template-columns: repeat(3,minmax(0,1fr));
}
.adjective-grid .game-card {
  min-height: 94px;
  padding: 14px 14px 14px 12px;
}
.adjective-grid .game-icon {
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: #EEE7FF;
  color: #8767C6;
  font: 700 1.2rem/1 "Poppins",sans-serif;
}
.adjective-grid .game-text {
  gap: 3px;
}
.adjective-grid .game-title {
  font-size: .96rem;
}
.adjective-grid .game-desc {
  font-size: .75rem;
}
.adjective-grid .game-arrow {
  flex: none;
}
@media (max-width:1000px) {
  .adjective-grid {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
}
@media (max-width:780px) {
  .adjective-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}
@media (max-width:600px) {
  .adjective-grid .game-card {
    min-height: 104px;
  }
  .adjective-grid .game-icon {
    grid-area: icon;
  }
}
@media (max-width:390px) {
  .adjective-grid {
    grid-template-columns: minmax(0,1fr);
  }
}
</style>

</head>

<div class="page-bg" aria-hidden="true"></div>

<span class="category-icon"><img src="https://sakurakojapanesetutor0317.github.io/top/assets/icons/time.png" alt="" width="512" height="512" style="--s:134px;--dx:0px;--dy:0px" onerror="this.style.display='none';this.parentElement.textContent='🕒'"></span>

<span class="game-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>

</div>
</section>
</main>
<footer>Made with <span>❤</span> for Japanese Learners</footer>
</div>


</body>
