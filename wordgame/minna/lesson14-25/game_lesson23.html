60%{transform:scale(.97);}
100%{transform:scale(1);}

@keyframes shake{

20%{transform:translateX(-6px);}
40%{transform:translateX(6px);}
60%{transform:translateX(-6px);}
80%{transform:translateX(6px);}
}

const audio = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq,duration){
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.connect(gain);
  gain.connect(audio.destination);
  osc.frequency.value=freq;
  osc.type="triangle";
  gain.gain.value=0.15;
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+duration);
  osc.stop(audio.currentTime+duration);
}

function correctSound(){
  if(!document.getElementById("soundMode").checked) return;
  playTone(700,.08);
  setTimeout(()=>{ playTone(900,.12); },90);
}

function wrongSound(){
  if(!document.getElementById("soundMode").checked) return;
  playTone(180,.25);
}

function sanitizeId(name){
  // Replace characters that aren't allowed in a Firestore document ID
  return name.trim().replace(/[.$#\[\]\/]/g, "_");
}

async function ensureUserDoc(name){
  await setDoc(doc(db, "users", currentUserId), {
    displayName: name,
    updatedAt: serverTimestamp()
  }, { merge: true });
}

async function updateProgress(qIndex, isCorrect){
  const ref = doc(db, "users", currentUserId, PROGRESS_COL, String(qIndex));
  await setDoc(ref, {
    correct: isCorrect,
    lastAttemptAt: serverTimestamp(),
    attempts: increment(1),
    correctCount: increment(isCorrect ? 1 : 0),
    wrongCount: increment(isCorrect ? 0 : 1)
  }, { merge: true });
}

async function getWrongIndices(){
  const q = query(
    collection(db, "users", currentUserId, PROGRESS_COL),
    where("correct", "==", false)
  );
  const snap = await getDocs(q);
  const list = [];
  snap.forEach(d => list.push(parseInt(d.id, 10)));
  return list;
}

async function refreshWrongCount(){
  const el = document.getElementById("wrongCountDisplay");
  try{
    const wrong = await getWrongIndices();
    el.textContent = wrong.length === 0
      ? "No missed questions right now 🎉"
      : `${wrong.length} question(s) to review`;
  }catch(e){
    console.error("Failed to fetch progress", e);
    el.textContent = "(Couldn't connect to the database. Please check your Firebase settings)";
  }
}

let savedIndices = new Set();

async function getSavedIndices(){

function updateSaveButton(){
  if (quiz.length === 0 || index >= quiz.length) return;
  const current = quiz[index];
  const btn = document.getElementById("saveToggle");
  const isSaved = savedIndices.has(current.idx);
  btn.textContent = isSaved ? "⭐" : "☆";
  btn.classList.toggle("saved", isSaved);
  btn.title = isSaved ? "Remove from saved words" : "Save this word";
}

window.toggleSave = async function(){
  if (quiz.length === 0 || index >= quiz.length) return;
  const current = quiz[index];
  const isSaved = savedIndices.has(current.idx);
  if (isSaved) {
    savedIndices.delete(current.idx);
  } else {
    savedIndices.add(current.idx);
  }
  updateSaveButton();

  const ref = doc(db, "users", currentUserId, PROGRESS_COL, String(current.idx));
  try{
    await setDoc(ref, {
      saved: !isSaved,
      savedAt: serverTimestamp()
    }, { merge: true });
  }catch(e){
    console.error("Failed to save word", e);
    // Roll back the optimistic UI update if the write failed
    if (isSaved) { savedIndices.add(current.idx); } else { savedIndices.delete(current.idx); }
    updateSaveButton();
    alert("Couldn't save this word. Please check your connection and try again.");
  }
};

  listEl.innerHTML = "<p class=\"saved-empty\">Loading…</p>";

  let indices;

    indices = await getSavedIndices();
  }catch(e){
    console.error("Failed to fetch saved words", e);
    listEl.innerHTML = "<p class=\"saved-empty\">Couldn't load saved words. Please check your connection.</p>";
    return;
  }

  if (indices.length === 0){
    listEl.innerHTML = "<p class=\"saved-empty\">No saved words yet — tap the ☆ on a question to save it here.</p>";
    return;
  }

  renderSavedList(indices);
};

function renderSavedList(indices){
  const listEl = document.getElementById("savedList");
  listEl.innerHTML = "";
  indices.forEach(i => {
    const w = quizData[i];
    if (!w) return;
    const row = document.createElement("div");
    row.className = "saved-item";
    row.innerHTML = `
      
      <div class="info">
        <div class="word">${w.kanji}</div>
        <div class="meaning">${w.romaji} — ${w.en}${w.formKanji ? "<br>→ " + w.formKanji + " · " + w.formRomaji + (w.group ? " · Group " + w.group : "") : ""}</div>
      </div>
      <button class="remove-btn" title="Remove">✕</button>
    `;
    row.querySelector(".remove-btn").onclick = async () => {
      const ref = doc(db, "users", currentUserId, PROGRESS_COL, String(i));
      try{
        await setDoc(ref, { saved: false }, { merge: true });
        savedIndices.delete(i);
      }catch(e){
        console.error("Failed to remove saved word", e);
        alert("Couldn't remove this word. Please check your connection and try again.");
        return;
      }
      const remaining = indices.filter(x => x !== i);
      indices.length = 0;
      indices.push(...remaining);
      if (indices.length === 0){
        listEl.innerHTML = "<p class=\"saved-empty\">No saved words yet — tap the ☆ on a question to save it here.</p>";
      } else {
        renderSavedList(indices);
      }
    };
    listEl.appendChild(row);
  });
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

window.start = function(){
  currentQuizMode = "normal";
  quiz = shuffle(quizData).slice(0, studyMode === "conjugation" ? 15 : 12);

  document.getElementById("groupDisplay").style.display = studyMode === "conjugation" ? "block" : "none";

function nextQuestion() {
  document.getElementById("conjugationNext").hidden = true;
  document.getElementById("groupDisplay").style.display = "none";
  document.getElementById("exDisplay").style.display = "none";
  document.getElementById("message").textContent = "";
  document.getElementById("scoreCorrect").textContent = score;
  document.getElementById("scoreAttempted").textContent = index + 1;
  document.getElementById("qNum").textContent = Math.min(index + 1, quiz.length);
  document.getElementById("qTotal").textContent = quiz.length;

  // Finished
  if (index >= quiz.length) {
    document.getElementById("answers").style.display = "none";
    document.getElementById("message").style.display = "none";
    document.getElementById("metaRow").style.display = "none";

    let rate = score / quiz.length;
    let stars =
        rate === 1 ? "⭐⭐⭐⭐⭐" :
        rate >= 0.8 ? "⭐⭐⭐⭐" :
        rate >= 0.6 ? "⭐⭐⭐" :
        rate >= 0.4 ? "⭐⭐" : "⭐";

    document.getElementById("stars").textContent = stars;
    document.getElementById("finalScore").textContent = `${score} / ${quiz.length}`;
    document.querySelector("#result h2").textContent =
        currentQuizMode === "review" ? "🎉 Review Complete! 🎉" : "🎉 Great Job! 🎉";

    const missed = quiz.length - score;
    const hint = document.getElementById("reviewHint");
    if (currentQuizMode === "normal" && missed > 0) {
      hint.textContent = `💡 Want to redo just the ${missed} you missed? Tap "Back to Menu", then "Review Missed Questions".`;
      hint.style.display = "block";
    } else {
      hint.textContent = "";
      hint.style.display = "none";
    }

    document.getElementById("result").style.display = "block";
    document.querySelector(".play-again").style.display = "inline-block";
    document.querySelector(".back-menu").style.display = "inline-block";
    return;
  }

  document.getElementById("answers").style.display = "flex";
  document.getElementById("message").style.display = "block";
  document.getElementById("metaRow").style.display = "flex";

  const current = quiz[index];

  // Show the question
  updateView();

  if (studyMode === "conjugation") { renderGroupQuestion(); return; }

  // Answer choices
  let choices;
  if (fixedChoices[current.kana]) {
    choices = fixedChoices[current.kana];
  } else {
    choices = [current.en];
    while (choices.length < 4) {
      let word = quizData[Math.floor(Math.random() * quizData.length)].en;
      if (!choices.includes(word)) {
        choices.push(word);
      }
    }
    choices = shuffle(choices);
  }

  let html = "";
  choices.forEach(choice => {
    const safeChoice = choice.replace(/'/g, "\\'");
    html += `<div class="answer" onclick="answer(this,'${safeChoice}')">${choice}</div>`;
  });

  document.getElementById("answers").innerHTML = html;
}

window.answer = function(element, choice) {
  let current = quiz[index];
  document.querySelectorAll(".answer").forEach(btn => btn.onclick = null);

  const isCorrect = choice === current.en;
  if (isCorrect) {
    score++;
    element.classList.add("correct");
    document.getElementById("message").textContent = "✨ Correct!";
    correctSound();
  } else {
    element.classList.add("wrong");
    document.querySelectorAll(".answer").forEach(btn => {
      if (btn.textContent === current.en) btn.classList.add("correct");
    });
    document.getElementById("message").textContent = "❌ " + current.en;
    wrongSound();
  }

  // Record this user's correct/incorrect result in Firestore.
  // The "Review Missed Questions" feature works from this record.
  updateProgress(current.idx, isCorrect).catch(e => console.error("Failed to save progress", e));

  setTimeout(() => {
    index++;
    nextQuestion();
  }, 1000);
};

window.restart = function(){
  if(currentQuizMode === "review"){
    window.startReview();
  } else {
    window.start();
  }
};

window.setStudyMode = async function(value) {
  if (value !== 'vocabulary' && value !== 'conjugation') return;
  studyMode = value;
  quizData = value === 'conjugation' ? conjugationQuizData : vocabularyQuizData;
  PROGRESS_COL = value === 'conjugation' ? 'progress_lesson23_conjugation' : 'progress_lesson23';
  savedIndices = new Set();
  quiz = [];
  index = 0;
  document.getElementById('studyModeHint').textContent = value === 'conjugation'
    ? '15 grammar questions. Read the English and build the Japanese phrase or sentence using letter buttons.'
    : '12 random vocabulary questions. Choose the English meaning.';
  const buttons = [document.getElementById('vocabModeBtn'), document.getElementById('conjugationModeBtn')];
  buttons.forEach((button,i) => {
    const active = (i === 0) === (value === 'vocabulary');
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
    button.disabled = true;
  });
  try { await showMenu(); } finally { buttons.forEach(button => button.disabled = false); }
};
function escapeQuizText(text) {
  return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderGroupQuestion() {
  chosenGroup = null;
  conjugationAnswered = false;
  const group = document.getElementById('groupDisplay');
  group.style.display = 'block';
  group.textContent = quiz[index].target + ' · Step 1 / 2 · Choose the verb group';
  if (!quiz[index].group) { chosenGroup = 0; setupFormBuilder(quiz[index]); group.textContent = quiz[index].target + ' · Build the Japanese sentence'; renderFormBuilder(); return; }
  document.getElementById('answers').innerHTML = [1,2,3].map(g => '<div class="answer" role="button" tabindex="0" onclick="chooseGroup('+g+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();chooseGroup('+g+')} ">Group '+g+'</div>').join('');
}
function setupFormBuilder(current) {
  
  // Keep the lexical prefix; leave the conjugating kana for the learner.
  builderPrefix = current.prefix;
  builderSuffix = current.suffix;
  if (!current.form.startsWith(builderPrefix)) throw new Error('Invalid verb prefix: '+current.kana);
  builderText = '';
  const required = current.form.slice(builderPrefix.length,current.form.length-builderSuffix.length);
  const bank = conjugationKind === 'plain' ? 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんっゃゅょがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンッャュョー'
    : conjugationKind === 'ta' ? 'いっんただしきくりてで'
    : conjugationKind === 'te' ? 'いっんてでしきくり'
    : conjugationKind === 'nai' ? 'あかがさたなばまらわいえしこくん'
    : 'うくぐすつぬぶむるいえしきこ';
  const extras = shuffle([...bank].filter(c => !required.includes(c))).slice(0,6);
  builderLetters = shuffle([...new Set([...required,...extras])]);
}
function renderFormBuilder() {
  const locked = conjugationAnswered;
  const field = '<div id="builtForm" class="built-form '+(locked ? (quiz[index].lastFormCorrect?'correct':'wrong') : '')+'" aria-live="polite">'
    +'<span>'+escapeQuizText(builderPrefix)+'</span><strong>'+escapeQuizText(builderText || '＿')+'</strong><span>'+escapeQuizText(builderSuffix)+'</span></div>';
  const letters = builderLetters.map((letter,i) => '<button type="button" class="answer kana-key" onclick="addFormLetter('+i+')" '+(locked?'disabled':'')+'>'+escapeQuizText(letter)+'</button>').join('');
  document.getElementById('answers').innerHTML = field
    +'<p class="builder-hint">Tap letters to build the Japanese phrase or sentence. You can use a letter more than once.</p>'
    +'<div class="kana-bank">'+letters+'</div>'
    +'<div class="builder-actions"><button type="button" class="secondary-btn" onclick="undoFormLetter()" '+(locked || !builderText?'disabled':'')+'>⌫ Undo</button>'
    +'<button type="button" class="secondary-btn" onclick="clearFormLetters()" '+(locked || !builderText?'disabled':'')+'>Clear</button>'
    +'<button type="button" onclick="checkBuiltForm()" '+(locked || !builderText?'disabled':'')+'>Check</button></div>';
}
window.addFormLetter = function(i) {
  if (studyMode !== 'conjugation' || chosenGroup === null || conjugationAnswered || !Number.isInteger(i) || !builderLetters[i] || builderText.length >= 40) return;
  builderText += builderLetters[i]; renderFormBuilder();
};
window.undoFormLetter = function() {
  if (studyMode !== 'conjugation' || chosenGroup === null || conjugationAnswered) return;
  builderText = builderText.slice(0,-1); renderFormBuilder();
};
window.clearFormLetters = function() {
  if (studyMode !== 'conjugation' || chosenGroup === null || conjugationAnswered) return;
  builderText = ''; renderFormBuilder();
};
window.chooseGroup = function(group) {
  if (studyMode !== 'conjugation' || chosenGroup !== null || ![1,2,3].includes(group)) return;
  chosenGroup = group;
  document.getElementById('groupDisplay').textContent = quiz[index].target + ' · Step 2 / 2 · Build the ' + conjugationLabel;
  setupFormBuilder(quiz[index]);
  renderFormBuilder();
};
window.checkBuiltForm = function() {
  if (studyMode !== 'conjugation' || chosenGroup === null || conjugationAnswered || !builderText) return;
  conjugationAnswered = true;
  const current = quiz[index];
  const groupCorrect = chosenGroup === current.group;
  const formCorrect = builderPrefix + builderText + builderSuffix === current.form;
  const correct = groupCorrect && formCorrect;
  if (correct) { score++; correctSound(); } else { wrongSound(); }
  document.getElementById('message').textContent = correct ? '✨ Correct!' : 'Review the completed sentence below.';
  document.getElementById('groupDisplay').textContent = current.target + (current.group ? ' · Group ' + current.group + ' · ' + (groupCorrect ? 'Group correct ✓' : 'You chose Group ' + chosenGroup) : ' · Grammar');
  current.lastGroupCorrect = groupCorrect;
  current.lastFormCorrect = formCorrect;
  renderFormBuilder();
  updateConjugationFeedback();
  document.getElementById('scoreCorrect').textContent = score;
  document.getElementById('scoreAttempted').textContent = index+1;
  updateProgress(current.idx,correct).catch(e => console.error('Failed to save progress',e));
  document.getElementById('conjugationNext').hidden = false;
};
function updateConjugationFeedback() {
  if (!conjugationAnswered || index >= quiz.length) return;
  const current = quiz[index], el = document.getElementById('exDisplay');
  el.style.display = 'block';
  el.innerHTML = '<div class="conjugation-answer">'+current.kanji+' → '+current.formKanji+'</div>'
    + '<div>'+escapeQuizText(current.formRomaji)+' · '+escapeQuizText(current.en)+'</div>'
    + '<div class="conjugation-rule">'+current.rule+'</div>'
    + '<div class="conjugation-status">'+(current.group ? 'Group: '+(current.lastGroupCorrect?'✓':'✗')+' · ' : '')+'Form: '+(current.lastFormCorrect?'✓':'✗')+'</div>';
}
window.nextConjugation = function() {
  if (studyMode !== 'conjugation' || !conjugationAnswered) return;
  conjugationAnswered = false;
  index++;
  nextQuestion();
};

// ===== Init =====
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("quizUserName");
  if(saved){
    document.getElementById("userNameInput").value = saved;
  }
});

</script>
