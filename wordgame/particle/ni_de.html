<title>Particle Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

:root{
  --bg1:#ffe0f0;
  --bg2:#e5d4ff;
  --panel:#ffffff;
  --ink:#4a1942;
  --muted:#9b7ea8;
  --accent:#ff6fa8;
  --accent2:#a78bfa;
  --correct:#3cb371;
  --wrong:#ff5c5c;
  --shadow: 0 8px 20px rgba(107,33,168,0.15);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#241329;
    --bg2:#1a1030;
    --panel:#2c1a33;
    --ink:#f6e9fb;
    --muted:#c9a9d6;
    --accent:#ff8cba;
    --accent2:#c3aeff;
    --correct:#4fd18a;
    --wrong:#ff7a7a;
    --shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#241329;
  --bg2:#1a1030;
  --panel:#2c1a33;
  --ink:#f6e9fb;
  --muted:#c9a9d6;
  --accent:#ff8cba;
  --accent2:#c3aeff;
  --correct:#4fd18a;
  --wrong:#ff7a7a;
  --shadow: 0 8px 20px rgba(0,0,0,0.35);
}

body{
  font-family:'Quicksand',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg, var(--bg1), var(--bg2));
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 28px 12px 60px;
  margin:0;
  color:var(--ink);
}

#app{
  width:100%;
  max-width:440px;
}

h1 {
  text-align:center;
  margin: 6px 0 2px;
  font-family:'Baloo 2', 'Quicksand', sans-serif;
  font-weight:800;
  font-size: 2.1rem;
  letter-spacing:0.01em;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  display:inline-block;
  width:100%;
}
.sub{
  text-align:center;
  color:var(--muted);
  font-size:0.85rem;
  font-weight:600;
  letter-spacing:0.03em;
  margin-bottom:16px;
}

.screen{
  background:var(--panel);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding: 26px 22px;
  width: 100%;
  margin: 0 auto 18px auto;
  text-align: center;
}
.screen h2{
  color: var(--ink);
  margin-top: 0;
  font-family:'Baloo 2', 'Quicksand', sans-serif;
  font-weight:700;
  font-size:1.4rem;
}

.wrong-count{
  font-size: 13px;
  color:var(--muted);
  font-weight:700;
  margin-top: 2px;
  margin-bottom: 14px;
}

button {
  padding: 13px 24px;
  font-size: 16px;
  font-weight: 800;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  font-family:inherit;
  transition: transform 0.08s ease;
}
.menu-btn, .primary-btn, .play-again{
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:white;
  box-shadow:var(--shadow);
  width:100%;
  display:block;
  margin-top:12px;
}
.menu-btn:active, .primary-btn:active, .play-again:active{
  transform:translateY(1px);
}
.secondary-btn, .back-menu{
  background:var(--panel);
  color:var(--ink);
  border:2px solid var(--accent2);
  width:100%;
  display:block;
  margin-top:12px;
}
.secondary-btn:hover, .back-menu:hover{
  border-color:var(--accent);
}
.play-again, .back-menu{
  display:none;
  margin-top:16px;
}
.result-buttons{
  display:flex;
  flex-direction:column;
  gap:0;
}

.meta-row{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.pill{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  background:var(--panel);
  border-radius:999px;
  padding:8px 16px;
  box-shadow:var(--shadow);
  font-weight:800;
  font-size:0.9rem;
}
.pill .star{ color:#ffb703; }

.controls {
  background:var(--panel);
  border-radius:16px;
  box-shadow:var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin: 0 auto 14px auto;
  padding:12px 16px;
  width: fit-content;
  font-size:0.85rem;
  font-weight:700;
}
.controls label {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  padding:3px 0;
}
.error-card {
  background: var(--panel);
  border: 2px solid var(--wrong);
  border-radius: 16px;
  padding: 16px 20px;
  margin: 14px auto 0 auto;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.5;
  box-shadow: var(--shadow);
  text-align: left;
  width: 100%;       /* 幅を親要素（#app）に対して100%にする */
  box-sizing: border-box; /* パディングを含めて幅を計算する */
}


.card {
  position:relative;
  background:var(--panel);
  border-radius: 24px;
  box-shadow:var(--shadow);
  padding: 22px 18px 18px;
  width: 100%;
  margin: 0 auto 14px auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap:8px;
}

.qlabel{
  display:inline-flex;
  align-items:center;
  gap: 4px;
  background:linear-gradient(135deg, #e0f2fe, #dbeafe);
  color: #3b82f6;
  font-weight:800;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.78rem;
  letter-spacing: 0.05em;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.8);
}

.sentence-display {
  font-size: clamp(20px, 5.4vw, 27px);
  font-weight: 800;
  text-align:center;
  color: var(--ink);
  margin-top: 6px;
  line-height: 2.3;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:2px;
  min-height:90px;
}

ruby rt {
  color: var(--accent2);
  font-size: 0.5em;
  font-weight: bold;
}

.blank {
  display:inline-block;
  min-width:38px;
  height:34px;
  line-height:30px;
  border-bottom:3px solid var(--accent2);
  opacity:0.35;
  margin:0 4px;
  font-weight:800;
  color:var(--accent2);
  text-align:center;
  transition: all 0.15s ease;
}
.blank.active{
  border-bottom-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 10%, transparent);
  border-radius:8px 8px 0 0;
  opacity:1;
}
.blank.filled{
  border-bottom-color:var(--accent2);
  color:var(--accent2);
  opacity:1;
}

#answers{
  width:100%;
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:10px;
  margin-top:10px;
}

.answer {
  width:100%;
  box-sizing:border-box;
  padding: 18px 10px;
  font-size: 24px;
  font-weight: 800;
  border: 2px solid var(--accent2);
  border-radius: 14px;
  text-align: center;
  background: color-mix(in srgb, var(--accent) 6%, var(--panel));
  color:var(--ink);
  cursor: pointer;
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}

.answer:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}

.correct{
  background:color-mix(in srgb, var(--correct) 18%, var(--panel));
  border-color:var(--correct);
  color:var(--correct);
  animation:bounce .45s;
}

.wrong{
  background:color-mix(in srgb, var(--wrong) 18%, var(--panel));
  border-color:var(--wrong);
  color:var(--wrong);
  animation:shake .45s;
}

#message{
  height: auto;
  margin-top:4px;
  font-size:16px;
  font-weight:800;
  text-align: center;
}

@keyframes bounce{
0%{transform:scale(1);}
35%{transform:scale(1.05);}
60%{transform:scale(.97);}
100%{transform:scale(1);}
}

@keyframes shake{
0%,100%{transform:translateX(0);}
20%{transform:translateX(-6px);}
40%{transform:translateX(6px);}
60%{transform:translateX(-6px);}
80%{transform:translateX(6px);}
}

@keyframes fadeIn{
from{ opacity:0; transform:translateY(15px); }
to{ opacity:1; transform:translateY(0); }
}

.summary-jp{
  font-family:'Quicksand';
  font-size: clamp(19px, 5vw, 24px);
  font-weight:800;
  line-height:2;
  margin:6px 0 10px;
  color:var(--ink);
}
.summary-en{ color:var(--muted); font-size:0.92rem; margin-bottom:16px; font-weight:600; }
#summaryNotes{ margin-bottom:8px; }
.note{
  text-align:left;
  background:color-mix(in srgb, var(--accent) 6%, var(--panel));
  border:2px solid var(--accent2);
  border-radius:12px;
  padding:9px 13px;
  margin-bottom:8px;
  font-size:0.85rem;
  color:var(--ink);
  line-height:1.4;
}
.note b{ color:var(--accent2); }

#result{
  display:none;
  background:var(--panel);
  border-radius:24px;
  box-shadow:var(--shadow);
  text-align:center;
  padding:24px 20px;
  margin-top:6px;
  animation:fadeIn .5s;
}

#stars {
  font-size: 46px;
  margin: 10px 0;
  display: inline-block;
}

#result h2{
  font-family:'Baloo 2', 'Quicksand', sans-serif;
  font-weight:700;
  font-size:1.5rem;
  margin:4px 0 10px;
  color:var(--ink);
}

#result p{
  font-size:1.1rem;
  font-weight:800;
  color:var(--muted);
}

.hint{
  display:none;
  background:color-mix(in srgb, var(--accent) 6%, var(--panel));
  border:2px solid var(--accent2);
  border-radius:14px;
  padding:10px 14px;
  margin:14px 0 0;
  font-size:0.85rem;
  font-weight:600;
  color:var(--ink);
  line-height:1.4;
}

.home{

margin-top:35px;
margin-bottom:35px;

padding:12px 30px;

background:#818cf8;

color:white;

border-radius:20px;

text-decoration:none;

font-weight:bold;

transition:.3s;

}

.home:hover{

transform:scale(1.05);

}
</style>

<div id="app">

<h1>📍Particle Quiz📍</h1>
<div class="sub">Choose に or で</div>

<div id="menuScreen" class="screen">
  <h2 id="menuGreeting">Ready to practice? 📍</h2>
  <div class="wrong-count" id="missedCountDisplay"></div>

  <button class="secondary-btn" id="reviewBtn">🔁 Review Missed Questions</button>
</div>

<div class="meta-row" id="metaRow" style="display:none;">
  <div class="pill"><span class="star">⭐</span> Score <span id="scoreCorrect">0</span> / <span id="scoreAttempted">0</span></div>
  <div class="pill">📝 Q <span id="qNum">1</span> / <span id="qTotal">1</span></div>
</div>

<div class="controls" id="controlsArea" style="display:none;">
  <label><input type="checkbox" id="soundMode" checked> Sound Effects</label>
</div>

<div id="quizContainer" style="display:none;">
  <div class="card">
    <div id="translationTag" class="qlabel"></div>
    <div id="sentenceDisplay" class="sentence-display"></div>
  </div>
</div>

<div id="answers" style="display:none;"></div>

<div id="message" style="display:none;"></div>

<div id="summaryCard" class="screen" style="display:none;">
  <h2>Nice! ✨</h2>
  <div class="summary-jp" id="summaryJp"></div>
  <div class="summary-en" id="summaryEn"></div>
  <div id="summaryNotes"></div>
  <button class="primary-btn" id="nextBtn">Next Question ➡️</button>
</div>

<div id="result">
  <h2 id="resultTitle">🎉 Great Job! 🎉</h2>
  <div id="stars"></div>
  <p id="finalScore"></p>
  <p class="hint" id="reviewHint"></p>
  <div class="result-buttons">
    <button class="play-again" id="playAgainBtn">Play Again</button>
    <button class="back-menu" id="backMenuBtn">Back to Menu</button>
  </div>
</div>

</div>

      options: ["に", "で"] },

      segments: ["<ruby>会社<rt>かいしゃ</rt></ruby>", "___", "<ruby>友達<rt>ともだち</rt></ruby>と<ruby>話<rt>はな</rt></ruby>します。"],

      options: ["に", "で"] }

  quizData.forEach((item, i) => { item.idx = i; });

  // Only two particles are in play, so every question offers exactly に and で.
  const masterParticles = [...new Set(quizData.flatMap((q) => q.options))];
  const CHOICE_COUNT = 2;

  function buildChoices(slot) {
    const correct = slot.ans.slice();
    const distractorPool = shuffle(masterParticles.filter((p) => !correct.includes(p)));
    const needed = Math.max(0, CHOICE_COUNT - correct.length);
    return shuffle([...correct, ...distractorPool.slice(0, needed)]);
  }

  const STORAGE_KEY = "niDeQuizMissed";
  function loadMissed() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch (e) { return []; }
  }
  function saveMissed() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...missedSet])); }
    catch (e) { /* ignore */ }
  }

  let missedSet = new Set(loadMissed());
  let quiz = [], qPos = 0, slotIndex = 0, recordedAnswers = [];
  let score = 0, mode = "normal", sessionHadWrong = false;
  let audioCtx = null;

  const el = (id) => document.getElementById(id);

  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

  function playTone(freq, duration) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = "triangle";
      gain.gain.value = 0.15;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* audio unsupported */ }
  }
  function correctSound() {
    if (!el("soundMode").checked) return;
    playTone(700, .08);
    setTimeout(() => playTone(900, .12), 90);
  }
  function wrongSound() {
    if (!el("soundMode").checked) return;
    playTone(180, .25);
  }

  function updateMenu() {
    const n = missedSet.size;
    el("missedCountDisplay").textContent = n === 0
      ? "No missed questions right now 🎉"
      : `${n} question(s) to review`;
  }

  function showScreen(name) {
    el("menuScreen").style.display = name === "menu" ? "block" : "none";
    el("metaRow").style.display = name === "quiz" ? "flex" : "none";
    el("controlsArea").style.display = name === "quiz" ? "flex" : "none";
    el("quizContainer").style.display = name === "quiz" ? "block" : "none";
    el("answers").style.display = name === "quiz" ? "flex" : "none";
    el("message").style.display = name === "quiz" ? "block" : "none";
    el("summaryCard").style.display = name === "summary" ? "block" : "none";
    el("result").style.display = name === "result" ? "block" : "none";
    el("playAgainBtn").style.display = name === "result" ? "inline-block" : "none";
    el("backMenuBtn").style.display = name === "result" ? "inline-block" : "none";
  }

  function startAll() {
    mode = "normal";
    quiz = shuffle(quizData).slice(0, 20);
    qPos = 0; score = 0;
    showScreen("quiz");
    loadQuestion();
  }

  function startReview() {
    if (missedSet.size === 0) {
      alert("No missed questions — great job! 🎉");
      return;
    }
    mode = "review";
    quiz = shuffle([...missedSet].map((i) => quizData[i]).filter(Boolean));
    qPos = 0; score = 0;
    showScreen("quiz");
    loadQuestion();
  }

  function loadQuestion() {
    if (qPos >= quiz.length) { showResult(); return; }
    slotIndex = 0;
    recordedAnswers = [];
    sessionHadWrong = false;
    el("message").textContent = "";
    updateMeta();
    const q = quiz[qPos];
    el("translationTag").textContent = q.translation;
    renderSentence();
    renderOptions();
    showScreen("quiz");
  }

  function updateMeta() {
    el("scoreCorrect").textContent = score;
    el("scoreAttempted").textContent = qPos + 1;
    el("qNum").textContent = Math.min(qPos + 1, quiz.length);
    el("qTotal").textContent = quiz.length;
  }

  function renderSentence() {
    const q = quiz[qPos];
    const disp = el("sentenceDisplay");
    disp.innerHTML = "";
    let slotCount = 0;
    q.segments.forEach((seg) => {
      if (seg === "___") {
        const span = document.createElement("span");
        span.className = "blank";
        if (slotCount === slotIndex) span.classList.add("active");
        if (slotCount < slotIndex) {
          span.classList.add("filled");
          span.textContent = recordedAnswers[slotCount];
        }
        disp.appendChild(span);
        slotCount++;
      } else {
        const span = document.createElement("span");
        span.innerHTML = seg;
        disp.appendChild(span);
      }
    });
  }

  function renderOptions() {
    const q = quiz[qPos];
    const options = buildChoices(q.slots[slotIndex]);
    const box = el("answers");
    box.innerHTML = "";
    options.forEach((opt) => {
      const div = document.createElement("div");
      div.className = "answer";
      div.textContent = opt;
      div.onclick = () => selectOption(opt, div);
      box.appendChild(div);
    });
  }

  function selectOption(value, target) {
    const q = quiz[qPos];
    const slot = q.slots[slotIndex];
    document.querySelectorAll(".answer").forEach((b) => { b.onclick = null; });


    if (slot.ans.includes(value)) {
      target.classList.add("correct");
      correctSound();
      recordedAnswers.push(value);
      slotIndex++;
      el("message").textContent = "✨ Correct!";
      renderSentence();

      if (slotIndex >= q.slots.length) {
        if (!sessionHadWrong) { score++; missedSet.delete(q.idx); }
        else { missedSet.add(q.idx); }
        saveMissed();
        updateMeta();
        setTimeout(() => showSummary(), 500);
      } else {
        updateMeta();
        setTimeout(() => {
          el("message").textContent = "";
          renderOptions();
        }, 500);
      }
  // selectOption 関数の中の不正解（else）の部分
    } else {
      sessionHadWrong = true;
      target.classList.add("wrong");
      wrongSound();
      
      // ▼ ここを修正：クラス「error-card」を付与して白背景・大きめ文字にする
      const msgEl = el("message");
      msgEl.className = "error-card";
      msgEl.innerHTML = "❌ " + slot.exp;

      setTimeout(() => {
        msgEl.textContent = "";
        msgEl.className = ""; // クラスをリセット
        renderOptions();
      }, 1500); // 解説が読みやすいように少し時間を延ばす場合はここを調整（1100 -> 1500など）
    }
  }

  function showSummary() {
    const q = quiz[qPos];
    el("summaryJp").innerHTML = q.fullJpHtml;
    el("summaryEn").textContent = q.translation;
    el("summaryNotes").innerHTML = q.slots.map((s) =>
      '<div class="note"><b>' + s.ans.join(" / ") + "</b> — " + s.exp + "</div>"
    ).join("");
    showScreen("summary");
  }

  function showResult() {
    showScreen("result");
    const rate = quiz.length ? score / quiz.length : 0;
    const stars =
      rate === 1 ? "⭐⭐⭐⭐⭐" :
      rate >= 0.8 ? "⭐⭐⭐⭐" :
      rate >= 0.6 ? "⭐⭐⭐" :
      rate >= 0.4 ? "⭐⭐" : "⭐";
    el("stars").textContent = stars;
    el("finalScore").textContent = `${score} / ${quiz.length}`;
    el("resultTitle").textContent = mode === "review" ? "🎉 Review Complete! 🎉" : "🎉 Great Job! 🎉";

    const missed = quiz.length - score;
    const hint = el("reviewHint");
    if (mode === "normal" && missed > 0) {
      hint.textContent = `💡 Want to redo just the ${missed} you missed? Tap "Back to Menu", then "Review Missed Questions".`;
      hint.style.display = "block";
    } else {
      hint.textContent = "";
      hint.style.display = "none";
    }
  }

  el("startAllBtn").addEventListener("click", startAll);
  el("reviewBtn").addEventListener("click", startReview);
  el("nextBtn").addEventListener("click", () => { qPos++; loadQuestion(); });
  el("playAgainBtn").addEventListener("click", () => { mode === "review" ? startReview() : startAll(); });
  el("backMenuBtn").addEventListener("click", () => { updateMenu(); showScreen("menu"); });

  updateMenu();
  showScreen("menu");
})();
