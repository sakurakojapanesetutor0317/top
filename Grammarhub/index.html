<style>* {
  box-sizing:border-box;
}
a {
  color:inherit;
  text-decoration:none;
}
h1 {
  margin:0;
}
h2 {
  margin:0;
}
h3 {
  margin:0;
}
p {
  margin:0;
}
img {
  max-width:100%;
  display:block;
}
[hidden] {
  display:none!important;

.hub-top {
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:18px;
  margin-bottom:28px;
}
.hub-title-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.hub-title {
  color:#75518F;
}
.furi-btn {
  flex:none;
  border:1px solid #EEEAF4;
  background:#fff;
  border-radius:999px;
  padding:6px 14px;
  font:500 .82rem "Poppins",sans-serif;
  color:#54485f;
  cursor:pointer;
}
.furi-btn[aria-pressed="true"] {
  color:#df739c;
  border-color:#F3C9D8;
}
.is-home .furi-btn {
  display:none;
}
.search-bar {
  display:flex;
  align-items:center;
  gap:12px;
  height:56px;
  padding:0 18px;
  background:#fff;
  border:1px solid #EEEAF4;
  border-radius:14px;
  color:#8d8199;
  box-shadow:0 4px 12px rgba(100,82,118,.04);
}
.search-bar:focus-within {
  border-color:#6FA3E6;
  box-shadow:0 0 0 3px rgba(111,163,230,.18);
}
.search-bar svg {
  width:20px;
  height:20px;
  flex:none;
}
.search-bar input {
  flex:1;
  min-width:0;
  height:100%;
  border:0;
  background:none;
  outline:0;
  font:inherit;
  font-size:16px;
  color:#54485f;
}
.search-bar input::placeholder {
  color:#a39aae;
}
.category {
  --category-bg:#FFF0F5;
  --category-accent:#D9769E;
  --category-border:#F5D6E3;
  margin-top:18px;
  padding:16px;
  border-radius:16px;
  background:var(--category-bg);
}
.category.forms {
  --category-bg:#F1EEFF;
  --category-accent:#9675C9;
  --category-border:#DFD7F4;
}
.category.functions {
  --category-bg:#EAF5FF;
  --category-accent:#6096CE;
  --category-border:#D2E6F7;
}
.category-head {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}
.category-icon {
  position:relative;
  display:block;
  flex:none;
  width:52px;
  height:52px;
}
.category-icon img {
  position:absolute;
  left:50%;
  top:50%;
  width:148px;
  height:148px;
  max-width:none;
  object-fit:contain;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.category h2 {
  font-family:"Poppins",sans-serif;
  font-size:1.3rem;
  font-weight:600;
  line-height:1.25;
  color:var(--category-accent);
}
.game-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.game-grid.level-grid {
  grid-template-columns:repeat(5,minmax(0,1fr));
}
.level-grid .game-title {
  font-size:1.25rem;
  font-weight:700;
}
.game-card {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-width:0;
  min-height:72px;
  padding:12px;
  border-radius:12px;
  background:#fff;
  border:1.5px solid var(--category-border);
  box-shadow:0 2px 8px rgba(52,52,91,.05);
  color:#54485f;
  text-decoration:none;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.game-card:hover {
  transform:translateY(-3px);
  border-color:var(--category-accent);
  box-shadow:0 6px 14px rgba(52,52,91,.08);
}
.game-card:focus-visible {
  outline:3px solid var(--category-accent);
  outline-offset:3px;
}
.game-title {
  min-width:0;
  font-family:"Poppins",sans-serif;
  font-size:.92rem;
  font-weight:600;
  line-height:1.35;
  overflow-wrap:break-word;
}
.game-arrow {
  display:grid;
  place-items:center;
  flex:none;
  width:30px;
  height:30px;
  border-radius:50%;
  background:var(--category-accent);
  color:#fff;
}
.game-arrow svg {
  width:16px;
  height:16px;
}
@media (max-width:1000px) {
.game-grid {
  grid-template-columns:repeat(2,minmax(0,1fr));
}
}
@media (max-width:600px) {
.category {
  padding:12px;
}
.category h2 {
  font-size:1.12rem;
}
.game-grid {
  gap:10px;
}
.game-card {
  min-height:64px;
  padding:10px;
  gap:5px;
}
.game-title {
  font-size:.84rem;
}
.game-arrow {
  width:26px;
  height:26px;
}
.game-arrow svg {
  width:14px;
  height:14px;
}
.game-grid.level-grid {
  gap:6px;
}
.level-grid .game-card {
  min-height:56px;
  padding:6px 3px;
  justify-content:center;
}
.level-grid .game-title {
  font-size:1rem;
}
.level-grid .game-arrow {
  display:none;
}
}
@media (max-width:360px) {
.game-grid.level-grid {
  gap:4px;
}
.level-grid .game-title {
  font-size:.92rem;
}
}
@media (prefers-reduced-motion:reduce) {
.game-card {
  transition:none;
}
}
:root {
  --bg:#fbf9ff;
  --surface:#ffffff;
  --ink:#24203a;
  --muted:#6c6787;
  --line:#ebe7f5;
  --n5:#ff7462;
  --n4:#A875B5;
  --n3:#2fb37a;
  --n2:#4f6bed;
  --n1:#c4407e;
  --form:#11a3b8;
  --fn:#e9a800;
  --fn-ink:#7a5800;
  --rel:#7c5cf0;
  --hub:#13a088;
  --practice:#22ad78;
  --game:#ff4f86;
  --video:#3a8ff0;
  --speak:#f08a12;
  --wrong:#e2484a;
  --right:#22ad78;
  --mark:#ffe58a;
  --mark-ink:#24203a;
  --f-hero:"Poppins","Noto Sans JP",sans-serif;
  --f-ui:"Poppins","Noto Sans JP",sans-serif;
  --f-jp:"Noto Sans JP",sans-serif;
  --r-lg:26px;
  --r:18px;
  --r-sm:12px;
  --shadow:0 1px 2px rgba(36,32,58,.05),0 8px 24px -12px rgba(36,32,58,.18);
}
button:not(.menu-btn) {
  font:inherit;
  color:inherit;
  cursor:pointer;
}
:focus-visible {
  outline:3px solid var(--rel);
  outline-offset:2px;
  border-radius:8px;
}
.jp {
  font-family:var(--f-jp);
}
rt {
  font-size:.5em;
  color:var(--muted);
  font-weight:500;
}
body.no-furi rt {
  display:none;
}
mark.g {
  background:var(--mark);
  color:var(--mark-ink);
  padding:0 .15em;
  border-radius:5px;
}
.crumbs {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  font-size:.85rem;
  color:var(--muted);
  margin-bottom:14px;
}
.crumbs a {
  font-weight:600;
  padding:2px 8px;
  border-radius:8px;
}
.crumbs a:hover {
  background:var(--surface);
}
.crumbs .here {
  color:var(--ink);
  font-weight:700;
}
.tag {
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  font-size:.85rem;
  padding:6px 12px;
  border-radius:999px;
  border:1.5px solid transparent;
  transition:transform .15s,box-shadow .15s;
  white-space:nowrap;
}
a.tag:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.tag-lv {
  --c:var(--n5);
  background:var(--c);
  color:#fff;
  border-radius:10px;
  font-family:var(--f-ui);
}
.tag-lv.ghost {
  background:color-mix(in srgb,var(--c) 14%,var(--surface));
  color:var(--c);
}
.tag-form {
  --c:var(--form);
  background:color-mix(in srgb,var(--c) 14%,var(--surface));
  color:var(--c);
  border-color:color-mix(in srgb,var(--c) 45%,transparent);
}
.tag-form::before {
  content:"+";
  font-weight:800;
  width:16px;
  height:16px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--c);
  color:var(--surface);
  font-size:.8rem;
  line-height:1;
}
.tag-fn {
  --c:var(--fn);
  background:color-mix(in srgb,var(--c) 22%,var(--surface));
  color:var(--fn-ink);
}
.tag-fn::before {
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--c);
}
.tag-sm {
  font-size:.75rem;
  padding:3px 9px;
}
.tag-sm.tag-form::before {
  width:13px;
  height:13px;
  font-size:.7rem;
}
.hero {
  position:relative;
  overflow:hidden;
  border-radius:var(--r-lg);
  padding:clamp(24px,5vw,44px);
  background:linear-gradient(135deg,color-mix(in srgb,var(--n5) 14%,var(--surface)) 0%,color-mix(in srgb,var(--rel) 10%,var(--surface)) 60%,color-mix(in srgb,var(--form) 12%,var(--surface)) 100%);
  border:1.5px solid color-mix(in srgb,var(--rel) 16%,var(--line));
}
.hero>* {
  position:relative;
}
.hero .en {
  font-size:clamp(1.15rem,2.6vw,1.45rem);
  font-weight:700;
  margin-top:12px;
}
.hero .tags {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:20px;
}
.hubhead {
  --c:var(--n5);
  border-radius:var(--r-lg);
  padding:clamp(22px,4vw,34px);
  background:color-mix(in srgb,var(--c) 13%,var(--surface));
  border:1.5px solid color-mix(in srgb,var(--c) 28%,transparent);
  display:grid;
  gap:8px;
}
.hubhead .lab {
  font-size:.75rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--c);
}
.hubhead p {
  color:var(--muted);
  max-width:60ch;
}
.page {
  max-width:760px;
}
.sec {
  margin-top:40px;
  display:grid;
  gap:14px;
}
.sec h2 {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.2rem;
  font-weight:800;
}
.sec h2 .ic {
  width:30px;
  height:30px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:color-mix(in srgb,var(--c) 18%,var(--surface));
  color:var(--c);
  font-size:.85rem;
  flex:none;
}
.muted {
  color:var(--muted);
}
.ex {
  display:grid;
  gap:2px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.ex:first-child {
  border-top:none;
}
.ex .s {
  font-family:var(--f-jp);
  font-size:1.2rem;
  font-weight:700;
  line-height:2.1;
}
.ex .t {
  color:var(--muted);
}
.src {
  justify-self:start;
  font-size:.64rem;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  border-radius:6px;
  padding:1px 6px;
  background:color-mix(in srgb,var(--rel) 12%,var(--surface));
  color:var(--rel);
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.btn {
  --c:var(--practice);
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  border-radius:14px;
  padding:12px 20px;
  background:var(--c);
  color:#fff;
  border:none;
  transition:transform .15s,box-shadow .15s;
}
.btn:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.btn.game {
  --c:var(--game);
}
.q {
  background:var(--surface);
  border:1.5px solid color-mix(in srgb,var(--practice) 30%,var(--line));
  border-radius:var(--r);
  padding:16px;
  display:grid;
  gap:10px;
}
.q .stem {
  font-family:var(--f-jp);
  font-weight:700;
  font-size:1.1rem;
  line-height:2.1;
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gcard{
  position:relative;display:grid;gap:6px;align-content:start;min-width:0;min-height:150px;
  padding:19px 20px 17px;border-radius:16px;
  background:linear-gradient(135deg,#fffafd 0%,#fbf7ff 100%);
  border:1.5px solid #eadcf4;
  box-shadow:0 3px 12px rgba(129,91,157,.055);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.gcard::before{
  content:"";position:absolute;inset:0 auto 0 0;width:4px;border-radius:16px 0 0 16px;
  background:linear-gradient(180deg,#f3a4ca,#bca3ef);
}
.gcard::after{
  content:"→";position:absolute;right:18px;top:18px;display:grid;place-items:center;
  width:28px;height:28px;border-radius:50%;background:#f2e9ff;color:#8a62b0;
  font-family:var(--f-ui);font-size:1rem;font-weight:700;pointer-events:none;
}
.gcard:hover{transform:translateY(-3px);border-color:#d7b8ed;box-shadow:0 8px 22px rgba(129,91,157,.12)}
.gcard:focus-within{border-color:#aa83d0;outline:2px solid #cbb1e6;outline-offset:2px}
.gcard .nm{padding-right:36px;font-family:var(--f-jp);font-size:1.22rem;font-weight:700;line-height:1.5;color:#704a91}
.gcard .nm a::after{content:"";position:absolute;inset:0;border-radius:16px}
.gcard .d{font-size:.89rem;line-height:1.5;color:#886f99}
.gcard .tags{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:10px;position:relative;z-index:1}
.gcard .tags .tag{border:1px solid transparent;border-radius:999px;padding:4px 10px;font-size:.73rem;font-weight:700;line-height:1.35;box-shadow:none}
.gcard .tags .tag-lv{background:#ffe6f1;color:#ac4d82;border-color:#f7d2e4}
.gcard .tags .tag-lv[href="#lv-N4"]{background:#f5e4fa;color:#9353a0;border-color:#ebd2f0}
.gcard .tags .tag-lv[href="#lv-N3"]{background:#eee7ff;color:#7854a6;border-color:#e1d6f9}
.gcard .tags .tag-lv[href="#lv-N2"]{background:#e9eaff;color:#6059a9;border-color:#d9daf7}
.gcard .tags .tag-lv[href="#lv-N1"]{background:#f8e1f4;color:#994b92;border-color:#f0d0ea}
.gcard .tags .tag-ml{background:#efe7ff;color:#7850a2;border-color:#e1d3f6}
.gcard .tags .tag-ml::before{opacity:.75}
.gcard .tags .tag-fn{background:#ffedf5;color:#a45a8b;border-color:#f8dbe9}
.gcard .tags .tag-fn::before{background:#d18bb8;width:6px;height:6px}
@media(max-width:650px){.grid{grid-template-columns:minmax(0,1fr)}.gcard{min-height:0;padding:17px 18px}.gcard .nm{font-size:1.16rem}}
.lvgroup {
  margin-top:28px;
}
.lvgroup h2 {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.05rem;
  font-weight:800;
  margin-bottom:12px;
}
.lvgroup h2 .cnt {
  color:var(--muted);
  font-size:.85rem;
  font-weight:600;
}
.go {
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:.9rem;
  border-radius:12px;
  padding:9px 14px;
  border:1.5px solid var(--line);
  background:var(--surface);
  transition:transform .15s,box-shadow .15s;
}
.go:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}
.about {
  max-width:68ch;
  line-height:1.7;
  padding:14px 18px;
  border-radius:var(--r);
  background:color-mix(in srgb,var(--form) 9%,var(--surface));

}
.rules {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}
.rule {
  background:var(--surface);
  border-radius:var(--r);
  padding:14px 16px;
  border:1.5px solid var(--line);
  display:grid;
  gap:4px;
  align-content:start;
}
.rule small {
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--form);
}
.rule-en {
  font-size:.85rem;
  color:var(--muted);
  line-height:1.5;
}
.rule .x {
  font-family:var(--f-jp);
  font-weight:700;
  font-size:1.05rem;
  line-height:2;
}
.stubbox {
  margin-top:20px;
  padding:20px;
  border-radius:var(--r);
  border:1.5px dashed var(--line);
  background:var(--surface);
  color:var(--muted);
}
.tag-ml {
  background:var(--hub);
  color:#fff;
  border-radius:8px;
}
.tag-ml::before {
  content:"";
  width:9px;
  height:11px;
  border:2px solid currentColor;
  border-left-width:3px;
  border-radius:2px 3px 3px 2px;
  opacity:.8;
}
.space {
  justify-self:start;
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  border-radius:999px;
  padding:4px 10px;
}
.space::before {
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
}
.space.db {
  color:var(--rel);
  background:color-mix(in srgb,var(--rel) 12%,var(--surface));
}
.space.hub {
  color:var(--hub);
  background:color-mix(in srgb,var(--hub) 14%,var(--surface));
}
.hero .space {
  margin-bottom:12px;
}

@media (prefers-reduced-motion:reduce) {
* {
  animation:none!important;
  transition:none!important;
}
}

/* ============================================================
   SEARCH — page names, other names and keywords come from
   assets/js/grammar-pages.js (the one list of Grammar Hub pages).
   Matching ignores upper/lower case, spaces at the ends,
   full-width/half-width and 〜 / ～ / ~.
   ============================================================ */
const SEARCH_INDEX = window.GRAMMAR_PAGES || [];

/* Normalise text so results do not change with case, spaces at the ends,
   full-width / half-width characters or 〜 ～ ~ */
const normSearch = s => String(s ?? "").normalize("NFKC").toLowerCase().replace(/[〜～~∼〰]/g, "").replace(/\s+/g, " ").trim();
const compactSearch = s => normSearch(s).replace(/[\s・\/、。,.!?？！「」()（）\-‐–—:：']/g, "");

function searchPages(query){
  const qn = normSearch(query), qc = compactSearch(query);
  if (!qc) return [];
  const latin = /^[a-z0-9 '\-]+$/.test(qn);
  const termScore = t => {
    const tc = compactSearch(t);
    if (!tc) return 0;
    if (tc === qc) return 100;
    if (tc.startsWith(qc)) return 70;
    if (latin) {
      const words = normSearch(t).split(/[^a-z0-9']+/).filter(Boolean);
      if (normSearch(t).includes(qn) && words.some(w => w.startsWith(qn.split(" ")[0]))) return 50;
      return qc.length >= 4 && tc.includes(qc) ? 30 : 0;
    }
    return tc.includes(qc) ? 45 : 0;
  };
  return SEARCH_INDEX.map((e, i) => {
    const main = Math.max(...[e.ja, e.en, ...(e.a || [])].map(termScore));
    const kw = Math.max(0, ...(e.k || []).map(t => termScore(t) * 0.75));
    let score = Math.max(main, kw);
    if (score && e.type === "lesson") score -= 5;
    return {e, i, score};
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score || a.i - b.i).map(r => r.e);
}

function searchView(q){
  document.body.classList.remove("is-home");
  const list = searchPages(q);
  document.title = `Search: ${q} · Grammar Hub`;
  $app.innerHTML = `${crumbs([[`Search: “${esc(q)}”`]])}
    <p class="muted" style="margin-bottom:14px">${list.length} result${list.length===1?"":"s"}</p>
    ${list.length ? `<div class="grid">${list.map(e => `<div class="gcard">
      <div class="nm jp"><a href="${esc(e.u)}">${e.r ? rb(e.r) : esc(e.ja)}</a></div>
      <div class="d">${esc(e.en)}</div>
      ${e.lv ? `<div class="tags">${tagLv(e.lv,true)}</div>` : ""}
    </div>`).join("")}</div>` : `<div class="stubbox">No grammar matches “${esc(q)}”. Try a form like “て-form” or a meaning like “want”.</div>`}`;
}

/* ---------- router ---------- */
/* old #hash links (#g-…, #ml-…, #lv-N5 …) that open a real page — from the "ids" in grammar-pages.js */
const PAGE_ROUTES = {};
SEARCH_INDEX.forEach(e => (e.ids || []).forEach(id => {
  const [h, frag] = id.split("#");
  PAGE_ROUTES[h] = e.u + (frag ? "#" + frag : "");
}));
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(PAGE_ROUTES[h]) { location.replace(PAGE_ROUTES[h]); return; }
  document.body.classList.remove("is-home");
  if (!h || h==="home") homeView();
  else if (h.startsWith("lv-") && DATA.levels[h.slice(3)]) levelView(h.slice(3));
  else if (h.startsWith("tp-") && DATA.topics[h.slice(3)]) topicView(h.slice(3));
  else if (h.startsWith("f-") && DATA.forms[h.slice(2)]) formView(h.slice(2));
  else if (h.startsWith("fn-") && DATA.functions[h.slice(3)]) fnView(h.slice(3));
  else if (h.startsWith("g-") && G[h.slice(2)]) { const g = G[h.slice(2)]; (!inDB(g) && g.ml && PAGE_ROUTES["ml-"+g.ml]) ? location.replace(PAGE_ROUTES["ml-"+g.ml]) : stubView(g); }
  else homeView();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", () => { document.getElementById("search").value=""; route(); });

const sInput = document.getElementById("search");
sInput.addEventListener("input", () => { const q = sInput.value.trim(); q ? searchView(q) : route(); });
/* Enter opens the best match directly; ?q=... pre-fills the search */
sInput.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  const hit = searchPages(sInput.value)[0];
  if (hit) { e.preventDefault(); location.href = hit.u; }
});

/* furigana toggle */
const furi = document.getElementById("furi");
function setFuri(on){ document.body.classList.toggle("no-furi", !on); furi.setAttribute("aria-pressed", on); furi.textContent = on ? "Furigana on" : "Furigana off"; try{localStorage.setItem("furi", on?"1":"0")}catch(e){} }
let f0 = true; try{ f0 = localStorage.getItem("furi")!=="0"; }catch(e){}
setFuri(f0);
furi.addEventListener("click", () => setFuri(furi.getAttribute("aria-pressed")!=="true"));


route();
(function(){ const q = new URLSearchParams(location.search).get("q"); if (q) { sInput.value = q; searchView(q); } })();
</script>
