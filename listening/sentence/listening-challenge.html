ence03.mp3","jp":"映画を見ようと思っています。","en":"I’m planning to watch a movie.","focus":"見ようと思っています。","options":["見ようと思っています。","見ようと思います。","見ようと思っていました。","見たいです。","見ようと思っていません。","見ようと思いました。"],"correct":"見ようと思っています。","why":"～と思っています presents an intention that is already being held.","level":2,"group":"intent","jlpt":4},{"id":"intent-3","audio":"audio/sentence04.mp3","jp":"今、映画を見ようと思っているところです。","en":"I’m just thinking of watching a movie now.","focus":"思っているところです。","options":["思っているところです。","思っていたところです。","思っています。","思っているところでした。","思っていたところでした。","思っているところだったんです。"],"correct":"思っているところです。","why":"～ているところです locates the speaker at that point right now.","level":2,"group":"intent","jlpt":4},{"id":"intent-4","audio":"audio/sentence05.mp3","jp":"ちょうど映画を見ようと思っていたところです。","en":"I was just thinking of watching a movie.","focus":"思っていたところです。","options":["思っていたところです。","思っているところです。","思っています。","思っていたところでした。","思っているところでした。","思っているところだったんです。"],"correct":"思っていたところです。","why":"思っていた is past in form: the thought was in progress just before this moment.","level":2,"group":"intent","jlpt":4},{"id":"intent-5","audio":"audio/sentence06.mp3","jp":"映画を見ようと思っていたところに、友達から電話がかかってきました。","en":"Just as I was thinking of watching a movie, a friend called.","focus":"思っていたところに、","options":["思っていたところに、","思っているところに、","思ったところに、","思っていたところで、","帰ろうと思っていたところに、","思っていたところです。"],"correct":"思っていたところに、","why":"～ていたところに introduces something that happened just as that situation was unfolding.","level":3,"group":"intent","jlpt":3},{"id":"intent-6","audio":"audio/sentence07.mp3","jp":"映画を見ようと思っていたんですが、寝てしまいました。","en":"I was planning to watch a movie, but I ended up falling asleep.","focus":"寝てしまいました。","options":["寝てしまいました。","寝ています。","寝ようと思いました。","寝てみました。","寝ようと思っています。","見ようと思っています。"],"correct":"寝てしまいました。","why":"～てしまいました indicates completion, often with an unintended or regrettable nuance.","level":3,"group":"intent","jlpt":4},{"id":"intent-7","audio":"audio/sentence08.mp3","jp":"そのとき、映画を見ようと思っているところだったんです。","en":"At that moment, I was just thinking of watching a movie.","focus":"思っているところだったんです。","options":["思っているところだったんです。","思っていたところです。","思っているところです。","思っているところなんです。","思っていたところに、","帰ろうと思っていたところに、"],"correct":"思っているところだったんです。","why":"だった puts ところ in the past; んです adds an explanatory tone.","level":3,"group":"intent","jlpt":4},{"id":"intent-8","audio":"audio/sentence09.mp3","jp":"今夜は早く寝ようと思っています。","en":"I’m planning to go to bed early tonight.","focus":"寝ようと思っています。","options":["寝ようと思っています。","寝たいと思いました。","寝ようと思っていました。","寝ています。","寝ようと思っていません。","寝ようと思いました。"],"correct":"寝ようと思っています。","why":"寝よう is volitional; 思っています expresses an intention currently held.","level":3,"group":"intent","jlpt":4},{"id":"intent-9","audio":"audio/sentence10.mp3","jp":"帰ろうと思っていたところに、雨が降ってきました。","en":"Just as I was thinking of heading home, it started raining.","focus":"帰ろうと思っていたところに、","options":["帰ろうと思っていたところに、","帰ろうと思っているところに、","帰りたいと思っていたところに、","帰ったところに、","思っていたところです。","思っているところです。"],"correct":"帰ろうと思っていたところに、","why":"帰ろう is volitional; 思っていたところに marks an interrupted plan.","level":3,"group":"intent","jlpt":3},{"id":"try-0","audio":"audio/sentence11.mp3","jp":"ケーキを作ります。","en":"I will make a cake.","focus":"作ります。","options":["作ります。","作りました。","作りたいです。","作っています。","作ってみます。","作ってみたいです。"],"correct":"作ります。","why":"作ります is a plain polite non-past verb, not an attempt or a desire.","level":1,"group":"try","jlpt":4},{"id":"try-1","audio":"audio/sentence12.mp3","jp":"ケーキを作ってみます。","en":"I’ll try making a cake.","focus":"作ってみます。","options":["作ってみます。","作ってみたいです。","作ってみました。","作ってみようと思います。","作ってみません。","作ってみませんでした。"],"correct":"作ってみます。","why":"Verb て-form + みます means to try doing something.","level":1,"group":"try","jlpt":4},{"id":"try-2","audio":"audio/sentence13.mp3","jp":"ケーキを作ってみたいです。","en":"I want to try making a cake.","focus":"作ってみたいです。","options":["作ってみたいです。","作ってみます。","作ってみたかったです。","作ってみたくないです。","作ってみたくなかったです。","作ってみたいと思っているんです。"],"correct":"作ってみたいです。","why":"～てみたい means want to try doing; ～たい behaves like an い-adjective.","level":2,"group":"try","jlpt":4},{"id":"try-3","audio":"audio/sentence14.mp3","jp":"ケーキを作ってみたいと思っています。","en":"I’ve been thinking I’d like to try making a cake.","focus":"作ってみたいと思っています。","options":["作ってみたいと思っています。","作ってみようと思っています。","作ってみたかったと思っています。","作ってみたいと思っていました。","作ってみたいと思っていません。","作ってみたいと思いました。"],"correct":"作ってみたいと思っています。","why":"みたい expresses desire; 思っています expresses a thought held now.","level":2,"group":"try","jlpt":4},{"id":"try-4","audio":"audio/sentence15.mp3","jp":"ケーキを作ってみたいと思っているんです。","en":"Actually, I’ve been thinking I’d like to try making a cake.","focus":"作ってみたいと思っているんです。","options":["作ってみたいと思っているんです。","作ってみたいと思っています。","作ってみたいと思っていたんです。","作ってみようと思っているんです。","作ってみようと思っています。","試してみたいと思っています。"],"correct":"作ってみたいと思っているんです。","why":"～んです adds an explanatory nuance to the desire currently held.","level":2,"group":"try","jlpt":4},{"id":"try-5","audio":"audio/sentence16.mp3","jp":"週末にケーキを作ってみようと思っています。","en":"I’m planning to try making a cake this weekend.","focus":"作ってみようと思っています。","options":["作ってみようと思っています。","作ってみたいと思っています。","作ってみようと思っていました。","作ってみます。","作ってみようと思っていません。","作ってみようと思いました。"],"correct":"作ってみようと思っています。","why":"みよう is the volitional of みる; ～と思っています expresses a plan to try.","level":3,"group":"try","jlpt":4},{"id":"try-6","audio":"audio/sentence17.mp3","jp":"ケーキを作ってみようと思っていたんですが、材料が足りませんでした。","en":"I was planning to try making a cake, but I didn’t have enough ingredients.","focus":"作ってみようと思っていたんですが、","options":["作ってみようと思っていたんですが、","作ってみようと思っているんですが、","作ってみたいと思っていたんですが、","作ってみたかったんですが、","作ってみようと思っています。","作ってみたいと思っているんです。"],"correct":"作ってみようと思っていたんですが、","why":"思っていた shows an earlier plan; んですが introduces a contrasting outcome.","level":3,"group":"try","jlpt":4},{"id":"try-7","audio":"audio/sentence18.mp3","jp":"ケーキを作ってみたかったんですが、時間がありませんでした。","en":"I wanted to try making a cake, but I didn’t have time.","focus":"作ってみたかったんですが、","options":["作ってみたかったんですが、","作ってみたいんですが、","作ってみようと思っていたんですが、","作ってみましたが、","作ってみたいです。","作ってみたいと思っているんです。"],"correct":"作ってみたかったんですが、","why":"みたかった is the past form of みたい: wanted to try.","level":3,"group":"try","jlpt":4},{"id":"try-8","audio":"audio/sentence19.mp3","jp":"新しいレシピを試してみたいと思っています。","en":"I’ve been thinking I’d like to try a new recipe.","focus":"試してみたいと思っています。","options":["試してみたいと思っています。","試してみようと思っています。","試してみたいと思っていました。","試してみました。","試してみたいと思っていません。","試してみたいと思いました。"],"correct":"試してみたいと思っています。","why":"試してみたい is desire to try; 思っています makes the thought current.","level":3,"group":"try","jlpt":4},{"id":"reason-0","audio":"audio/sentence20.mp3","jp":"昨日は忙しかったです。","en":"I was busy yesterday.","focus":"忙しかったです。","options":["忙しかったです。","忙しいです。","忙しくなかったです。","忙しくて、","行けなかったんです。","見られなかったんです。"],"correct":"忙しかったです。","why":"忙しかった is the past affirmative form of 忙しい.","level":1,"group":"reason","jlpt":4},{"id":"reason-1","audio":"audio/sentence21.mp3","jp":"昨日は忙しくて、買い物に行けませんでした。","en":"I was busy yesterday, so I couldn’t go shopping.","focus":"行けませんでした。","options":["行けませんでした。","行きませんでした。","行けました。","行けないです。","行けません。","食べられませんでした。"],"correct":"行けませんでした。","why":"行けませんでした is past negative potential: could not go, not simply did not go.","level":1,"group":"reason","jlpt":4},{"id":"reason-2","audio":"audio/sentence22.mp3","jp":"昨日は忙しくて、買い物に行けなかったんです。","en":"The thing is, I was busy yesterday, so I couldn’t go shopping.","focus":"行けなかったんです。","options":["行けなかったんです。","行かなかったんです。","行けなかったです。","行けませんでした。","行けないんです。","行けたんです。"],"correct":"行けなかったんです。","why":"行けなかった is past negative potential; んです adds explanation.","level":2,"group":"reason","jlpt":4},{"id":"reason-3","audio":"audio/sentence23.mp3","jp":"昨日は忙しくて買い物に行けなかったので、今日行こうと思っています。","en":"I couldn’t go shopping yesterday because I was busy, so I’m planning to go today.","focus":"行けなかったので、","options":["行けなかったので、","行かなかったので、","行けないので、","行けたので、","行けなかったんです。","見られなかったんです。"],"correct":"行けなかったので、","why":"行けなかった means could not go; ので connects the reason to the next clause.","level":2,"group":"reason","jlpt":4},{"id":"reason-4","audio":"audio/sentence24.mp3","jp":"時間がなくて、昼ご飯を食べられませんでした。","en":"I didn’t have time, so I couldn’t eat lunch.","focus":"食べられませんでした。","options":["食べられませんでした。","食べませんでした。","食べられました。","食べられないです。","食べられません。","行けませんでした。"],"correct":"食べられませんでした。","why":"食べられませんでした is the polite past negative potential of 食べる.","level":2,"group":"reason","jlpt":4},{"id":"reason-5","audio":"audio/sentence25.mp3","jp":"時間がなくて、昼ご飯を食べられなかったんです。","en":"The thing is, I didn’t have time, so I couldn’t eat lunch.","focus":"食べられなかったんです。","options":["食べられなかったんです。","食べなかったんです。","食べられなかったです。","食べられるんです。","食べられないんです。","食べられたんです。"],"correct":"食べられなかったんです。","why":"食べられなかった expresses inability in the past; んです explains.","level":3,"group":"reason","jlpt":4},{"id":"reason-6","audio":"audio/sentence26.mp3","jp":"昨日は時間がなくて買い物に行けなかったので、今日は早めに行こうと思っています。","en":"I didn’t have time to go shopping yesterday, so I’m planning to go earlier today.","focus":"行こうと思っています。","options":["行こうと思っています。","行きたいと思っています。","行こうと思っていました。","行ったと思っています。","行こうと思っていません。","行こうと思いました。"],"correct":"行こうと思っています。","why":"行こう is volitional and 思っています expresses a current plan.","level":3,"group":"reason","jlpt":4},{"id":"reason-7","audio":"audio/sentence27.mp3","jp":"仕事が終わらなくて、映画を見られなかったんです。","en":"I couldn’t finish work, so I wasn’t able to watch the movie.","focus":"見られなかったんです。","options":["見られなかったんです。","見なかったんです。","見られないんです。","見られました。","見られなかったです。","見られたんです。"],"correct":"見られなかったんです。","why":"見られなかった is past negative potential: was unable to watch.","level":3,"group":"reason","jlpt":4},{"id":"habit-0","audio":"audio/sentence28.mp3","jp":"毎朝歩きます。","en":"I walk every morning.","focus":"歩きます。","options":["歩きます。","歩きました。","歩いています。","歩きたいです。","歩こうと思っています。","歩くようにしています。"],"correct":"歩きます。","why":"歩きます is polite non-past and can describe a habitual action.","level":1,"group":"habit","jlpt":4},{"id":"habit-1","audio":"audio/sentence29.mp3","jp":"健康のために、毎朝歩いています。","en":"I walk every morning for my health.","focus":"歩いています。","options":["歩いています。","歩きました。","歩こうと思っています。","歩くようにしています。","歩きます。","食べないようにしています。"],"correct":"歩いています。","why":"歩いています can describe an ongoing habit in this context.","level":1,"group":"habit","jlpt":4},{"id":"habit-2","audio":"audio/sentence30.mp3","jp":"健康のために、毎朝歩くようにしています。","en":"I make a point of walking every morning for my health.","focus":"歩くようにしています。","options":["歩くようにしています。","歩いています。","歩くようにしていました。","歩こうと思っています。","歩くようにしていません。","歩くようにしようと思っています。"],"correct":"歩くようにしています。","why":"Dictionary form + ようにしています expresses a conscious effort or habit.","level":2,"group":"habit","jlpt":4},{"id":"habit-3","audio":"audio/sentence31.mp3","jp":"健康のために、エレベーターを使わないで階段を使うようにしています。","en":"For my health, I try to take the stairs instead of the elevator.","focus":"使わないで","options":["使わないで","使わなくて","使ったので","使うために","使うようにしているんです。","食べないようにしています。"],"correct":"使わないで","why":"使わないで means without using; it describes how the next action is done.","level":2,"group":"habit","jlpt":4},{"id":"habit-4","audio":"audio/sentence32.mp3","jp":"最近、健康のために階段を使うようにしているんです。","en":"Lately, I’ve been making an effort to take the stairs for my health.","focus":"使うようにしているんです。","options":["使うようにしているんです。","使うようにしています。","使うようにしていたんです。","使おうと思っているんです。","歩くようにしています。","食べないようにしています。"],"correct":"使うようにしているんです。","why":"ようにしている expresses a deliberate habit; んです explains it.","level":2,"group":"habit","jlpt":4},{"id":"habit-5","audio":"audio/sentence33.mp3","jp":"運動するために、来週から毎朝歩こうと思っています。","en":"I’m planning to start walking every morning next week to get some exercise.","focus":"歩こうと思っています。","options":["歩こうと思っています。","歩くようにしています。","歩いています。","歩こうと思っていました。","歩こうと思っていません。","歩こうと思いました。"],"correct":"歩こうと思っています。","why":"歩こう is volitional; 思っています is a plan held now.","level":3,"group":"habit","jlpt":4},{"id":"habit-6","audio":"audio/sentence34.mp3","jp":"今朝は歩こうと思っていたんですが、雨が降ってしまいました。","en":"I was planning to walk this morning, but it ended up raining.","focus":"歩こうと思っていたんですが、","options":["歩こうと思っていたんですが、","歩こうと思っているんですが、","歩きたいと思っていますが、","歩いていたんですが、","歩こうと思っています。","起きるようにしようと思っています。"],"correct":"歩こうと思っていたんですが、","why":"思っていた expresses an earlier plan; んですが sets up a contrast.","level":3,"group":"habit","jlpt":4},{"id":"habit-7","audio":"audio/sentence35.mp3","jp":"健康のために、夜は甘いものを食べないようにしています。","en":"For my health, I try not to eat sweets at night.","focus":"食べないようにしています。","options":["食べないようにしています。","食べるようにしています。","食べないようにしていました。","食べたくないと思っています。","食べないようにしていません。","食べないようにしようと思っています。"],"correct":"食べないようにしています。","why":"ない-form + ようにしています means making a conscious effort not to do something.","level":3,"group":"habit","jlpt":4},{"id":"habit-8","audio":"audio/sentence36.mp3","jp":"明日から早く起きるようにしようと思っています。","en":"I’m planning to start making an effort to get up early tomorrow.","focus":"起きるようにしようと思っています。","options":["起きるようにしようと思っています。","起きるようにしています。","起きようと思っています。","起きるようにしていました。","起きるようにしようと思っていました。","起きるようにしようと思っていません。"],"correct":"起きるようにしようと思っています。","why":"ようにしよう is volitional of ようにする: planning to start making an effort.","level":3,"group":"habit","jlpt":4},{"id":"n5-recorded-00","audio":"audio/grammar04.mp3","jp":"映画を見たいです。","en":"I want to watch a movie.","focus":"見たいです。","options":["見たいです。","見ます。","見ました。","見ません。","見たくないです。","見ませんでした。"],"correct":"見たいです。","why":"Listen to the ending: 「見たいです。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-01","audio":"audio/grammar17.mp3","jp":"昨日、買い物に行きませんでした。","en":"I did not go shopping yesterday.","focus":"行きませんでした。","options":["行きませんでした。","行きました。","行きます。","行きません。","行きたいです。","行きたくありません。"],"correct":"行きませんでした。","why":"Listen to the ending: 「行きませんでした。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-02","audio":"audio/grammar21.mp3","jp":"毎朝歩いています。","en":"I walk every morning.","focus":"歩いています。","options":["歩いています。","歩きます。","歩きました。","歩きません。","歩きませんでした。","歩きたいです。"],"correct":"歩いています。","why":"Listen to the ending: 「歩いています。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-03","audio":"audio/grammar28.mp3","jp":"夜は甘いものを食べません。","en":"I do not eat sweets at night.","focus":"食べません。","options":["食べません。","食べます。","食べました。","食べませんでした。","食べたいです。","食べたくありません。"],"correct":"食べません。","why":"Listen to the ending: 「食べません。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-04","audio":"audio/grammar30.mp3","jp":"夜は甘いものを食べたくありません。","en":"I do not want to eat sweets at night.","focus":"食べたくありません。","options":["食べたくありません。","食べたいです。","食べません。","食べませんでした。","食べました。","食べます。"],"correct":"食べたくありません。","why":"Listen to the ending: 「食べたくありません。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-05","audio":"audio/grammar40.mp3","jp":"仕事は忙しかったです。","en":"Work was busy.","focus":"忙しかったです。","options":["忙しかったです。","忙しいです。","忙しくないです。","忙しくなかったです。","楽しいです。","楽しかったです。"],"correct":"忙しかったです。","why":"Listen to the ending: 「忙しかったです。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-06","audio":"audio/grammar41.mp3","jp":"仕事は忙しくなかったです。","en":"Work was not busy.","focus":"忙しくなかったです。","options":["忙しくなかったです。","忙しいです。","忙しくないです。","忙しかったです。","忙しくありません。","忙しかったと思います。"],"correct":"忙しくなかったです。","why":"Listen to the ending: 「忙しくなかったです。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-07","audio":"audio/grammar48.mp3","jp":"毎朝歩いていました。","en":"I used to walk every morning.","focus":"歩いていました。","options":["歩いていました。","歩いています。","歩きました。","歩きませんでした。","歩きます。","歩きたいです。"],"correct":"歩いていました。","why":"Listen to the ending: 「歩いていました。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-08","audio":"audio/grammar09.mp3","jp":"寝る前に勉強します。","en":"I study before going to bed.","focus":"寝る前に","options":["寝る前に","寝た後で","寝ています","寝ますから","寝ましたから","寝ませんから"],"correct":"寝る前に","why":"Listen to the ending: 「寝る前に」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-09","audio":"audio/grammar10.mp3","jp":"食べてから出かけます。","en":"I go out after eating.","focus":"食べてから","options":["食べてから","食べる前に","食べた後で","食べています","食べましたから","食べますから"],"correct":"食べてから","why":"Listen to the ending: 「食べてから」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-recorded-10","audio":"audio/grammar03.mp3","jp":"ここで食べてはいけません。","en":"You must not eat here.","focus":"食べてはいけません。","options":["食べてはいけません。","食べてもいいです。","食べます。","食べません。","食べたいです。","食べたくないです。"],"correct":"食べてはいけません。","why":"Listen to the ending: 「食べてはいけません。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-base-00","audio":"audio/sentence01.mp3","jp":"映画を見ます。","en":"I will watch a movie.","focus":"見ます。","options":["見ます。","見ました。","見ません。","見ませんでした。","見たいです。","見たくないです。"],"correct":"見ます。","why":"Listen to the ending: 「見ます。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-base-01","audio":"audio/sentence11.mp3","jp":"ケーキを作ります。","en":"I will make a cake.","focus":"作ります。","options":["作ります。","作りました。","作りません。","作りませんでした。","作りたいです。","作りたくないです。"],"correct":"作ります。","why":"Listen to the ending: 「作ります。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-base-02","audio":"audio/sentence20.mp3","jp":"昨日は忙しかったです。","en":"I was busy yesterday.","focus":"忙しかったです。","options":["忙しかったです。","忙しいです。","忙しくないです。","忙しくなかったです。","楽しいです。","楽しかったです。"],"correct":"忙しかったです。","why":"Listen to the ending: 「忙しかったです。」.","level":1,"jlpt":5,"group":"n5"},{"id":"n5-base-03","audio":"audio/sentence28.mp3","jp":"毎朝歩きます。","en":"I walk every morning.","focus":"歩きます。","options":["歩きます。","歩きました。","歩きません。","歩きませんでした。","歩きたいです。","歩いています。"],"correct":"歩きます。","why":"Listen to the ending: 「歩きます。」.","level":1,"jlpt":5,"group":"n5"}],"gap":[{"id":"intent-1","audio":"audio/sentence02.mp3","jp":"映画を見ようと思います。","en":"I think I’ll watch a movie.","focus":"見ようと思います。","options":["見ようと思います。","見たいです。","見ようと思っています。","見ようと思っていました。","見ようと思いました。","見ようと思いません。"],"correct":"見ようと思います。","why":"見よう is the volitional form. ～と思います expresses a thought or decision.","level":1,"group":"intent","jlpt":4},{"id":"intent-2","audio":"audio/sentence03.mp3","jp":"映画を見ようと思っています。","en":"I’m planning to watch a movie.","focus":"見ようと思っています。","options":["見ようと思っています。","見ようと思います。","見ようと思っていました。","見たいです。","見ようと思っていません。","見ようと思いました。"],"correct":"見ようと思っています。","why":"～と思っています presents an intention that is already being held.","level":2,"group":"intent","jlpt":4},{"id":"intent-3","audio":"audio/sentence04.mp3","jp":"今、映画を見ようと思っているところです。","en":"I’m just thinking of watching a movie now.","focus":"思っているところです。","options":["思っているところです。","思っていたところです。","思っています。","思っているところでした。","思っていたところでした。","思っているところだったんです。"],"correct":"思っているところです。","why":"～ているところです locates the speaker at that point right now.","level":2,"group":"intent","jlpt":4},{"id":"intent-4","audio":"audio/sentence05.mp3","jp":"ちょうど映画を見ようと思っていたところです。","en":"I was just thinking of watching a movie.","focus":"思っていたところです。","options":["思っていたところです。","思っているところです。","思っています。","思っていたところでした。","思っているところでした。","思っているところだったんです。"],"correct":"思っていたところです。","why":"思っていた is past in form: the thought was in progress just before this moment.","level":2,"group":"intent","jlpt":4},{"id":"intent-5","audio":"audio/sentence06.mp3","jp":"映画を見ようと思っていたところに、友達から電話がかかってきました。","en":"Just as I was thinking of watching a movie, a friend called.","focus":"思っていたところに、","options":["思っていたところに、","思っているところに、","思ったところに、","思っていたところで、","帰ろうと思っていたところに、","思っていたところです。"],"correct":"思っていたところに、","why":"～ていたところに introduces something that happened just as that situation was unfolding.","level":3,"group":"intent","jlpt":3},{"id":"intent-6","audio":"audio/sentence07.mp3","jp":"映画を見ようと思っていたんですが、寝てしまいました。","en":"I was planning to watch a movie, but I ended up falling asleep.","focus":"寝てしまいました。","options":["寝てしまいました。","寝ています。","寝ようと思いました。","寝てみました。","寝ようと思っています。","見ようと思っています。"],"correct":"寝てしまいました。","why":"～てしまいました indicates completion, often with an unintended or regrettable nuance.","level":3,"group":"intent","jlpt":4},{"id":"intent-7","audio":"audio/sentence08.mp3","jp":"そのとき、映画を見ようと思っているところだったんです。","en":"At that moment, I was just thinking of watching a movie.","focus":"思っているところだったんです。","options":["思っているところだったんです。","思っていたところです。","思っているところです。","思っているところなんです。","思っていたところに、","帰ろうと思っていたところに、"],"correct":"思っているところだったんです。","why":"だった puts ところ in the past; んです adds an explanatory tone.","level":3,"group":"intent","jlpt":4},{"id":"intent-8","audio":"audio/sentence09.mp3","jp":"今夜は早く寝ようと思っています。","en":"I’m planning to go to bed early tonight.","focus":"寝ようと思っています。","options":["寝ようと思っています。","寝たいと思いました。","寝ようと思っていました。","寝ています。","寝ようと思っていません。","寝ようと思いました。"],"correct":"寝ようと思っています。","why":"寝よう is volitional; 思っています expresses an intention currently held.","level":3,"group":"intent","jlpt":4},{"id":"intent-9","audio":"audio/sentence10.mp3","jp":"帰ろうと思っていたところに、雨が降ってきました。","en":"Just as I was thinking of heading home, it started raining.","focus":"帰ろうと思っていたところに、","options":["帰ろうと思っていたところに、","帰ろうと思っているところに、","帰りたいと思っていたところに、","帰ったところに、","思っていたところです。","思っているところです。"],"correct":"帰ろうと思っていたところに、","why":"帰ろう is volitional; 思っていたところに marks an interrupted plan.","level":3,"group":"intent","jlpt":3},{"id":"try-1","audio":"audio/sentence12.mp3","jp":"ケーキを作ってみます。","en":"I’ll try making a cake.","focus":"作ってみます。","options":["作ってみます。","作ってみたいです。","作ってみました。","作ってみようと思います。","作ってみません。","作ってみませんでした。"],"correct":"作ってみます。","why":"Verb て-form + みます means to try doing something.","level":1,"group":"try","jlpt":4},{"id":"try-2","audio":"audio/sentence13.mp3","jp":"ケーキを作ってみたいです。","en":"I want to try making a cake.","focus":"作ってみたいです。","options":["作ってみたいです。","作ってみます。","作ってみたかったです。","作ってみたくないです。","作ってみたくなかったです。","作ってみたいと思っているんです。"],"correct":"作ってみたいです。","why":"～てみたい means want to try doing; ～たい behaves like an い-adjective.","level":2,"group":"try","jlpt":4},{"id":"try-3","audio":"audio/sentence14.mp3","jp":"ケーキを作ってみたいと思っています。","en":"I’ve been thinking I’d like to try making a cake.","focus":"作ってみたいと思っています。","options":["作ってみたいと思っています。","作ってみようと思っています。","作ってみたかったと思っています。","作ってみたいと思っていました。","作ってみたいと思っていません。","作ってみたいと思いました。"],"correct":"作ってみたいと思っています。","why":"みたい expresses desire; 思っています expresses a thought held now.","level":2,"group":"try","jlpt":4},{"id":"try-4","audio":"audio/sentence15.mp3","jp":"ケーキを作ってみたいと思っているんです。","en":"Actually, I’ve been thinking I’d like to try making a cake.","focus":"作ってみたいと思っているんです。","options":["作ってみたいと思っているんです。","作ってみたいと思っています。","作ってみたいと思っていたんです。","作ってみようと思っているんです。","作ってみようと思っています。","試してみたいと思っています。"],"correct":"作ってみたいと思っているんです。","why":"～んです adds an explanatory nuance to the desire currently held.","level":2,"group":"try","jlpt":4},{"id":"try-5","audio":"audio/sentence16.mp3","jp":"週末にケーキを作ってみようと思っています。","en":"I’m planning to try making a cake this weekend.","focus":"作ってみようと思っています。","options":["作ってみようと思っています。","作ってみたいと思っています。","作ってみようと思っていました。","作ってみます。","作ってみようと思っていません。","作ってみようと思いました。"],"correct":"作ってみようと思っています。","why":"みよう is the volitional of みる; ～と思っています expresses a plan to try.","level":3,"group":"try","jlpt":4},{"id":"try-6","audio":"audio/sentence17.mp3","jp":"ケーキを作ってみようと思っていたんですが、材料が足りませんでした。","en":"I was planning to try making a cake, but I didn’t have enough ingredients.","focus":"作ってみようと思っていたんですが、","options":["作ってみようと思っていたんですが、","作ってみようと思っているんですが、","作ってみたいと思っていたんですが、","作ってみたかったんですが、","作ってみようと思っています。","作ってみたいと思っているんです。"],"correct":"作ってみようと思っていたんですが、","why":"思っていた shows an earlier plan; んですが introduces a contrasting outcome.","level":3,"group":"try","jlpt":4},{"id":"try-7","audio":"audio/sentence18.mp3","jp":"ケーキを作ってみたかったんですが、時間がありませんでした。","en":"I wanted to try making a cake, but I didn’t have time.","focus":"作ってみたかったんですが、","options":["作ってみたかったんですが、","作ってみたいんですが、","作ってみようと思っていたんですが、","作ってみましたが、","作ってみたいです。","作ってみたいと思っているんです。"],"correct":"作ってみたかったんですが、","why":"みたかった is the past form of みたい: wanted to try.","level":3,"group":"try","jlpt":4},{"id":"try-8","audio":"audio/sentence19.mp3","jp":"新しいレシピを試してみたいと思っています。","en":"I’ve been thinking I’d like to try a new recipe.","focus":"試してみたいと思っています。","options":["試してみたいと思っています。","試してみようと思っています。","試してみたいと思っていました。","試してみました。","試してみたいと思っていません。","試してみたいと思いました。"],"correct":"試してみたいと思っています。","why":"試してみたい is desire to try; 思っています makes the thought current.","level":3,"group":"try","jlpt":4},{"id":"reason-1","audio":"audio/sentence21.mp3","jp":"昨日は忙しくて、買い物に行けませんでした。","en":"I was busy yesterday, so I couldn’t go shopping.","focus":"行けませんでした。","options":["行けませんでした。","行きませんでした。","行けました。","行けないです。","行けません。","食べられませんでした。"],"correct":"行けませんでした。","why":"行けませんでした is past negative potential: could not go, not simply did not go.","level":1,"group":"reason","jlpt":4},{"id":"reason-2","audio":"audio/sentence22.mp3","jp":"昨日は忙しくて、買い物に行けなかったんです。","en":"The thing is, I was busy yesterday, so I couldn’t go shopping.","focus":"行けなかったんです。","options":["行けなかったんです。","行かなかったんです。","行けなかったです。","行けませんでした。","行けないんです。","行けたんです。"],"correct":"行けなかったんです。","why":"行けなかった is past negative potential; んです adds explanation.","level":2,"group":"reason","jlpt":4},{"id":"reason-3","audio":"audio/sentence23.mp3","jp":"昨日は忙しくて買い物に行けなかったので、今日行こうと思っています。","en":"I couldn’t go shopping yesterday because I was busy, so I’m planning to go today.","focus":"行けなかったので、","options":["行けなかったので、","行かなかったので、","行けないので、","行けたので、","行けなかったんです。","見られなかったんです。"],"correct":"行けなかったので、","why":"行けなかった means could not go; ので connects the reason to the next clause.","level":2,"group":"reason","jlpt":4},{"id":"reason-4","audio":"audio/sentence24.mp3","jp":"時間がなくて、昼ご飯を食べられませんでした。","en":"I didn’t have time, so I couldn’t eat lunch.","focus":"食べられませんでした。","options":["食べられませんでした。","食べませんでした。","食べられました。","食べられないです。","食べられません。","行けませんでした。"],"correct":"食べられませんでした。","why":"食べられませんでした is the polite past negative potential of 食べる.","level":2,"group":"reason","jlpt":4},{"id":"reason-5","audio":"audio/sentence25.mp3","jp":"時間がなくて、昼ご飯を食べられなかったんです。","en":"The thing is, I didn’t have time, so I couldn’t eat lunch.","focus":"食べられなかったんです。","options":["食べられなかったんです。","食べなかったんです。","食べられなかったです。","食べられるんです。","食べられないんです。","食べられたんです。"],"correct":"食べられなかったんです。","why":"食べられなかった expresses inability in the past; んです explains.","level":3,"group":"reason","jlpt":4},{"id":"reason-6","audio":"audio/sentence26.mp3","jp":"昨日は時間がなくて買い物に行けなかったので、今日は早めに行こうと思っています。","en":"I didn’t have time to go shopping yesterday, so I’m planning to go earlier today.","focus":"行こうと思っています。","options":["行こうと思っています。","行きたいと思っています。","行こうと思っていました。","行ったと思っています。","行こうと思っていません。","行こうと思いました。"],"correct":"行こうと思っています。","why":"行こう is volitional and 思っています expresses a current plan.","level":3,"group":"reason","jlpt":4},{"id":"reason-7","audio":"audio/sentence27.mp3","jp":"仕事が終わらなくて、映画を見られなかったんです。","en":"I couldn’t finish work, so I wasn’t able to watch the movie.","focus":"見られなかったんです。","options":["見られなかったんです。","見なかったんです。","見られないんです。","見られました。","見られなかったです。","見られたんです。"],"correct":"見られなかったんです。","why":"見られなかった is past negative potential: was unable to watch.","level":3,"group":"reason","jlpt":4},{"id":"habit-1","audio":"audio/sentence29.mp3","jp":"健康のために、毎朝歩いています。","en":"I walk every morning for my health.","focus":"歩いています。","options":["歩いています。","歩きました。","歩こうと思っています。","歩くようにしています。","歩きます。","食べないようにしています。"],"correct":"歩いています。","why":"歩いています can describe an ongoing habit in this context.","level":1,"group":"habit","jlpt":4},{"id":"habit-2","audio":"audio/sentence30.mp3","jp":"健康のために、毎朝歩くようにしています。","en":"I make a point of walking every morning for my health.","focus":"歩くようにしています。","options":["歩くようにしています。","歩いています。","歩くようにしていました。","歩こうと思っています。","歩くようにしていません。","歩くようにしようと思っています。"],"correct":"歩くようにしています。","why":"Dictionary form + ようにしています expresses a conscious effort or habit.","level":2,"group":"habit","jlpt":4},{"id":"habit-3","audio":"audio/sentence31.mp3","jp":"健康のために、エレベーターを使わないで階段を使うようにしています。","en":"For my health, I try to take the stairs instead of the elevator.","focus":"使わないで","options":["使わないで","使わなくて","使ったので","使うために","使うようにしているんです。","食べないようにしています。"],"correct":"使わないで","why":"使わないで means without using; it describes how the next action is done.","level":2,"group":"habit","jlpt":4},{"id":"habit-4","audio":"audio/sentence32.mp3","jp":"最近、健康のために階段を使うようにしているんです。","en":"Lately, I’ve been making an effort to take the stairs for my health.","focus":"使うようにしているんです。","options":["使うようにしているんです。","使うようにしています。","使うようにしていたんです。","使おうと思っているんです。","歩くようにしています。","食べないようにしています。"],"correct":"使うようにしているんです。"," const readRE=new RegExp(Object.keys(READINGS).sort((a,b)=>b.length-a.length).join('|'),'g');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ruby(s){return esc(s).replace(readRE,x=>`<ruby>${x}<rt>${READINGS[x]}</rt></ruby>`);}
function maybeRuby(s){return /[\u3400-\u9fff]/.test(String(s))?ruby(s):esc(s);}
function shuffle(a){const v=[...a];for(let i=v.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]];}return v;}

function hear(q,which='model'){
 const text=which==='model'?(q.model||q.jp||q.correct):q.jp;

}

function jlptSetting(){return `<div class="setting"><label for="jlpt">JLPT range</label><select id="jlpt"><option value="n5">N5</option><option value="n4">N5–N4</option><option value="n3">N5–N3</option></select></div>`;}
function wireJLPT(onChange){const el=$('jlpt');if(!el)return;el.value=st.jlpt;el.onchange=e=>{st.jlpt=e.target.value;st.previewIndex=0;st.previewReveal=false;st.level='all';const link=document.querySelector('.switch-btn');if(link)link.href=link.href.split('?')[0]+'?jlpt='+st.jlpt;onChange();};}
function currentGame(){return GAMES.find(g=>g.id===st.mode)||GAMES[0];}
function activeTypes(){return currentGame().types;}
function eligible(type){return DATA[type].filter(q=>allowedJLPT(q)&&(st.level==='all'||String(q.level)===st.level)).map(q=>({...q,kind:type}));}
function createMix(n){const types=activeTypes(),buckets={};for(const t of types)buckets[t]=shuffle(eligible(t));const order=[];while(order.length<n){let added=0;for(const t of shuffle(types)){if(buckets[t].length&&order.length<n){order.push(buckets[t].pop());added++;}}if(!added)break;}return order;}
function createTripleSet(n){const styles=['match','onlycorrect','onlywrong'];const buckets=Object.fromEntries(styles.map(t=>[t,shuffle(eligible('triple').filter(q=>q.style===t))]));const out=[];while(out.length<n){let added=0;for(const t of shuffle(styles)){if(buckets[t].length&&out.length<n){out.push(buckets[t].pop());added++;}}if(!added)break;}return out;}
function renderExamples(){
 let h=`<h2 class="section-title">① Examples</h2><p class="sub">Listen, read, and compare. Japanese has furigana; purple readings can be switched off.</p><div class="toolbar">${jlptSetting()}${speedSetting()}${rubyButton()}</div>`;
 if(CATEGORY==='grammar'){
  h+=`<div class="example-switch"><button class="btn ${st.exampleView==='sentences'?'':'outline'}" id="showSentences" aria-pressed="${st.exampleView==='sentences'}">📖 Sentence Examples</button><button class="btn ${st.exampleView==='cards'?'':'outline'}" id="showCards" aria-pressed="${st.exampleView==='cards'}">🌷 Grammar Flashcards</button></div>`;
 }
 if(CATEGORY==='grammar'&&st.exampleView==='cards'){
  h+=`<p class="sub">Tap each card to see the Japanese form, a sample sentence, and its English meaning. Audio plays on reveal.</p><div class="flash-grid">${DATA.forms.map((d,i)=>`<button type="button" class="flash" data-flash="${i}" aria-expanded="false"><small>Card ${i+1} · Level ${d.level}</small><strong>${esc(d.meaning)}</strong><small>Tap to reveal Japanese ✨</small></button>`).join('')}</div>`;
 }else{
  for(const section of [...new Set(DATA.examples.filter(allowedJLPT).map(x=>x.section))]){
   const items=DATA.examples.filter(x=>x.section===section&&allowedJLPT(x));
   h+=`<section class="group"><div class="grouphead"><h3>${esc(section)}</h3><p>Listen · Read · Compare</p></div><div class="examples">${items.map((d,i)=>`<div class="example"><span class="stepnum">${i+1}</span><div><div class="jp" lang="ja">${ruby(d.jp)}</div><div class="en">${esc(d.en)}</div><span class="gram">Level ${d.level} · ${maybeRuby(d.tag)}</span></div><button class="play" data-audio="${esc(d.audio)}" aria-label="Play example ${i+1}">▶</button></div>`).join('')}</div></section>`;
  }
 }
 h+=`<div class="studyfooter"><p>Ready? Choose a practice type and difficulty before starting.</p><button class="btn" id="choosePractice">Choose Practice →</button></div><p class="sub" id="audioNotice" role="status"></p>`;
 $('main').innerHTML=h;wireJLPT(renderExamples);wireSpeed();wireRuby();
 if(CATEGORY==='grammar'){
  $('showSentences').onclick=()=>{st.exampleView='sentences';renderExamples();};
  $('showCards').onclick=()=>{st.exampleView='cards';renderExamples();};
 }
 $('main').querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>play(b.dataset.audio));
 $('main').querySelectorAll('[data-flash]').forEach(b=>b.onclick=()=>{const d=DATA.forms[Number(b.dataset.flash)],open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));b.innerHTML=open?`<small>Card ${Number(b.dataset.flash)+1} · Level ${d.level}</small><strong>${esc(d.meaning)}</strong><small>Tap to reveal Japanese ✨</small>`:`<small>${esc(d.meaning)}</small><div class="flash-jp" lang="ja">${ruby(d.pattern)}</div><div class="flash-jp" lang="ja">${ruby(d.jp)}</div><span class="en">${esc(d.en)}</span><small>${esc(d.why)}</small><small>🔊 Japanese audio plays when you reveal the card.</small>`;if(!open)hear(d);});
 $('choosePractice').onclick=()=>setPage('setup');
}
function previewCandidates(){
 const g=currentGame();const found=[];const seen=new Set();
 for(const [type,id] of (g.previews||[])){
  const q=(DATA[type]||[]).find(x=>x.id===id);
  if(q&&allowedJLPT(q)&&(st.level==='all'||String(q.level)===st.level)){
   found.push({...q,kind:type});seen.add(type+'|'+id);
  }
 }
 for(const type of activeTypes()){
  for(const q of eligible(type).slice(0,3)){
   if(found.length>=5)break;
   if(!seen.has(type+'|'+q.id)){found.push(q);seen.add(type+'|'+q.id);}
  }
 }
 return found;
}
function sampleQuestion(){const list=previewCandidates();return list.length?list[st.previewIndex%list.length]:null;}
function previewMarkup(){
 const q=sampleQuestion();if(!q)return '';
 const g=currentGame(),total=previewCandidates().length,kind=q.kind;
 let h=`<section class="preview" aria-label="Sample question"><div class="preview-head"><h3>✨ Sample Question</h3><span>${st.previewIndex%total+1} / ${total} · ${esc(TYPES[kind])}</span></div>`;
 const addChoices=(opts)=>{const a=opts.slice(0,3);if(a.length===3){const n=(st.previewIndex+1)%3;a.splice(n,0,a.splice(0,1)[0]);}return a.map((v,i)=>`<div class="sample-choice"><b>${'ABC'[i]}.</b>${maybeRuby(v)}</div>`).join('');};
 if(kind==='meaning'||kind==='spot'||kind==='gap'||kind==='order'){
  h+=`<p class="sample-prompt">${kind==='meaning'?'Listen and choose the English meaning.':kind==='spot'?'Listen and choose the expression you heard.':kind==='gap'?'Listen and fill in the missing part.':'Listen and put the Japanese sentence in order.'}</p>`;
  h+=`<button class="sample-audio" id="previewListen" type="button">🎧 🔊 Listen to the recording</button>`;
  if(kind==='gap')h+=`<p class="sample-target jp" lang="ja">${ruby(q.jp.replace(q.focus,'＿＿＿＿'))}</p>`;
  if(kind==='meaning'||kind==='spot')h+=addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
  if(kind==='gap')h+=addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
  if(kind==='order')h+=`<div class="sample-tiles">${[...q.tokens,...q.decoys.slice(0,3)].map(t=>`<span>${ruby(t)}</span>`).join('')}</div>`;
 }else if(kind==='error'){
  h+=`<p class="sample-prompt">Fix the highlighted part, one character per button.</p><p class="sample-target jp" lang="ja">${errorText(q,true)}</p>`;
  h+=`<p class="repair-hint">CHARACTER BUTTONS (sample)</p><div class="sample-tiles">${[...q.repairParts,...q.charDecoys.slice(0,6)].map(c=>`<span>${ruby(c)}</span>`).join('')}</div>`;
 }else if(kind==='triple'){
  h+=`<p class="sample-prompt">${q.style==='match'?'Which Japanese sentence matches the English?':q.style==='onlycorrect'?'Which ONE sentence is grammatically correct?':'Which ONE sentence has a grammar mistake?'}</p>`;
  if(q.style==='match')h+=`<p class="sample-target">${esc(q.en)}</p>`;
  h+=addChoices(q.options);
  if(q.style==='onlywrong')h+=`<p class="repair-hint">Then fix the incorrect part with single-character buttons.</p>`;
 }else if(kind==='sentence'||kind==='grammarbuild'){
  h+=`<p class="sample-prompt">Build the Japanese sentence from these word buttons.</p><p class="sample-target">${esc(q.en)}</p>`;
  h+=`<div class="sample-tiles">${[...q.tokens,...(q.decoys||[]).slice(0,4)].map(t=>`<span>${ruby(t)}</span>`).join('')}</div>`;
 }else if(kind==='grammaren'){
  h+=`<p class="sample-prompt">Choose the Japanese grammar that means:</p><p class="sample-target">${esc(q.en)}</p>`+addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
 }else if(kind==='grammarjp'){
  h+=`<p class="sample-prompt">What does this grammar mean?</p><p class="sample-target jp" lang="ja">${ruby(q.jp)}</p>`+addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
 }else if(kind==='nuance'){
  h+=`<p class="sample-prompt">Which sentence best matches the nuance?</p><p class="sample-target">${esc(q.en)}</p>`+addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
 }else if(kind==='transform'){
  h+=`<p class="sample-prompt">${esc(q.prompt)}</p><p class="sample-target jp" lang="ja">${ruby(q.jp)}</p>`+addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
 }else if(kind==='breakdown'){
  h+=`<p class="sample-prompt">What does the highlighted grammar express?</p><p class="sample-target jp" lang="ja">${highlight(q.jp,q.focus)}</p>`+addChoices([q.correct,...q.options.filter(v=>v!==q.correct)]);
 }
 if(st.previewReveal){
  const model=modelText(q);const recorded=AUDIO_BY_JP.get(model);
  h+=`<div class="sample-answer"><b>✓ Answer:</b> ${maybeRuby(q.correct||q.jp)}${kind==='triple'&&q.style==='onlywrong'?`<p><b>Fix:</b> ${ruby(q.repair)} → ${ruby(q.model)}</p>`:''}<p class="explanation">${maybeRuby(q.why||'')}</p>${recorded?`<button type="button" class="sample-audio" id="previewCorrect">🎧 🔊 Listen to the correct sentence</button>`:''}</div>`;
 }
 h+=`<div class="preview-actions"><button type="button" class="btn secondary" id="previewAnswer">${st.previewReveal?'Hide Answer':'Show Answer ✓'}</button><button type="button" class="btn outline" id="previewNext">Another Example →</button></div></section>`;
 return h;
}
function wirePreview(){
 const q=sampleQuestion();if(!q)return;
 const listen=$('previewListen');if(listen)listen.onclick=()=>play(q.audio);
 const correct=$('previewCorrect');if(correct)correct.onclick=()=>hear({...q,model:modelText(q)},'model');
 $('previewAnswer').onclick=()=>{st.previewReveal=!st.previewReveal;renderSetup();};
 $('previewNext').onclick=()=>{st.previewIndex++;st.previewReveal=false;renderSetup();};
}

function renderSetup(){
 let h=`<h2 class="section-title">② Choose Your Practice</h2><p class="sub">Choose a category and see a real example before you start. The different question styles are mixed inside each category.</p><div class="game-list">${GAMES.map(g=>`<button type="button" class="game-option ${g.id===st.mode?'active':''}" data-mode="${g.id}" aria-pressed="${g.id===st.mode}"><span class="game-emoji">${g.emoji}</span><span><strong>${esc(g.name)}</strong><small>${esc(g.description)}</small></span></button>`).join('')}</div>${previewMarkup()}<div class="toolbar">${jlptSetting()}<div class="setting"><label for="level">Difficulty</label><select id="level"><option value="all">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option></select></div><div class="setting"><label for="length">Questions</label><select id="length"><option value="12">12 random</option><option value="20">20 random</option><option value="all">All available</option></select></div>${speedSetting()}${rubyButton()}</div><div class="studyfooter"><p>Difficulty 1–3 describes question complexity; JLPT range controls the grammar covered.</p><button class="btn" id="start">Start ${esc(currentGame().name)} →</button></div>`;
 const available=new Set(activeTypes().flatMap(t=>DATA[t].filter(allowedJLPT).map(q=>String(q.level))));if(st.level!=='all'&&!available.has(st.level))st.level='all';
 $('main').innerHTML=h;wireJLPT(renderSetup);$('level').value=st.level;$('length').value=st.length;for(const opt of $('level').options)if(opt.value!=='all'&&!available.has(opt.value))opt.disabled=true;wireSpeed();wireRuby();wirePreview();
 $('level').onchange=e=>st.level=e.target.value;$('length').onchange=e=>st.length=e.target.value;
 $('main').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;st.previewIndex=0;st.previewReveal=false;renderSetup();});
 $('start').onclick=()=>startPractice();
}

function startPractice(questions){
 if(questions){st.order=shuffle(questions);st.review=true;}
 else{st.review=false;const p=activeTypes().flatMap(eligible);const count=st.length==='all'?p.length:Math.min(Number(st.length),p.length);st.order=st.mode==='detective'?createTripleSet(count):activeTypes().length>1?createMix(count):shuffle(p).slice(0,count);}
 st.pos=0;st.score=0;st.missed=[];if(!st.order.length){alert('No questions available for this level.');return;}resetQuestion();setPage('practice');
}
function makeBank(q){const parts=q.kind==='error'||(q.kind==='triple'&&q.style==='onlywrong')?q.repairParts:q.tokens;const extras=(q.decoys||[]).filter(x=>!parts.includes(x)).slice(0,q.level===1?6:7);return shuffle([...parts,...extras].map((text,id)=>({id,text})));}
function resetQuestion(){st.choice=null;st.chosen=[];st.answered=false;st.skipped=false;st.hint=false;st.stage='select';st.firstRight=false;const q=getCurrent();st.bank=q&&(['order','sentence','grammarbuild','error'].includes(q.kind)||(q.kind==='triple'&&q.style==='onlywrong'))?makeBank(q):[];st.options=q?.options?shuffle(q.options):[];}
function audioButton(q){if(!q.audio)return '';return `<div class="audio-controls"><button class="audio-btn" id="listen" type="button">🎧 🔊 Listen / Replay</button></div><p class="audio-note" id="audioNotice" role="status"></p>`;}
function highlight(s,focus){const i=s.indexOf(focus);return i<0?ruby(s):ruby(s.slice(0,i))+'<mark>'+ruby(focus)+'</mark>'+ruby(s.slice(i+focus.length));}
function errorText(q,highlightError=false){const parts=q.wrong.split(/【|】/);return parts.length===3?ruby(parts[0])+(highlightError?'<mark>':'')+ruby(parts[1])+(highlightError?'</mark>':'')+ruby(parts[2]):ruby(q.wrong);}
function questionBody(q){
 let h=`<div class="qtype">${esc(TYPES[q.kind])} · Level ${q.level}</div>`;
 if(q.kind==='meaning')h+=`<p class="prompt">Listen and choose the English meaning. Japanese is hidden until you answer.</p>${audioButton(q)}`;
 else if(q.kind==='spot')h+=`<p class="prompt">Which Japanese expression do you hear?</p>${audioButton(q)}`;
 else if(q.kind==='gap')h+=`<p class="prompt">Listen and fill the missing Japanese expression.</p><div class="target jp" lang="ja">${ruby(q.jp.replace(q.focus,'＿＿＿＿'))}</div>${audioButton(q)}`;
 else if(q.kind==='order')h+=`<p class="prompt">Listen and build the Japanese sentence you hear.</p>${audioButton(q)}<div class="actions" style="justify-content:center"><button class="btn outline sm" id="hint">${st.hint?'Hide English hint':'Show English hint'}</button></div>${st.hint?`<p class="en">${esc(q.en)}</p>`:''}`;
 else if(q.kind==='sentence')h+=`<p class="prompt">Build the Japanese sentence that matches the English.</p><div class="target">${esc(q.en)}</div><p class="audio-note">Audio available after answering.</p>`;
 else if(q.kind==='error')h+=`<p class="prompt">Find the grammar error. Repair ONLY the incorrect part using the buttons.</p><div class="target">${esc(q.en)}</div><div class="error-sentence" lang="ja">${errorText(q)}</div><p class="audio-note">The corrected sentence can be heard after answering.</p>`;
 else if(q.kind==='nuance')h+=`<p class="prompt">All choices are grammatical. Which best matches the English?</p><div class="target">${esc(q.en)}</div>`;
 else if(q.kind==='transform')h+=`<p class="prompt">${esc(q.prompt)}</p><div class="target jp" lang="ja">${ruby(q.jp)}</div>`;
 else if(q.kind==='breakdown')h+=`<p class="prompt">What does the highlighted part express?</p><div class="target jp" lang="ja">${highlight(q.jp,q.focus)}</div>${audioButton(q)}`;
 else if(q.kind==='triple'){
  if(q.style==='match')h+=`<p class="triple-intro">Three grammatical sentences. Which matches this English meaning?</p><div class="target">${esc(q.en)}</div>`;
  else if(q.style==='onlycorrect')h+=`<p class="triple-intro">Only ONE of these three sentences is grammatically correct.</p>`;
  else h+=`<p class="triple-intro">Two sentences are correct. Find the ONE with a grammar mistake.</p>`;
  if(st.stage==='repair')h+=`<div class="repair-panel"><p class="repair-title">Now repair the incorrect part using the word buttons.</p><div class="error-sentence" lang="ja">${ruby(q.correct)}</div></div>`;
 }
 else if(q.kind==='grammaren')h+=`<p class="prompt">Choose the Japanese grammar that means:</p><div class="target">${esc(q.en)}</div>`;
 else if(q.kind==='grammarjp')h+=`<p class="prompt">What does this grammar mean?</p><div class="target jp" lang="ja">${ruby(q.jp)}</div>`;
 else if(q.kind==='grammarbuild')h+=`<p class="prompt">Build the correct Japanese expression with word buttons.</p><div class="target">${esc(q.en)}</div>`;
 return h;
}
function needsBuild(q){return ['order','sentence','grammarbuild','error'].includes(q.kind)||(q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='repair');}
function optionsBody(q){
 if(needsBuild(q)){
  const built=st.chosen.length?st.chosen.map((id,i)=>{const t=st.bank.find(x=>x.id===id);return `<button class="tile chosen" data-remove="${i}" ${st.answered?'disabled':''}>${ruby(t.text)}</button>`;}).join(''):'<span class="placeholder">Tap the word buttons below ✨</span>';
  const bank=st.bank.map(t=>`<button class="tile" data-add="${t.id}" ${st.answered||st.chosen.includes(t.id)?'disabled':''}>${ruby(t.text)}</button>`).join('');
  return `<div class="buildlabel">${q.kind==='error'||q.kind==='triple'?'REPLACE THE INCORRECT PART':'YOUR ANSWER'}</div><div class="answer" lang="ja">${built}</div><div class="buildlabel">WORD BUTTONS</div><div class="bank" lang="ja">${bank}</div><div class="actions"><button class="btn outline sm" id="undo" ${st.answered||!st.chosen.length?'disabled':''}>↶ Undo</button><button class="btn outline sm" id="clear" ${st.answered||!st.chosen.length?'disabled':''}>Clear</button></div>`;
 }
 return `<div class="choices ${q.kind==='triple'?'triple-select':''}" role="group" aria-label="Answer choices">${st.options.map((v,i)=>{let cls=st.choice===i?'selected':'';if(st.answered&&v===q.correct)cls+=' right';else if(st.answered&&st.choice===i&&v!==q.correct)cls+=' wrong';return `<button class="choice ${cls}" data-choice="${i}" ${st.answered?'disabled':''}>${maybeRuby(v)}</button>`;}).join('')}</div>`;
}
function isRight(q){if(needsBuild(q)){const answer=st.chosen.map(id=>st.bank.find(t=>t.id===id).text);const parts=q.kind==='error'||q.kind==='triple'?q.repairParts:q.tokens;return answer.length===parts.length&&answer.every((t,i)=>t===parts[i]);}return st.choice!==null&&st.options[st.choice]===q.correct;}
function modelText(q){if(q.kind==='error')return q.model;if(q.kind==='triple')return q.model;if(q.kind==='grammaren'||q.kind==='grammarjp')return q.model;if(q.kind==='transform'||q.kind==='nuance')return q.correct;if(q.kind==='meaning'||q.kind==='spot')return q.jp;return q.jp||q.correct;}
function feedbackBody(q){if(!st.answered)return '';
 const right=!st.skipped&&(q.kind==='triple'&&q.style==='onlywrong'?st.firstRight&&isRight(q):isRight(q));const model=modelText(q);
 return `<div class="feedback ${st.skipped?'info':right?'good':'bad'}" role="status"><strong>${st.skipped?'📖 Model answer':right?'✨ Correct!':'✕ Not quite'}</strong><div class="result-jp" lang="ja">${maybeRuby(model)}</div>${q.en?`<p class="result-en">${esc(q.en)}</p>`:''}<p class="explanation"><b>Why?</b> ${maybeRuby(q.why)}</p></div>`;
}
function renderQuestion(){const q=getCurrent(),n=st.order.length,pct=Math.round(st.pos/n*100);
 const stageReady=needsBuild(q)?st.chosen.length>0:st.choice!==null;
 $('main').innerHTML=`<div class="quizhead"><h2 class="section-title">② Random Practice</h2><span class="count">${st.pos+1} / ${n} · ${st.score} correct</span></div><p class="mode-label">${esc(currentGame().name)}</p><div class="meter"><span style="width:${pct}%"></span></div><div class="quiz-controls">${speedSetting()}${rubyButton()}</div><div class="questionbox">${questionBody(q)}</div>${optionsBody(q)}${feedbackBody(q)}${st.answered?`<div class="listen-correct-wrap"><button class="listen-correct" id="listenAgain" type="button"><span class="listen-icon">🎧🔊</span><span>Listen to the correct sentence<small>Tap here to hear the recorded Japanese before moving on</small></span></button></div><div class="result-actions"><button class="btn" id="next">${st.pos===n-1?'See Results →':'Next Question →'}</button></div><p class="audio-note" id="audioNotice" role="status"></p>`:`<div class="actions"><button class="btn" id="check" ${!stageReady?'disabled':''}>${q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='select'?'Find the mistake →':'Check ✓'}</button><button class="btn outline" id="skip">Show Answer / Skip</button></div>`}<div class="actions"><button class="btn outline sm" id="backExamples">Review Examples</button><button class="btn outline sm" id="changeGame">Change Game Type</button></div>`;
 wireSpeed();wireRuby();const audio=$('listen');if(audio)audio.onclick=()=>play(q.audio);const hint=$('hint');if(hint)hint.onclick=()=>{st.hint=!st.hint;renderQuestion();};
 if(!st.answered){
  if(needsBuild(q)){
   $('main').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{st.chosen.push(Number(b.dataset.add));renderQuestion();});
   $('main').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{st.chosen.splice(Number(b.dataset.remove),1);renderQuestion();});
   $('undo').onclick=()=>{st.chosen.pop();renderQuestion();};$('clear').onclick=()=>{st.chosen=[];renderQuestion();};
  }else $('main').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choice=Number(b.dataset.choice);renderQuestion();});
  $('check').onclick=()=>{
   if(q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='select'){
    st.firstRight=isRight(q);st.stage='repair';st.chosen=[];st.bank=makeBank(q);renderQuestion();return;
   }
   if(isRight(q)&&(q.kind!=='triple'||q.style!=='onlywrong'||st.firstRight))st.score++;else st.missed.push(q);
   st.answered=true;renderQuestion();
  };
  $('skip').onclick=()=>{st.skipped=true;st.answered=true;st.missed.push(q);renderQuestion();};
 }else{$('next').onclick=()=>{st.pos++;resetQuestion();render();};$('listenAgain').onclick=()=>hear({...q,model:modelText(q)},'model');}
 $('backExamples').onclick=()=>setPage('examples');$('changeGame').onclick=()=>setPage('setup');
}
function renderFinish(){const total=st.order.length;
 $('main').innerHTML=`<section class="finish"><div class="flower">🌸</div><h2>Great work!</h2><p>Read the explanations and keep practicing!</p><strong>${st.score} / ${total}</strong><p>${st.missed.length?`${st.missed.length} question(s) to review.`:'All correct — excellent!'}</p><div class="actions" style="justify-content:center"><button class="btn" id="again">New Random Set ↻</button>${st.missed.length?'<button class="btn secondary" id="missed">Review Missed</button>':''}<button class="btn outline" id="chooseGame">Choose Game</button><button class="btn outline" id="examples">Back to Examples</button></div></section>`;
