<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentence Builder | Sakura Japanese</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe0f0;--bg2:#e5d4ff;--panel:#ffffff;
  --ink:#4a1942;--muted:#9b7ea8;--accent:#ff6fa8;--accent2:#a78bfa;
  --correct:#3cb371;--wrong:#ff5c5c;--border:#f4d9ef;--soft:#fff6fb;
  --shadow:0 8px 20px rgba(107,33,168,.15);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--ink);font:600 14px/1.6 'Quicksand','Noto Sans JP',sans-serif;
}
button,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.38}
button:focus-visible,select:focus-visible{outline:3px solid #8c6fe0;outline-offset:2px}
[hidden]{display:none!important}
ruby rt{font-size:.54em;color:var(--accent2);font-weight:700}
body.no-ruby rt{display:none}
.wrap{width:100%;max-width:690px;margin:0 auto;padding:20px 13px 58px}
.top{position:sticky;top:10px;z-index:20;display:flex;align-items:center;margin-bottom:10px}
.home-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:800;font-size:.85rem;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);border:2px solid rgba(0,0,0,.06);transition:transform .08s ease}
.home-btn:hover{transform:translateY(-2px)}
.hero{text-align:center;padding:6px 12px 2px}
.hero h1{
  display:inline-block;font-family:'Baloo 2','Quicksand',sans-serif;
  font-size:clamp(29px,5.2vw,38px);font-weight:800;line-height:1.22;margin:4px 0 0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{font-size:13px;color:var(--muted);font-weight:700;margin:1px auto 13px;max-width:480px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 15px}
.tab{padding:12px 10px;border:2px solid var(--border);border-radius:16px;background:#fff;color:var(--ink);font-weight:800;box-shadow:var(--shadow);font-size:15px}
.tab.active{color:white;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.paper{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:25px 22px 22px;margin:0 auto 14px}
.section-title{font-family:'Baloo 2','Quicksand','Noto Sans JP',sans-serif;font-size:24px;line-height:1.3;font-weight:800;color:var(--ink);margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;font-weight:600;line-height:1.6;margin:0 0 15px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:13px 0 16px}
.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settings label{font-size:12px;color:var(--ink);font-weight:800}
.settings select{border:2px solid var(--border);border-radius:13px;background:var(--soft);color:var(--ink);font-weight:800;padding:9px 10px}
.btn{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-radius:16px;padding:12px 20px;font-size:14px;font-weight:800;box-shadow:var(--shadow);min-height:42px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.secondary{background:#f1e9ff;color:#6d4493;box-shadow:none}
.btn.outline{background:white;border:2px solid var(--border);color:var(--ink);box-shadow:none}
.btn.sm{font-size:12px;padding:8px 12px;border-radius:12px;min-height:36px}
.group{border:2px solid var(--border);border-radius:20px;overflow:hidden;margin:16px 0;background:#fff}
.grouphead{background:linear-gradient(110deg,#fff0f8,#f3eaff);padding:14px 17px}
.grouphead h3{font-family:'Baloo 2','Quicksand','Noto Sans JP',sans-serif;font-size:19px;line-height:1.25;color:var(--ink);margin:0}
.grouphead p{font-size:11px;color:#8f6b97;margin:4px 0 0}
.examples{padding:2px 12px 8px}
.example{display:grid;grid-template-columns:27px minmax(0,1fr) 39px;gap:10px;align-items:start;padding:13px 4px;border-bottom:1px solid #f4e7f2}
.example:last-child{border-bottom:0}
.stepnum{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#ffe9f4;color:#bd538a;font-size:11px;font-weight:800;margin-top:5px}
.jp,.result-jp{font-family:'Noto Sans JP',sans-serif;font-weight:600;font-size:16px;line-height:2.1;overflow-wrap:anywhere}
.en{font-size:12px;line-height:1.55;color:#836a88;margin-top:1px;font-weight:600}
.gram{display:inline-block;background:#f4eaff;color:#8b5ca7;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:800;margin-top:5px}
.play{width:36px;height:36px;display:grid;place-items:center;background:var(--soft);border:2px solid var(--border);border-radius:12px;color:#a563a2;font-weight:800;padding:0}
.play:hover{border-color:var(--accent)}
.studyfooter{background:var(--soft);border:2px solid var(--border);border-radius:18px;padding:16px;margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.studyfooter p{margin:0;color:var(--muted);font-size:12px;max-width:350px;flex:1}
.quizhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{background:#fff6fb;border:2px solid var(--border);border-radius:999px;padding:7px 13px;font-weight:800;font-size:12px;color:var(--ink)}
.meter{height:9px;background:#f8e9f4;border-radius:999px;overflow:hidden;margin:14px 0 18px}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .2s}
.questionbox{background:var(--soft);border:2px solid var(--border);border-radius:18px;padding:17px 18px;margin-bottom:18px;text-align:center}
.prompt-ja{font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;line-height:2.1;margin:10px 0 0;color:var(--ink)}
.prompt-en{font-size:12px;font-weight:700;color:var(--muted);margin:0}
.target{font-size:19px;font-weight:800;line-height:1.5;color:var(--ink);margin:13px 0 11px}
.pattern{display:inline-block;background:#f0e5ff;color:#7c54a1;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;font-weight:600}
.buildlabel{font-size:12px;font-weight:800;color:#a15f97;margin:13px 0 6px}
.answer{min-height:84px;background:white;border:2px dashed #d8b8ed;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;align-items:flex-start}
.placeholder{color:var(--muted);font-size:13px;font-weight:700;margin:18px auto;text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 17px}
.tile{font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:14px;line-height:1.65;min-height:43px;background:var(--soft);color:var(--ink);border:2px solid var(--border);border-radius:13px;padding:7px 12px;overflow-wrap:anywhere}
.tile:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.tile.chosen{background:#f2e9ff;border-color:#d6b4f4}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
.feedback{border-radius:14px;font-size:13px;font-weight:800;padding:12px 14px;margin:13px 0}
.feedback.good{background:#e4f8ec;border:2px solid var(--correct);color:#1d6b3f}
.feedback.bad{background:#ffe9e9;border:2px solid var(--wrong);color:#a12b2b}
.feedback.info{background:#f2eaff;border:2px solid #d8c2ee;color:#7b4b9d}
.result-jp{font-size:17px;margin:10px 0 2px}
.result-en{color:var(--muted);font-size:12px;margin:0 0 10px}
.result-actions{display:flex;gap:9px;flex-wrap:wrap}
.finish{text-align:center;padding:22px 5px}
.finish .flower{font-size:44px}
.finish h2{font-family:'Baloo 2','Quicksand',sans-serif;font-size:30px;color:var(--ink);margin:5px 0}
.finish p{font-size:13px;color:var(--muted);font-weight:700}
.finish strong{font-size:27px;color:#b55c9a}
.footer{text-align:center;font-size:11px;font-weight:600;color:#815c86;margin:18px 0}
@media(max-width:540px){
 .wrap{padding:13px 10px 45px}
 .top{margin-bottom:8px}
 .home-btn{padding:8px 13px;font-size:12px}
 .hero{padding:5px 5px 1px}.hero h1{font-size:32px}.hero p{font-size:12px;margin-bottom:12px}
 .paper{padding:18px 12px;border-radius:21px}
 .section-title{font-size:22px}
 .grouphead{padding:11px 12px}.grouphead h3{font-size:17px}
 .examples{padding:0 8px 5px}
 .example{grid-template-columns:22px minmax(0,1fr) 32px;gap:7px;padding:11px 2px}
 .stepnum{width:22px;height:22px;font-size:10px}
 .jp{font-size:14px}.en{font-size:11px}.gram{font-size:10px}
 .play{width:31px;height:31px}
 .questionbox{padding:14px 11px}.target{font-size:17px}
 .tile{font-size:13px;padding:7px 9px}.bank{gap:7px}
 .studyfooter .btn{width:100%}
 .actions .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const pool=groups.flatMap(g=>g.items.filter(x=>x.quiz));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readings={'答':'こた','語句':'ごく','例文':'れいぶん','文法':'ぶんぽう','文':'ぶん','選':'えら','読':'よ','確認':'かくにん','買い物':'かいもの','昼ご飯':'ひるごはん','今夜':'こんや','今朝':'けさ','昨日':'きのう','今日':'きょう','明日':'あした','来週':'らいしゅう','週末':'しゅうまつ','友達':'ともだち','電話':'でんわ','材料':'ざいりょう','時間':'じかん','仕事':'しごと','映画':'えいが','健康':'けんこう','運動':'うんどう','毎朝':'まいあさ','階段':'かいだん','最近':'さいきん','早':'はや','見':'み','思':'おも','寝':'ね','帰':'かえ','雨':'あめ','降':'ふ','作':'つく','足':'た','新':'あたら','試':'ため','忙':'いそが','買':'か','行':'い','食':'た','終':'お','歩':'ある','使':'つか','甘':'あま','起':'お','夜':'よる','今':'いま','昼':'ひる','勉強':'べんきょう','物':'もの'};
const re=new RegExp(Object.keys(readings).sort((a,b)=>b.length-a.length).join('|'),'g');
function ruby(s){return esc(s).replace(re,x=>`<ruby>${x}<rt>${readings[x]}</rt></ruby>`);}
function shuffle(a){let v=[...a];for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]];}return v;}

const audioPlayer=new Audio();
audioPlayer.preload='none';
function playSentence(id){
 const src=audioPaths[id];
 if(!src)return;
 audioPlayer.pause();
 audioPlayer.src=src;
 audioPlayer.currentTime=0;
 audioPlayer.play().catch(error=>console.error('Sentence audio playback failed:',src,error));
}
let state={mode:'examples',length:12,order:[],pos:0,score:0,chosen:[],bank:[],solved:false,attempts:0,feedback:'',reveal:false,ruby:true};
function setMode(mode){state.mode=mode;$('examplesTab').classList.toggle('active',mode==='examples');$('practiceTab').classList.toggle('active',mode==='practice');render();window.scrollTo({top:0,behavior:'instant'});}
function render(){document.body.classList.toggle('no-ruby',!state.ruby);if(state.mode==='examples')renderExamples();else if(state.pos>=state.order.length)renderFinish();else renderQuestion();}
function rubyButton(){return `<button class="btn outline sm" id="rubyToggle" aria-pressed="${state.ruby}">Furigana: ${state.ruby?'On':'Off'}</button>`;}
function wireRuby(){ $('rubyToggle').onclick=()=>{state.ruby=!state.ruby;render();}; }
function renderExamples(){
 let html=`<h2 class="section-title">① Examples · Grammar Steps</h2><p class="sub"><span lang="ja">${ruby("例文を読んで、文法を確認しましょう。")}</span><br>Read all the Japanese and English examples to see how the grammar builds up.</p><div class="toolbar"><div class="settings"><label for="quizLength">Practice questions</label><select id="quizLength"><option value="12">12 random</option><option value="20">20 random</option><option value="all">All ${pool.length} (shuffled)</option></select></div>${rubyButton()}</div>`;
 for(let g of groups){html+=`<section class="group"><div class="grouphead"><h3>${esc(g.title)}</h3><p>${esc(g.subtitle)}</p></div><div class="examples">${g.items.map((d,i)=>`<div class="example"><span class="stepnum">${i+1}</span><div><div class="jp" lang="ja">${ruby(d.jp)}</div><div class="en">${esc(d.en)}</div><div class="gram">${esc(d.tag)}</div></div><button class="play" data-audio="${d.id}" aria-label="Listen to example ${i+1}">▶</button></div>`).join('')}</div></section>`;}
 html+=`<div class="studyfooter"><p>Ready? Now build complete Japanese sentences from English prompts. Each round picks a different random set.</p><button class="btn" id="start">Start Practice →</button></div>`;
 $('main').innerHTML=html;$('quizLength').value=String(state.length);wireRuby();
 document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>playSentence(b.dataset.audio));
 $('quizLength').onchange=e=>state.length=e.target.value;
 $('start').onclick=startPractice;
}
function startPractice(){let n=state.length==='all'?pool.length:Number(state.length);state.order=shuffle(pool).slice(0,n);state.pos=0;state.score=0;startQuestion();setMode('practice');}
function startQuestion(){state.chosen=[];state.solved=false;state.reveal=false;state.feedback='';state.attempts=0;let d=state.order[state.pos];if(!d)return;let distractors=shuffle(d.decoys).slice(0,Math.min(4,d.decoys.length));state.bank=shuffle([...d.tokens,...distractors].map((text,i)=>({id:i,text})));}
function actualTokens(){return state.chosen.map(id=>state.bank.find(t=>t.id===id).text);}
function isCorrect(d){let a=actualTokens(),b=d.tokens;if(a.length!==b.length)return false;if(a.every((x,i)=>x===b[i]))return true;if(d.alt_prefix>1){let n=d.alt_prefix;return a.slice(n).every((x,i)=>x===b[n+i])&&a.slice(0,n).sort().join('\u0000')===b.slice(0,n).sort().join('\u0000');}return false;}
function tile(text,attr,disabled=false,chosen=false){return `<button class="tile ${chosen?'chosen':''}" ${attr} ${disabled?'disabled':''}>${ruby(text)}</button>`;}
function renderQuestion(){let d=state.order[state.pos];let percent=Math.round(state.pos/state.order.length*100);
 let answer=state.chosen.length?state.chosen.map((id,i)=>tile(state.bank.find(t=>t.id===id).text,`data-remove="${i}"`,state.solved,true)).join(''):`<span class="placeholder">Tap the word buttons below ✨</span>`;
 let bank=state.bank.map(t=>tile(t.text,`data-add="${t.id}"`,state.solved||state.chosen.includes(t.id))).join('');
 $('main').innerHTML=`<div class="quizhead"><h2 class="section-title">② Practice · Build it!</h2><span class="count">${state.pos+1} / ${state.order.length} · ${state.score} correct</span></div><div class="meter"><span style="width:${percent}%"></span></div><div class="questionbox"><div class="prompt-ja" lang="ja">${ruby("ボタンを選んで、文を作りましょう。")}</div><p class="prompt-en">Tap the word buttons to build the sentence.</p><div class="target">${esc(d.en)}</div><span class="pattern">${esc(d.tag)}</span><p class="hint">${ruby("例文で見た文法を使いましょう。")} / Use the grammar from Examples. Some buttons are extra.</p></div><div class="buildlabel">YOUR SENTENCE · ${ruby("答え")}</div><div class="answer" id="answerArea" lang="ja">${answer}</div><div class="buildlabel">WORD BUTTONS · ${ruby("語句")}</div><div class="bank" id="wordBank" lang="ja">${bank}</div><div class="actions"><button class="btn outline sm" id="undo" ${!state.chosen.length||state.solved?'disabled':''}>↶ Undo</button><button class="btn outline sm" id="clear" ${!state.chosen.length||state.solved?'disabled':''}>Clear</button><button class="btn" id="check" ${!state.chosen.length||state.solved?'disabled':''}>Check ✓</button>${rubyButton()}</div>${state.feedback?`<div class="feedback ${state.solved?(state.reveal?'info':'good'):'bad'}" role="status">${esc(state.feedback)}</div>`:''}${state.solved?`<div class="result-jp" lang="ja">${ruby(d.jp)}</div><p class="result-en">${esc(d.en)}</p><div class="result-actions"><button class="btn secondary sm" id="listen">▶ Listen</button><button class="btn" id="next">${state.pos===state.order.length-1?'See results →':'Next question →'}</button></div>`:`<div class="actions"><button class="btn outline sm" id="showAnswer">Show answer / Skip</button><button class="btn outline sm" id="backExamples">Review examples</button></div>`}`;
 wireRuby();document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.chosen.push(Number(b.dataset.add));state.feedback='';renderQuestion();});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.chosen.splice(Number(b.dataset.remove),1);state.feedback='';renderQuestion();});
 $('undo').onclick=()=>{state.chosen.pop();state.feedback='';renderQuestion();};$('clear').onclick=()=>{state.chosen=[];state.feedback='';renderQuestion();};
 $('check').onclick=()=>{if(isCorrect(d)){state.solved=true;state.score++;state.feedback='Correct! 🌸 You built the whole sentence.';}else{state.attempts++;state.feedback='Not quite. Check the tense, verb form, and English meaning. Try different buttons.';}renderQuestion();};
 if(state.solved){$('listen').onclick=()=>playSentence(d.id);$('next').onclick=()=>{state.pos++;startQuestion();render();};}
 else{$('showAnswer').onclick=()=>{state.solved=true;state.reveal=true;state.feedback='Model answer (skipped). Read it, then try a new question.';renderQuestion();};$('backExamples').onclick=()=>setMode('examples');}
}
function renderFinish(){$('main').innerHTML=`<section class="finish"><div class="flower">🌸</div><h2>Nice work!</h2><p>You built sentences using different grammar combinations.</p><strong>${state.score} / ${state.order.length}</strong><p>Try another random set, or look through the examples again.</p><div class="actions" style="justify-content:center"><button class="btn" id="again">New random set ↻</button><button class="btn secondary" id="review">Back to Examples</button></div></section>`;$('again').onclick=startPractice;$('review').onclick=()=>setMode('examples');}
$('examplesTab').onclick=()=>setMode('examples');$('practiceTab').onclick=()=>{if(!state.order.length)startPractice();else setMode('practice');};render();
window.addEventListener('pagehide',()=>audioPlayer.pause());
</script></body></html>
