 if(st.previewReveal){
  const model=modelText(q);const recorded=AUDIO_BY_JP.get(model);
  h+=`<div class="sample-answer"><b>✓ Answer:</b> ${maybeRuby(q.correct||q.jp)}${kind==='error'?`<p><b>Correct sentence:</b> ${ruby(q.model)}</p>`:''}${kind==='triple'&&q.style==='onlywrong'?`<p><b>Fix:</b> ${ruby(q.repair)} → ${ruby(q.model)}</p>`:''}<p class="explanation">${maybeRuby(q.why||'')}</p>${recorded?`<button type="button" class="sample-audio" id="previewCorrect">🎧 🔊 Listen to the correct sentence</button>`:''}</div>`;
 }
 h+=`<div class="preview-actions"><button type="button" class="btn secondary" id="previewAnswer">${st.previewReveal?'Hide Answer':'Show Answer ✓'}</button><button type="button" class="btn outline" id="previewNext">Another Example →</button></div></section>`;
 return h;
}
function wirePreview(){
 const q=sampleQuestion();if(!q)return;
 const listen=$('previewListen');if(listen)listen.onclick=()=>play(q.audio);
 const correct=$('previewCorrect');if(correct)correct.onclick=()=>hear({...q,model:modelText(q)},'model');
 $('previewAnswer').onclick=()=>{st.previewReveal=!st.previewReveal;renderSetup();};
 $('previewNext').onclick=()=>{st.previewIndex++;st.previewReveal=false;renderSetup();};
}

function renderSetup(){
 let h=`<h2 class="section-title">② Choose Your Practice</h2><p class="sub">Choose a category and see a real example before you start. The different question styles are mixed inside each category.</p><div class="game-list">${GAMES.map(g=>`<button type="button" class="game-option ${g.id===st.mode?'active':''}" data-mode="${g.id}" aria-pressed="${g.id===st.mode}"><span class="game-emoji">${g.emoji}</span><span><strong>${esc(g.name)}</strong><small>${esc(g.description)}</small></span></button>`).join('')}</div>${previewMarkup()}<div class="toolbar"><div class="setting"><label for="level">Difficulty</label><select id="level"><option value="all">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option></select></div><div class="setting"><label for="length">Questions</label><select id="length"><option value="12">12 random</option><option value="20">20 random</option><option value="all">All available</option></select></div>${speedSetting()}${rubyButton()}</div><div class="studyfooter"><p>Levels reflect the complexity of these examples, not official JLPT levels.</p><button class="btn" id="start">Start ${esc(currentGame().name)} →</button></div>`;
 const available=new Set(activeTypes().flatMap(t=>DATA[t].map(q=>String(q.level))));if(st.level!=='all'&&!available.has(st.level))st.level='all';
 $('main').innerHTML=h;$('level').value=st.level;$('length').value=st.length;for(const opt of $('level').options)if(opt.value!=='all'&&!available.has(opt.value))opt.disabled=true;wireSpeed();wireRuby();wirePreview();
 $('level').onchange=e=>st.level=e.target.value;$('length').onchange=e=>st.length=e.target.value;
 $('main').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;st.previewIndex=0;st.previewReveal=false;renderSetup();});
 $('start').onclick=()=>startPractice();
}

function startPractice(questions){
 if(questions){st.order=shuffle(questions);st.review=true;}
 else{st.review=false;const p=activeTypes().flatMap(eligible);const count=st.length==='all'?p.length:Math.min(Number(st.length),p.length);st.order=st.mode==='detective'?createTripleSet(count):activeTypes().length>1?createMix(count):shuffle(p).slice(0,count);}
 st.pos=0;st.score=0;st.missed=[];if(!st.order.length){alert('No questions available for this level.');return;}resetQuestion();setPage('practice');
}
function makeBank(q){
 if(q.kind==='error'||(q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='repair')){
  const chars=Array.from(q.repairParts.join(''));
  const decoys=shuffle((q.charDecoys||[]).filter(c=>Array.from(c).length===1));
  const extras=decoys.slice(0,Math.min(12,Math.max(9,chars.length+6)));
  return shuffle([...chars,...extras].map((text,id)=>({id,text})));
 }
 const parts=q.tokens||[];const extras=(q.decoys||[]).filter(x=>!parts.includes(x)).slice(0,q.level===1?6:7);
 return shuffle([...parts,...extras].map((text,id)=>({id,text})));
}
function resetQuestion(){st.choice=null;st.chosen=[];st.answered=false;st.skipped=false;st.hint=false;st.stage='select';st.firstRight=false;const q=getCurrent();st.bank=q&&(['order','sentence','grammarbuild','error'].includes(q.kind)||(q.kind==='triple'&&q.style==='onlywrong'))?makeBank(q):[];st.options=q?.options?shuffle(q.options):[];}
function audioButton(q){if(!q.audio)return '';return `<div class="audio-controls"><button class="audio-btn" id="listen" type="button">🎧 🔊 Listen / Replay</button></div><p class="audio-note" id="audioNotice" role="status"></p>`;}
function highlight(s,focus){const i=s.indexOf(focus);return i<0?ruby(s):ruby(s.slice(0,i))+'<mark>'+ruby(focus)+'</mark>'+ruby(s.slice(i+focus.length));}
function errorText(q,highlightError=false){const parts=q.wrong.split(/【|】/);return parts.length===3?ruby(parts[0])+(highlightError?'<mark>':'')+ruby(parts[1])+(highlightError?'</mark>':'')+ruby(parts[2]):ruby(q.wrong);}
function questionBody(q){
 let h=`<div class="qtype">${esc(TYPES[q.kind])} · Level ${q.level}</div>`;
 if(q.kind==='meaning')h+=`<p class="prompt">Listen and choose the English meaning. Japanese is hidden until you answer.</p>${audioButton(q)}`;
 else if(q.kind==='spot')h+=`<p class="prompt">Which Japanese expression do you hear?</p>${audioButton(q)}`;
 else if(q.kind==='gap')h+=`<p class="prompt">Listen and fill the missing Japanese expression.</p><div class="target jp" lang="ja">${ruby(q.jp.replace(q.focus,'＿＿＿＿'))}</div>${audioButton(q)}`;
 else if(q.kind==='order')h+=`<p class="prompt">Listen and build the Japanese sentence you hear.</p>${audioButton(q)}<div class="actions" style="justify-content:center"><button class="btn outline sm" id="hint">${st.hint?'Hide English hint':'Show English hint'}</button></div>${st.hint?`<p class="en">${esc(q.en)}</p>`:''}`;
 else if(q.kind==='sentence')h+=`<p class="prompt">Build the Japanese sentence that matches the English.</p><div class="target">${esc(q.en)}</div><p class="audio-note">Audio available after answering.</p>`;
 else if(q.kind==='error')h+=`<p class="prompt">Fix the highlighted grammar mistake, ONE CHARACTER per button.</p><div class="target">${esc(q.en)}</div><div class="error-sentence" lang="ja">${errorText(q,true)}</div><p class="audio-note">The corrected sentence can be heard after answering.</p>`;
 else if(q.kind==='nuance')h+=`<p class="prompt">All choices are grammatical. Which best matches the English?</p><div class="target">${esc(q.en)}</div>`;
 else if(q.kind==='transform')h+=`<p class="prompt">${esc(q.prompt)}</p><div class="target jp" lang="ja">${ruby(q.jp)}</div>`;
 else if(q.kind==='breakdown')h+=`<p class="prompt">What does the highlighted part express?</p><div class="target jp" lang="ja">${highlight(q.jp,q.focus)}</div>${audioButton(q)}`;
 else if(q.kind==='triple'){
  if(q.style==='match')h+=`<p class="triple-intro">Three grammatical sentences. Which matches this English meaning?</p><div class="target">${esc(q.en)}</div>`;
  else if(q.style==='onlycorrect')h+=`<p class="triple-intro">Only ONE of these three sentences is grammatically correct.</p>`;
  else h+=`<p class="triple-intro">Two sentences are correct. Find the ONE with a grammar mistake.</p>`;
  if(st.stage==='repair')h+=`<div class="repair-panel"><p class="repair-title">Now fix the highlighted part, ONE CHARACTER at a time.</p><div class="error-sentence" lang="ja">${errorText(q,true)}</div></div>`;
 }
 else if(q.kind==='grammaren')h+=`<p class="prompt">Choose the Japanese grammar that means:</p><div class="target">${esc(q.en)}</div>`;
 else if(q.kind==='grammarjp')h+=`<p class="prompt">What does this grammar mean?</p><div class="target jp" lang="ja">${ruby(q.jp)}</div>`;
 else if(q.kind==='grammarbuild')h+=`<p class="prompt">Build the correct Japanese expression with word buttons.</p><div class="target">${esc(q.en)}</div>`;
 return h;
}
function needsBuild(q){return ['order','sentence','grammarbuild','error'].includes(q.kind)||(q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='repair');}
function optionsBody(q){
 if(needsBuild(q)){
  const built=st.chosen.length?st.chosen.map((id,i)=>{const t=st.bank.find(x=>x.id===id);return `<button class="tile chosen" data-remove="${i}" ${st.answered?'disabled':''}>${ruby(t.text)}</button>`;}).join(''):'<span class="placeholder">Tap the word buttons below ✨</span>';
  const bank=st.bank.map(t=>`<button class="tile" data-add="${t.id}" ${st.answered||st.chosen.includes(t.id)?'disabled':''}>${ruby(t.text)}</button>`).join('');
  return `<div class="buildlabel">${q.kind==='error'||q.kind==='triple'?'REPLACE THE INCORRECT PART':'YOUR ANSWER'}</div><div class="answer ${q.kind==='error'||q.kind==='triple'?'character-answer':''}" lang="ja">${built}</div><div class="buildlabel">${q.kind==='error'||q.kind==='triple'?'CHARACTER BUTTONS · tap one character at a time':'WORD BUTTONS'}</div><div class="bank ${q.kind==='error'||q.kind==='triple'?'character-bank':''}" lang="ja">${bank}</div><div class="actions"><button class="btn outline sm" id="undo" ${st.answered||!st.chosen.length?'disabled':''}>↶ Undo</button><button class="btn outline sm" id="clear" ${st.answered||!st.chosen.length?'disabled':''}>Clear</button></div>`;
 }
 return `<div class="choices ${q.kind==='triple'?'triple-select':''}" role="group" aria-label="Answer choices">${st.options.map((v,i)=>{let cls=st.choice===i?'selected':'';if(st.answered&&v===q.correct)cls+=' right';else if(st.answered&&st.choice===i&&v!==q.correct)cls+=' wrong';return `<button class="choice ${cls}" data-choice="${i}" ${st.answered?'disabled':''}>${maybeRuby(v)}</button>`;}).join('')}</div>`;
}
function isRight(q){if(needsBuild(q)){const answer=st.chosen.map(id=>st.bank.find(t=>t.id===id).text);const parts=q.kind==='error'||q.kind==='triple'?q.repairParts:q.tokens;return answer.length===parts.length&&answer.every((t,i)=>t===parts[i]);}return st.choice!==null&&st.options[st.choice]===q.correct;}
function modelText(q){if(q.kind==='error')return q.model;if(q.kind==='triple')return q.model;if(q.kind==='grammaren'||q.kind==='grammarjp')return q.model;if(q.kind==='transform'||q.kind==='nuance')return q.correct;if(q.kind==='meaning'||q.kind==='spot')return q.jp;return q.jp||q.correct;}
function feedbackBody(q){if(!st.answered)return '';
 const right=!st.skipped&&(q.kind==='triple'&&q.style==='onlywrong'?st.firstRight&&isRight(q):isRight(q));const model=modelText(q);
 const ndesuTip=/んです|んですが/.test(model)&&['nuance','breakdown','triple','error'].includes(q.kind)?'<p class="nuance-tip">💡 ～んです gives explanatory background (often “the thing is…” or “actually…” in context). It is not a past-tense ending.</p>':'';
 return `<div class="feedback ${st.skipped?'info':right?'good':'bad'}" role="status"><strong>${st.skipped?'📖 Model answer':right?'✨ Correct!':'✕ Not quite'}</strong><div class="result-jp" lang="ja">${maybeRuby(model)}</div>${q.en?`<p class="result-en">${esc(q.en)}</p>`:''}<p class="explanation"><b>Why?</b> ${maybeRuby(q.why)}</p>${ndesuTip}</div>`;
}
function renderQuestion(){const q=getCurrent(),n=st.order.length,pct=Math.round(st.pos/n*100);
 const stageReady=needsBuild(q)?st.chosen.length>0:st.choice!==null;
 $('main').innerHTML=`<div class="quizhead"><h2 class="section-title">② Random Practice</h2><span class="count">${st.pos+1} / ${n} · ${st.score} correct</span></div><p class="mode-label">${esc(currentGame().name)}</p><div class="meter"><span style="width:${pct}%"></span></div><div class="quiz-controls">${speedSetting()}${rubyButton()}</div><div class="questionbox">${questionBody(q)}</div>${optionsBody(q)}${feedbackBody(q)}${st.answered?`<div class="listen-correct-wrap"><button class="listen-correct" id="listenAgain" type="button"><span class="listen-icon">🎧🔊</span><span>Listen to the correct sentence<small>Tap here to hear the recorded Japanese before moving on</small></span></button></div><div class="result-actions"><button class="btn" id="next">${st.pos===n-1?'See Results →':'Next Question →'}</button></div><p class="audio-note" id="audioNotice" role="status"></p>`:`<div class="actions"><button class="btn" id="check" ${!stageReady?'disabled':''}>${q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='select'?'Find the mistake →':'Check ✓'}</button><button class="btn outline" id="skip">Show Answer / Skip</button></div>`}<div class="actions"><button class="btn outline sm" id="backExamples">Review Examples</button><button class="btn outline sm" id="changeGame">Change Game Type</button></div>`;
 wireSpeed();wireRuby();const audio=$('listen');if(audio)audio.onclick=()=>play(q.audio);const hint=$('hint');if(hint)hint.onclick=()=>{st.hint=!st.hint;renderQuestion();};
 if(!st.answered){
  if(needsBuild(q)){
   $('main').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{st.chosen.push(Number(b.dataset.add));renderQuestion();});
   $('main').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{st.chosen.splice(Number(b.dataset.remove),1);renderQuestion();});
   $('undo').onclick=()=>{st.chosen.pop();renderQuestion();};$('clear').onclick=()=>{st.chosen=[];renderQuestion();};
  }else $('main').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{st.choice=Number(b.dataset.choice);renderQuestion();});
  $('check').onclick=()=>{
   if(q.kind==='triple'&&q.style==='onlywrong'&&st.stage==='select'){
    st.firstRight=isRight(q);st.stage='repair';st.chosen=[];st.bank=makeBank(q);renderQuestion();return;
   }
   if(isRight(q)&&(q.kind!=='triple'||q.style!=='onlywrong'||st.firstRight))st.score++;else st.missed.push(q);
   st.answered=true;renderQuestion();
  };
  $('skip').onclick=()=>{st.skipped=true;st.answered=true;st.missed.push(q);renderQuestion();};
 }else{$('next').onclick=()=>{st.pos++;resetQuestion();render();};$('listenAgain').onclick=()=>hear({...q,model:modelText(q)},'model');}
 $('backExamples').onclick=()=>setPage('examples');$('changeGame').onclick=()=>setPage('setup');
}
function renderFinish(){const total=st.order.length;
 $('main').innerHTML=`<section class="finish"><div class="flower">🌸</div><h2>Great work!</h2><p>Read the explanations and keep practicing!</p><strong>${st.score} / ${total}</strong><p>${st.missed.length?`${st.missed.length} question(s) to review.`:'All correct — excellent!'}</p><div class="actions" style="justify-content:center"><button class="btn" id="again">New Random Set ↻</button>${st.missed.length?'<button class="btn secondary" id="missed">Review Missed</button>':''}<button class="btn outline" id="chooseGame">Choose Game</button><button class="btn outline" id="examples">Back to Examples</button></div></section>`;
 $('again').onclick=()=>startPractice();if(st.missed.length){const wrong=[...st.missed];$('missed').onclick=()=>startPractice(wrong);} $('examples').onclick=()=>setPage('examples');$('chooseGame').onclick=()=>setPage('setup');
}
$('examplesTab').onclick=()=>setPage('examples');$('practiceTab').onclick=()=>setPage('setup');
render();window.addEventListener('pagehide',()=>{player.pause();});
</script></body></html>
