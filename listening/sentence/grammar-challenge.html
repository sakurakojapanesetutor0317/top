mark{background:#ffe2f1;color:#9a246a;border-radius:5px;padding:0 3px}.finish{text-align:center;padding:22px 5px}.finish .flower{font-size:43px}.finish h2{font-family:'Baloo 2','Quicksand',sans-serif;font-size:30px;margin:5px 0}.finish p{font-size:16px;color:var(--muted);font-weight:700}.finish strong{font-size:27px;color:#b55c9a}.footer{text-align:center;font-size:14px;font-weight:600;color:#684b72;margin:18px 0}

ろです。","en":"I was just thinking of watching a movie.","audio":"audio/sentence05.mp3","tag":"＋ 〜ていたところ","level":2,"section":"01 · Plans & Timing"},{"id":"intent-5","jp":"映画を見ようと思っていたところに、友達から電話がかかってきました。","en":"Just as I was thinking of watching a movie, a friend called.","audio":"audio/sentence06.mp3","tag":"＋ 〜ところに","level":3,"section":"01 · Plans & Timing"},{"id":"intent-6","jp":"映画を見ようと思っていたんですが、寝てしまいました。","en":"I was planning to watch a movie, but I ended up falling asleep.","audio":"audio/sentence07.mp3","tag":"＋ past intention ＋ 〜てしまう","level":3,"section":"01 · Plans & Timing"},{"id":"intent-7","jp":"そのとき、映画を見ようと思っているところだったんです。","en":"The thing is, at that moment I was just thinking of watching a movie.","audio":"audio/sentence08.mp3","tag":"＋ 〜ところだった ＋ んです","level":3,"section":"01 · Plans & Timing"},{"id":"intent-8","jp":"今夜は早く寝ようと思っています。","en":"I’m planning to go to bed early tonight.","audio":"audio/sentence09.mp3","tag":"Another verb ＋ intention","level":3,"section":"01 · Plans & Timing"},{"id":"intent-9","jp":"帰ろうと思っていたところに、雨が降ってきました。","en":"Just as I was thinking of heading home, it started raining.","audio":"audio/sentence10.mp3","tag":"Another verb ＋ 〜ところに","level":3,"section":"01 · Plans & Timing"},{"id":"try-0","jp":"ケーキを作ります。","en":"I will make a cake.","audio":"audio/sentence11.mp3","tag":"Base","level":1,"section":"02 · Try & Want"},{"id":"try-1","jp":"ケーキを作ってみます。","en":"I’ll try making a cake.","audio":"audio/sentence12.mp3","tag":"＋ 〜てみる","level":1,"section":"02 · Try & Want"},{"id":"try-2","jp":"ケーキを作ってみたいです。","en":"I want to try making a cake.","audio":"audio/sentence13.mp3","tag":"＋ 〜たい","level":2,"section":"02 · Try & Want"},{"id":"try-3","jp":"ケーキを作ってみたいと思っています。","en":"I’ve been thinking I’d like to try making a cake.","audio":"audio/sentence14.mp3","tag":"＋ 〜と思っている","level":2,"section":"02 · Try & Want"},{"id":"try-4","jp":"ケーキを作ってみたいと思っているんです。","en":"Actually, I’ve been thinking I’d like to try making a cake.","audio":"audio/sentence15.mp p raining.","audio":"audio/sentence34.mp3","tag":"Past intention ＋ 〜てしまう","level":3,"section":"04 · Habits & Purpose"},{"id":"habit-7","jp":"健康のために、夜は甘いものを食べないようにしています。","en":"For my health, I try not to eat sweets at night.","audio":"audio/sentence35.mp3","tag":"〜ない ＋ 〜ようにしている","level":3,"section":"04 · Habits & Purpose"},{"id":"habit-8","jp":"明日から早く起きるようにしようと思っています。","en":"I’m planning to start making an effort to get up early tomorrow.","audio":"audio/sentence36.mp3","tag":"〜ようにする ＋ volitional ＋ intention","level":3,"section":"04 · Habits & Purpose"}],"error":[{"id":"error-0","wrong":"映画を見よう【に思って】いました。","en":"I had been planning to watch a movie.","correct":"と思って","why":"The volitional form is followed by the quotation particle と, not に.","level":1,"audio":null,"repairParts":["と","思","っ","て"],"model":"映画を見ようと思っていました。","charDecoys":["に","思","っ","て","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-1","wrong":"映画を見ようと【思いて】いました。","en":"I had been thinking of watching a movie.","correct":"思って","why":"思う is a Group 1 verb: its て-form is 思って, not 思いて.","level":1,"audio":null,"repairParts":["思","っ","て"],"model":"映画を見ようと思っていました。","charDecoys":["思","い","て","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-2","wrong":"映画を【見ろう】と思っていました。","en":"I had been planning to watch a movie.","correct":"見よう","why":"The volitional form of 見る (Group 2) is 見よう, not 見ろう.","level":1,"audio":null,"repairParts":["見","よ","う"],"model":"映画を見ようと思っていました。","charDecoys":["見","ろ","う","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-3","wrong":"今夜は早く寝よう【に】思っています。","en":"I am planning to go to bed early tonight.","correct":"と","why":"The volitional form 寝よう takes the quotation particle と before 思っています.","level":1,"audio":"audio/sentence04.mp3","repairParts":["と"],"model":"今夜は早く寝ようと思っています。","charDecoys":["に","の","で","を","と","て","で","た","く","な","い","し","う","ま"]},{"id":"error-4","wrong":"映画を見ようと思って【いたです】。","en":"I had been planning to watch a movie.","correct":"いました","why":"Use 思っていました for the polite past; plain いた + です does not work here.","level":1,"audio":null,"repairParts":["い","ま","し","た"],"model":"映画を見ようと思っていました。","charDecoys":["い","た","で","す","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-5","wrong":"ケーキを作って【みたいかった】です。","en":"I wanted to try making a cake.","correct":"みたかった","why":"～たい conjugates like an い-adjective: みたい → みたかった.","level":2,"audio":null,"repairParts":["み","た","か","っ","た"],"model":"ケーキを作ってみたかったです。","charDecoys":["み","た","い","か","っ","た","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-6","wrong":"ケーキを作って【みたく】です。","en":"I want to try making a cake.","correct":"みたい","why":"～たく is a connecting form; before です, use ～たい.","level":2,"audio":"audio/sentence13.mp3","repairParts":["み","た","い"],"model":"ケーキを作ってみたいです。","charDecoys":["み","た","く","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-7","wrong":"ケーキを作ってみたい【に】思っています。","en":"I have been thinking I would like to try making a cake.","correct":"と","why":"Quote the thought with と before 思っています, not に.","level":2,"audio":"audio/sentence14.mp3","repairParts":["と"],"model":"ケーキを作ってみたいと思っています。","charDecoys":["に","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-8","wrong":"ケーキを作って【みろう】と思っていました。","en":"I had been planning to try making a cake.","correct":"みよう","why":"The volitional form of みる (Group 2) is みよう.","level":2,"audio":null,"repairParts":["み","よ","う"],"model":"ケーキを作ってみようと思っていました。","charDecoys":["み","ろ","う","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-9","wrong":"ケーキを作ってみたく【ないかった】です。","en":"I did not want to try making a cake.","correct":"なかった","why":"The past negative of ～たい is ～たくなかった, not ～たくないかった.","level":2,"audio":null,"repairP pairParts":["行","こ","う"],"model":"昨日は忙しくて買い物に行けなかったので、今日行こうと思っています。","charDecoys":["行","き","よ","う","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-15","wrong":"時間が【ないで】、昼ご飯を食べられませんでした。","en":"I did not have time, so I could not eat lunch.","correct":"なくて","why":"Here, ～なくて gives the reason for not being able to eat; ～ないで means without doing.","level":2,"audio":"audio/sentence24.mp3","repairParts":["な","く","て"],"model":"時間がなくて、昼ご飯を食べられませんでした。","charDecoys":["な","い","で","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-16","wrong":"時間が【なかったで】、昼ご飯を食べられませんでした。","en":"I could not eat lunch because I had no time.","correct":"なくて","why":"Use 時間がなくて or 時間がなかったので; なかったで is not the correct connector.","level":2,"audio":"audio/sentence24.mp3","repairParts":["な","く","て"],"model":"時間がなくて、昼ご飯を食べられませんでした。","charDecoys":["な","か","っ","た","で","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-17","wrong":"仕事が終わら【ないで】、映画を見られなかったんです。","en":"I could not finish work, so I could not watch the movie.","correct":"なくて","why":"Use 終わらなくて for a reason; 終わらないで generally means without finishing.","level":2,"audio":"audio/sentence27.mp3","repairParts":["な","く","て"],"model":"仕事が終わらなくて、映画を見られなかったんです。","charDecoys":["な","い","で","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-18","wrong":"健康のために、毎朝【歩き】ようにしています。","en":"I make a point of walking every morning for my health.","correct":"歩く","why":"Before ～ようにしています, use the dictionary form 歩く, not the ます-stem 歩き.","level":3,"audio":"audio/sentence30.mp3","repairParts":["歩","く"],"model":"健康のために、毎朝歩くようにしています。","charDecoys":["歩","き","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-19","wrong":"健康のために、毎朝歩く【ようを】しています。","en":"I make an effort to walk every morning for my health.","correct":"ように","why":"The pattern is ～ようにしています, not ～ようをしています.","level":3,"audio":"audio/sentence30.mp3","repairParts":["よ","う","に"],"model":"健康のために、毎朝歩くようにしています。","charDecoys":["よ","う","を","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-20","wrong":"健康のために、エレベーターを【使いないで】階段を使うようにしています。","en":"For my health, I try to take the stairs without using the elevator.","correct":"使わないで","why":"The ない-form of 使う is 使わない, not 使いない.","level":3,"audio":"audio/sentence31.mp3","repairParts":["使","わ","な","い","で"],"model":"健康のために、エレベーターを使わないで階段を使うようにしています。","charDecoys":["使","い","な","い","で","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-21","wrong":"最近、健康のために階段を使うようにしている【です】。","en":"Lately, I have been making an effort to take the stairs for my health.","correct":"んです","why":"After the plain form している, add んです for an explanation; しているです is incorrect.","level":3,"audio":"audio/sentence32.mp3","repairParts":["ん","で","す"],"model":"最近、健康のために階段を使うようにしているんです。","charDecoys":["で","す","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-22","wrong":"健康のために、夜は甘いものを【食べなく】ようにしています。","en":"For my health, I try not to eat sweets at night.","correct":"食べない","why":"Before ～ようにしています, use the negative ない-form 食べない.","level":3,"audio":"audio/sentence35.mp3","repairParts":["食","べ","な","い"],"model":"健康のために、夜は甘いものを食べないようにしています。","charDecoys":["食","べ","な","く","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-23","wrong":"明日から早く【起き】ようにしようと思っています。","en":"I plan to start making an effort to get up early tomorrow.","correct":"起きる","why":"Before ～ようにしよう, use the dictionary form 起きる.","level":3,"audio":"audio/sentence36.mp3","repairParts":["起","き","る"],"model":"明日から早く起きるようにしようと思っています。","charDecoys":["起","き","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-24","wrong":"今朝は歩こうと思っていたんですが、雨が【降りて】しまいました。","en":"I had planned to walk this morning, but it ended up raining.","correct":"降って","why":"The て-form of 降る is 降って, not 降りて.","level":3,"audio":"audio/sentence34.mp3","repairParts":["降","っ","て"],"model":"今朝は歩こうと思っていたんですが、雨が降ってしまいました。","charDecoys":["降","り","て","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"error-25","wrong":"昨日は忙しくて、買い物に行けなかった【なんです】。","en":"The thing is, I was busy yesterday, so I could not go shopping.","correct":"んです","why":"After the plain past 行けなかった, use んです (explanatory), not なんです. なんです follows nouns and な-adjectives.","level":3,"audio":"audio/sentence22.mp3","repairParts":["ん","で","す"],"model":"昨日は忙しくて、買い物に行けなかったんです。","charDecoys":["な","ん","で","す","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]}],"nuance":[{"id":"nuance-movie-0","en":"I think I’ll watch a movie.","correct":"映画を見ようと思います。","options":["映画を見ようと思います。","映画を見ようと思っています。","映画を見ようと思っていました。","映画を見たいです。","映画を見ようと思いました。","映画を見たかったです。"],"why":"～ようと思います can express a decision or thought at the moment. Compare: ～と思います = a thought/decision; ～と思っています = an existing plan; ～と思っていました = a past plan; ～たい = desire.","level":1,"audio":null},{"id":"nuance-movie-1","en":"I’m planning to watch a movie.","correct":"映画を見ようと思っています。","options":["映画を見ようと思います。","映画を見ようと思っています。","映画を見ようと思っていました。","映画を見たいです。","映画を見ようと思いました。","映画を見たかったです。"],"why":"～ようと思っています describes an intention already held. Compare: ～と思います = a thought/decision; ～と思っています = an existing plan; ～と思っていました = a past plan; ～たい = desire.","level":1,"audio":null},{"id":"nuance-movie-2","en":"I had been planning to watch a movie.","correct":"映画を見ようと思っていました。","options":["映画を見ようと思います。","映画を見ようと思っています。","映画を見ようと思っていました。","映画を見たいです。","映画を見ようと思いました。","映画を見たかったです。"],"why":"～ようと思っていました puts that ongoing intention in the past. Compare: ～と思います = a thought/decision; ～と思っています = an existing plan; ～と思っていました = a past plan; ～たい = desire.","level":1,"audio":null},{"id":"nuance-movie-3","en":"I want to watch a movie.","correct":"映画を見たいです。","options":["映画を見ようと思います。","映画を見ようと思っています。","映画を見ようと思っていました。","映画を見たいです。","映画を見ようと思いました。","映画を見たかったです。"],"why":"～たい expresses desire, not necessarily a concrete plan. Compare: ～と思います = a thought/decision; ～と思っています = an existing plan; ～と思っていました = a past plan; ～たい = desire.","level":1,"audio":null},{"id":"nuance-cake-0","en":"I’ll try making a cake.","correct":"ケーキを作ってみます。","options":["ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみたかったです。","ケーキを作ってみようと思っています。","ケーキを作ってみたくないです。","ケーキを作ってみたくなかったです。"],"why":"～てみます expresses trying an action. Compare: ～てみます = try; ～てみたい = want to try; ～てみたかった = wanted to try; ～てみようと思っています = plan to try.","level":1,"audio":null},{"id":"nuance-cake-1","en":"I want to try making a cake.","correct":"ケーキを作ってみたいです。","options":["ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみたかったです。","ケーキを作ってみようと思っています。","ケーキを作ってみたくないです。","ケーキを作ってみたくなかったです。"],"why":"～てみたい expresses the desire to try. Compare: ～てみます = try; ～てみたい = want to try; ～てみたかった = wanted to try; ～てみようと思っています = plan to try.","level":1,"audio":null},{"id":"nuance-cake-2","en":"I wanted to try making a cake.","correct":"ケーキを作ってみたかったです。","options":["ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみたかったです。","ケーキを作ってみようと思っています。","ケーキを作ってみたくないです。","ケーキを作ってみたくなかったです。"],"why":"～てみたかった is the past of wanting to try. Compare: ～てみます = try; ～てみたい = want to try; ～てみたかった = wanted to try; ～てみようと思っています = plan to try.","level":1,"audio":null},{"id":"nuance-cake-3","en":"I’m planning to try making a cake.","correct":"ケーキを作ってみようと思っています。","options":["ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみたかったです。","ケーキを作ってみようと思っています。","ケーキを作ってみたくないです。","ケーキを作ってみたくなかったです。"],"why":"～てみようと思っています expresses an intention to try. Compare: ～てみます = try; ～てみたい = want to try; ～てみたかった = wanted to try; ～てみようと思っています = plan to try.","level":1,"audio":null},{"id":"nuance-shopping-0","en":"I did not go shopping yesterday.","correct":"昨日、買い物に行きませんでした。","options":["昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。","昨日、買い物に行きたくありませんでした。","昨日、買い物に行こうと思っていました。","昨日、買い物に行きました。","昨日、買い物に行けました。"],"why":"行きませんでした reports the action did not happen, without stating inability. Compare: 行きませんでした = did not go; 行けませんでした = could not go; 行きたくありませんでした = did not want to go.","level":2,"audio":null},{"id":"nuance-shopping-1","en":"I could not go shopping yesterday.","correct":"昨日、買い物に行けませんでした。","options":["昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。","昨日、買い物に行きたくありませんでした。","昨日、買い物に行こうと思っていました。","昨日、買い物に行きました。","昨日、買い物に行けました。"],"why":"行けませんでした is past negative potential: unable to go. Compare: 行きませんでした = did not go; 行けませんでした = could not go; 行きたくありませんでした = did not want to go.","level":2,"audio":null},{"id":"nuance-shopping-2","en":"I did not want to go shopping yesterday.","correct":"昨日、買い物に行きたくありませんでした。","options":["昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。","昨日、買い物に行きたくありませんでした。","昨日、買い物に行こうと思っていました。","昨日、買い物に行きました。","昨日、買い物に行けました。"],"why":"行きたくありませんでした describes a lack of desire. Compare: 行きませんでした = did not go; 行けませんでした = could not go; 行きたくありませんでした = did not want to go.","level":2,"audio":null},{"id":"nuance-shopping-3","en":"I had been planning to go shopping yesterday.","correct":"昨日、買い物に行こうと思っていました。","options":["昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。","昨日、買い物に行きたくありませんでした。","昨日、買い物に行こうと思っていました。","昨日、買い物に行きました。","昨日、買い物に行けました。"],"why":"行こうと思っていました describes an earlier intention. Compare: 行きませんでした = did not go; 行けませんでした = could not go; 行きたくありませんでした = did not want to go.","level":2,"audio":null},{"id":"nuance-walking-0","en":"I walk every morning.","correct":"毎朝歩いています。","options":["毎朝歩いています。","毎朝歩くようにしています。","明日から毎朝歩こうと思っています。","以前は毎朝歩くようにしていました。","毎朝歩こうと思っています。","以前は毎朝歩いていました。"],"why":"～ています can describe a continuing habit. Compare: 歩いています = regular habit; 歩くようにしています = conscious effort; 歩こうと思っています = future plan.","level":2,"audio":null},{"id":"nuance-walking-1","en":"I make a point of walking every morning.","correct":"毎朝歩くようにしています。","options":["毎朝歩いています。","毎朝歩くようにしています。","明日から毎朝歩こうと思っています。","以前は毎朝歩くようにしていました。","毎朝歩こうと思っています。","以前は毎朝歩いていました。"],"why":"～ようにしています emphasizes conscious effort. Compare: 歩いています = regular habit; 歩くようにしています = conscious effort; 歩こうと思っています = future plan.","level":2,"audio":null},{"id":"nuance-walking-2","en":"I’m planning to start walking every morning tomorrow.","correct":"明日から毎朝歩こうと思っています。","options":["毎朝歩いています。","毎朝歩くようにしています。","明日から毎朝歩こうと思っています。","以前は毎朝歩くようにしていました。","毎朝歩こうと思っています。","以前は毎朝歩いていました。"],"why":"～ようと思っています is a plan, not yet an established habit. Compare: 歩いています = regular habit; 歩くようにしています = conscious effort; 歩こうと思っています = future plan.","level":2,"audio":null},{"id":"nuance-walking-3","en":"I used to make an effort to walk every morning.","correct":"以前は毎朝歩くようにしていました。","options":["毎朝歩いています。","毎朝歩くようにしています。","明日から毎朝歩こうと思っています。","以前は毎朝歩くようにしていました。","毎朝歩こうと思っています。","以前は毎朝歩いていました。"],"why":"～ようにしていました puts the conscious effort in the past. Compare: 歩いています = regular habit; 歩くようにしています = conscious effort; 歩こうと思っています = future plan.","level":2,"audio":null},{"id":"nuance-recipe-0","en":"I’ll try a new recipe.","correct":"新しいレシピを試してみます。","options":["新しいレシピを試してみます。","新しいレシピを試してみたいです。","新しいレシピを試してみました。","新しいレシピを試してみようと思っています。","新しいレシピを試してみたかったです。","新しいレシピを試してみたくないです。"],"why":"～てみます means trying something. Compare: ～てみます = try; ～てみたい = want to try; ～てみました = tried; ～てみようと思っています = plan to try.","level":3,"audio":null},{"id":"nuance-recipe-1","en":"I want to try a new recipe.","correct":"新しいレシピを試してみたいです。","options":["新しいレシピを試してみます。","新しいレシピを試してみたいです。","新しいレシピを試してみました。","新しいレシピを試してみようと思っています。","新しいレシピを試してみたかったです。","新しいレシピを試してみたくないです。"],"why":"～てみたい expresses desire to try. Compare: ～てみます = try; ～てみたい = want to try; ～てみました = tried; ～てみようと思っています = plan to try.","level":3,"audio":null},{"id":"nuance-recipe-2","en":"I tried a new recipe.","correct":"新しいレシピを試してみました。","options":["新しいレシピを試してみます。","新しいレシピを試してみたいです。","新しいレシピを試してみました。","新しいレシピを試してみようと思っています。","新しいレシピを試してみたかったです。","新しいレシピを試してみたくないです。"],"why":"～てみました means the attempt already happened. Compare: ～てみます = try; ～てみたい = want to try; ～てみました = tried; ～てみようと思っています = plan to try.","level":3,"audio":null},{"id":"nuance-recipe-3","en":"I’m planning to try a new recipe.","correct":"新しいレシピを試してみようと思っています。","options":["新しいレシピを試してみます。","新しいレシピを試してみたいです。","新しいレシピを試してみました。","新しいレシピを試してみようと思っています。","新しいレシピを試してみたかったです。","新しいレシピを試してみたくないです。"],"why":"～てみようと思っています expresses a plan to try. Compare: ～てみます = try; ～てみたい = want to try; ～てみました = tried; ～てみようと思っています = plan to try.","level":3,"audio":null},{"id":"nuance-sweets-0","en":"I do not eat sweets at night.","correct":"夜は甘いものを食べません。","options":["夜は甘いものを食べません。","夜は甘いものを食べないようにしています。","夜は甘いものを食べたくありません。","夜は甘いものを食べないようにしていました。","夜は甘いものを食べました。","夜は甘いものを食べたいです。"],"why":"食べません states a negative habit or action. Compare: 食べません = do not eat; 食べないようにしています = try not to eat; 食べたくありません = do not want to eat.","level":3,"audio":null},{"id":"nuance-sweets-1","en":"I try not to eat sweets at night.","correct":"夜は甘いものを食べないようにしています。","options":["夜は甘いものを食べません。","夜は甘いものを食べないようにしています。","夜は甘いものを食べたくありません。","夜は甘いものを食べないようにしていました。","夜は甘いものを食べました。","夜は甘いものを食べたいです。"],"why":"～ないようにしています emphasizes deliberate effort to avoid the action. Compare: 食べません = do not eat; 食べないようにしています = try not to eat; 食べたくありません = do not want to eat.","level":3,"audio":null},{"id":"nuance-sweets-2","en":"I do not want to eat sweets at night.","correct":"夜は甘いものを食べたくありません。","options":["夜は甘いものを食べません。","夜は甘いものを食べないようにしています。","夜は甘いものを食べたくありません。","夜は甘いものを食べないようにしていました。","夜は甘いものを食べました。","夜は甘いものを食べたいです。"],"why":"～たくありません expresses a lack of desire. Compare: 食べません = do not eat; 食べないようにしています = try not to eat; 食べたくありません = do not want to eat.","level":3,"audio":null},{"id":"nuance-sweets-3","en":"I was making an effort not to eat sweets at night.","correct":"夜は甘いものを食べないようにしていました。","options":["夜は甘いものを食べません。","夜は甘いものを食べないようにしています。","夜は甘いものを食べたくありません。","夜は甘いものを食べないようにしていました。","夜は甘いものを食べました。","夜は甘いものを食べたいです。"],"why":"～ないようにしていました describes a past deliberate effort. Compare: 食べません = do not eat; 食べないようにしています = try not to eat; 食べたくありません = do not want to eat.","level":3,"audio":null},{"id":"nuance-ndesu-0","en":"The thing is, I was busy yesterday, so I couldn’t go shopping. (explaining the situation)","correct":"昨日は忙しくて、買い物に行けなかったんです。","options":["昨日は忙しくて、買い物に行けなかったんです。","昨日は忙しくて、買い物に行けませんでした。","昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。","昨日、買い物に行きたくありませんでした。","昨日、買い物に行こうと思っていました。"],"why":"～んです adds explanatory background, often like “the thing is…” or “actually…” in context. Without ～んです, the sentence simply reports what happened.","level":2,"audio":null},{"id":"nuance-ndesu-1","en":"The thing is, I had no time, so I couldn’t eat lunch. (explaining why)","correct":"時間がなくて、昼ご飯を食べられなかったんです。","options":["時間がなくて、昼ご飯を食べられなかったんです。","時間がなくて、昼ご飯を食べられませんでした。","昨日は忙しくて、買い物に行けませんでした。","昨日は忙しくて、買い物に行けなかったんです。","昨日、買い物に行けませんでした。","仕事が終わらなくて、映画を見られなかったんです。"],"why":"～んです signals an explanation/background. It is not a tense ending: 食べられなかった is past inability, and んです adds the explanatory tone.","level":3,"audio":null},{"id":"nuance-ndesu-2","en":"Actually, I’ve been thinking I would like to try making a cake. (giving background)","correct":"ケーキを作ってみたいと思っているんです。","options":["ケーキを作ってみたいと思っているんです。","ケーキを作ってみたいと思っています。","ケーキを作ってみたいです。","ケーキを作ってみます。","ケーキを作ってみたかったです。","ケーキを作ってみようと思っています。"],"why":"～んです can introduce an explanation or background information (“actually / the thing is…”). Compare the neutral 思っています and explanatory 思っているんです.","level":2,"audio":null}],"transform":[{"id":"transform-0","jp":"ケーキを作ってみたいです。","prompt":"Change the desire to PAST affirmative.","correct":"ケーキを作ってみたかったです。","options":["ケーキを作ってみたかったです。","ケーキを作ってみたいです。","ケーキを作ってみたくないです。","ケーキを作ってみたくなかったです。","ケーキを作ってみました。","ケーキを作ってみませんでした。"],"why":"～たい → ～たかった is past affirmative.","level":1,"audio":"audio/sentence13.mp3"},{"id":"transform-1","jp":"ケーキを作ってみたいです。","prompt":"Change the desire to PRESENT negative.","correct":"ケーキを作ってみたくないです。","options":["ケーキを作ってみたくないです。","ケーキを作ってみたかったです。","ケーキを作ってみたくなかったです。","ケーキを作ってみます。","ケーキを作ってみました。","ケーキを作ってみませんでした。"],"why":"～たい → ～たくない is present negative.","level":1,"audio":"audio/sentence13.mp3"},{"id":"transform-2","jp":"ケーキを作ってみたいです。","prompt":"Change the desire to PAST negative.","correct":"ケーキを作ってみたくなかったです。","options":["ケーキを作ってみたくなかったです。","ケーキを作ってみたいです。","ケーキを作ってみたくないです。","ケーキを作ってみたかったです。","ケーキを作ってみました。","ケーキを作ってみませんでした。"],"why":"～たい → ～たくなかった is past negative.","level":1,"audio":"audio/sentence13.mp3"},{"id":"transform-3","jp":"新しいレシピを試してみたいです。","prompt":"Change the desire to PAST affirmative.","correct":"新しいレシピを試してみたかったです。","options":["新しいレシピを試してみたかったです。","新しいレシピを試してみたいです。","新しいレシピを試してみたくないです。","新しいレシピを試してみたくなかったです。","新しいレシピを試してみました。","新しいレシピを試してみませんでした。"],"why":"みたい behaves like an い-adjective: みたかった.","level":1,"audio":null},{"id":"transform-4","jp":"新しいレシピを試してみたいです。","prompt":"Change the desire to PRESENT negative.","correct":"新しいレシピを試してみたくないです。","options":["新しいレシピを試してみたくないです。","新しいレシピを試してみたいです。","新しいレシピを試してみたかったです。","新しいレシピを試してみたくなかったです。","新しいレシピを試してみました。","新しいレシピを試してみませんでした。"],"why":"みたい → みたくない for present negative.","level":1,"audio":null},{"id":"transform-5","jp":"新しいレシピを試してみたいです。","prompt":"Change the desire to PAST negative.","correct":"新しいレシピを試してみたくなかったです。","options":["新しいレシピを試してみたくなかったです。","新しいレシピを試してみたいです。","新しいレシピを試してみたかったです。","新しいレシピを試してみたくないです。","新しいレシピを試してみました。","新しいレシピを試してみませんでした。"],"why":"みたい → みたくなかった for past negative.","level":1,"audio":null},{"id":"transform-6","jp":"映画を見ようと思っています。","prompt":"Change the ongoing plan to PAST.","correct":"映画を見ようと思っていました。","options":["映画を見ようと思っていました。","映画を見ようと思っています。","映画を見ようと思います。","映画を見たいと思っています。","映画を見ようと思っていません。","映画を見ようと思っていませんでした。"],"why":"思っています → 思っていました; the volitional 見よう stays unchanged.","level":2,"audio":"audio/sentence03.mp3"},{"id":"transform-7","jp":"映画を見ようと思っていました。","prompt":"Change the earlier ongoing plan to PRESENT.","correct":"映画を見ようと思っています。","options":["映画を見ようと思っています。","映画を見ようと思っていました。","映画を見ようと思いました。","映画を見たいと思っています。","映画を見ようと思っていません。","映画を見ようと思っていませんでした。"],"why":"思っていました → 思っています.","level":2,"audio":null},{"id":"transform-8","jp":"映画を見ようと思います。","prompt":"Change the thought to PAST (not ongoing).","correct":"映画を見ようと思いました。","options":["映画を見ようと思いました。","映画を見ようと思っています。","映画を見ようと思っていました。","映画を見たいと思いました。","映画を見ようと思っていません。","映画を見ようと思っていませんでした。"],"why":"思います → 思いました is simple past; 思っていました means an ongoing thought in the past.","level":2,"audio":"audio/sentence02.mp3"},{"id":"transform-9","jp":"今夜は早く寝ようと思っています。","prompt":"Change the ongoing plan to PAST.","correct":"今夜は早く寝ようと思っていました。","options":["今夜は早く寝ようと思っていました。","今夜は早く寝ようと思っています。","今夜は早く寝ようと思いました。","今夜は早く寝たいと思っています。","今夜は早く寝ようと思っていません。","今夜は早く寝ようと思っていませんでした。"],"why":"Only 思っています changes to 思っていました.","level":2,"audio":"audio/sentence09.mp3"},{"id":"transform-10","jp":"週末にケーキを作ってみようと思っています。","prompt":"Change the ongoing plan to PAST.","correct":"週末にケーキを作ってみようと思っていました。","options":["週末にケーキを作ってみようと思っていました。","週末にケーキを作ってみようと思っています。","週末にケーキを作ってみたいと思っています。","週末にケーキを作ってみました。","週末にケーキを作ってみようと思っていません。","週末にケーキを作ってみようと思っていませんでした。"],"why":"Past ongoing plan uses 思っていました, not a past action.","level":2,"audio":"audio/sentence16.mp3"},{"id":"transform-11","jp":"明日から早く起きるようにしようと思っています。","prompt":"Change the ongoing plan to PAST.","correct":"明日から早く起きるようにしようと思っていました。","options":["明日から早く起きるようにしようと思っていました。","明日から早く起きるようにしようと思っています。","明日から早く起きるようにしています。","明日から早く起きるようにしていました。","明日から早く起きるようにしようと思っていません。","明日から早く起きるようにしようと思っていませんでした。"],"why":"Keep ようにしよう (the planned effort); change 思っています to 思っていました.","level":2,"audio":"audio/sentence36.mp3"},{"id":"transform-12","jp":"仕事は忙しいです。","prompt":"Change the adjective to PAST affirmative.","correct":"仕事は忙しかったです。","options":["仕事は忙しかったです。","仕事は忙しいです。","仕事は忙しくないです。","仕事は忙しくなかったです。","仕事は忙しくなりました。","仕事は忙しかったと思います。"],"why":"忙しい → 忙しかった for past affirmative.","level":2,"audio":null},{"id":"transform-13","jp":"仕事は忙しいです。","prompt":"Change the adjective to PAST negative.","correct":"仕事は忙しくなかったです。","options":["仕事は忙しくなかったです。","仕事は忙しかったです。","仕事は忙しくないです。","仕事は忙しいです。","仕事は忙しくなりました。","仕事は忙しかったと思います。"],"why":"忙しい → 忙しくなかった for past negative.","level":2,"audio":null},{"id":"transform-14","jp":"買い物に行けます。","prompt":"Change the potential form to PAST negative.","correct":"買い物に行けませんでした。","options":["買い物に行けませんでした。","買い物に行きませんでした。","買い物に行けました。","買い物に行けません。","買い物に行けなくなりました。","買い物に行きたくありませんでした。"],"why":"行ける → 行けませんでした means could not go.","level":2,"audio":null},{"id":"transform-15","jp":"買い物に行けます。","prompt":"Change the potential form to PRESENT negative.","correct":"買い物に行けません。","options":["買い物に行けません。","買い物に行けませんでした。","買い物に行きません。","買い物に行けました。","買い物に行きませんでした。","買い物に行けなくなりました。"],"why":"行ける → 行けません is present negative potential.","level":2,"audio":null},{"id":"transform-16","jp":"昼ご飯を食べられます。","prompt":"Change the potential form to PAST negative.","correct":"昼ご飯を食べられませんでした。","options":["昼ご飯を食べられませんでした。","昼ご飯を食べませんでした。","昼ご飯を食べられました。","昼ご飯を食べられません。","昼ご飯を食べられなくなりました。","昼ご飯を食べたくありませんでした。"],"why":"食べられる → 食べられませんでした is polite past negative potential.","level":2,"audio":null},{"id":"transform-17","jp":"映画を見られます。","prompt":"Change the potential form to PAST negative.","correct":"映画を見られませんでした。","options":["映画を見られませんでした。","映画を見ませんでした。","映画を見られました。","映画を見られません。","映画を見られなくなりました。","映画を見たくありませんでした。"],"why":"見られる → 見られませんでした, not 見ませんでした.","level":2,"audio":null},{"id":"transform-18","jp":"健康のために、毎朝歩くようにしています。","prompt":"Change the conscious habit to PAST.","correct":"健康のために、毎朝歩くようにしていました。","options":["健康のために、毎朝歩くようにしていました。","健康のために、毎朝歩くようにしています。","健康のために、毎朝歩こうと思っています。","健康のために、毎朝歩いています。","健康のために、毎朝歩くようにしていません。","健康のために、毎朝歩くようにしていませんでした。"],"why":"ようにしています → ようにしていました; the dictionary form 歩く remains.","level":3,"audio":"audio/sentence30.mp3"},{"id":"transform-19","jp":"健康のために、夜は甘いものを食べないようにしています。","prompt":"Change the conscious habit to PAST.","correct":"健康のために、夜は甘いものを食べないようにしていました。","options":["健康のために、夜は甘いものを食べないようにしていました。","健康のために、夜は甘いものを食べないようにしています。","健康のために、夜は甘いものを食べるようにしています。","健康のために、夜は甘いものを食べたくありません。","健康のために、夜は甘いものを食べないようにしていません。","健康のために、夜は甘いものを食べないようにしていませんでした。"],"why":"Change しています to していました; 食べない stays negative.","level":3,"audio":"audio/sentence35.mp3"},{"id":"transform-20","jp":"毎朝歩いています。","prompt":"Change the habitual description to PAST.","correct":"毎朝歩いていました。","options":["毎朝歩いていました。","毎朝歩いています。","毎朝歩こうと思っています。","毎朝歩きませんでした。","毎朝歩いていません。","毎朝歩いていませんでした。"],"why":"歩いています → 歩いていました for a past ongoing habit.","level":3,"audio":null},{"id":"transform-21","jp":"階段を使うようにしています。","prompt":"Change the deliberate habit to PAST.","correct":"階段を使うようにしていました。","options":["階段を使うようにしていました。","階段を使うようにしています。","階段を使おうと思っています。","階段を使いませんでした。","階段を使うようにしていません。","階段を使うようにしていませんでした。"],"why":"ようにしています → ようにしていました.","level":3,"audio":null},{"id":"transform-22","jp":"ケーキを作ってみます。","prompt":"Change “try doing” to PAST.","correct":"ケーキを作ってみました。","options":["ケーキを作ってみました。","ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみたかったです。","ケーキを作ってみようと思っています。","ケーキを作ってみませんでした。"],"why":"～てみます → ～てみました indicates the attempt happened.","level":3,"audio":"audio/sentence12.mp3"},{"id":"transform-23","jp":"新しいレシピを試してみます。","prompt":"Change “try doing” to PAST.","correct":"新しいレシピを試してみました。","options":["新しいレシピを試してみました。","新しいレシピを試してみます。","新しいレシピを試してみたいです。","新しいレシピを試してみたかったです。","新しいレシピを試してみようと思っています。","新しいレシピを試してみませんでした。"],"why":"～てみました is past attempt, not past desire.","level":3,"audio":null}],"breakdown":[{"id":"intent-0","jp":"映画を見ます。","en":"I will watch a movie.","audio":"audio/sentence01.mp3","focus":"見ます","correct":"A simple non-past action or habit","options":["A simple non-past action or habit","A habit continuing over time","Past affirmative of an い-adjective","Past inability / “could not”","Present inability / “cannot”","A past action that did not happen"],"why":"見ます is polite non-past. It does not contain a volitional or desire form.","level":1,"group":"intent"},{"id":"intent-1","jp":"映画を見ようと思います。","en":"I think I’ll watch a movie.","audio":"audio/sentence02.mp3","focus":"見よう","correct":"Volitional form / intention","options":["Volitional form / intention","A plan or thought currently held","An intention held in the past","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"見よう is the volitional of 見る; ～と思います frames the intention as a thought.","level":1,"group":"intent"},{"id":"intent-2","jp":"映画を見ようと思っています。","en":"I’m planning to watch a movie.","audio":"audio/sentence03.mp3","focus":"思っています","correct":"A plan or thought currently held","options":["A plan or thought currently held","Volitional form / intention","An intention held in the past","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"思っています means the speaker is holding the intention now.","level":2,"group":"intent"},{"id":"intent-3","jp":"今、映画を見ようと思っているところです。","en":"I’m just thinking of watching a movie now.","audio":"audio/sentence04.mp3","focus":"ところです","correct":"At the point of doing/thinking now","options":["At the point of doing/thinking now","A timing expression set in the past","An event happening just as something else was about to happen","An action completed with an unintended/regrettable nuance","Giving background or an explanation","Introducing a reason / “because”"],"why":"～ているところです describes being at that point right now.","level":2,"group":"intent"},{"id":"intent-4","jp":"ちょうど映画を見ようと思っていたところです。","en":"I was just thinking of watching a movie.","audio":"audio/sentence05.mp3","focus":"思っていた","correct":"An intention held in the past","options":["An intention held in the past","Volitional form / intention","A plan or thought currently held","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"The thought is in past form: 思っていた. The sentence says the speaker was just thinking of watching.","level":2,"group":"intent"},{"id":"intent-5","jp":"映画を見ようと思っていたところに、友達から電話がかかってきました。","en":"Just as I was thinking of watching a movie, a friend called.","audio":"audio/sentence06.mp3","focus":"ところに","correct":"An event happening just as something else was about to happen","options":["An event happening just as something else was about to happen","At the point of doing/thinking now","A timing expression set in the past","An action completed with an unintended/regrettable nuance","Giving background or an explanation","Introducing a reason / “because”"],"why":"～ていたところに introduces the event that occurred just as the situation was unfolding.","level":3,"group":"intent"},{"id":"intent-6","jp":"映画を見ようと思っていたんですが、寝てしまいました。","en":"I was planning to watch a movie, but I ended up falling asleep.","audio":"audio/sentence07.mp3","focus":"しまいました","correct":"An action completed with an unintended/regrettable nuance","options":["An action completed with an unintended/regrettable nuance","At the point of doing/thinking now","A timing expression set in the past","An event happening just as something else was about to happen","Giving background or an explanation","Introducing a reason / “because”"],"why":"～てしまいました can suggest an unexpected or regrettable completed result.","level":3,"group":"intent"},{"id":"intent-7","jp":"そのとき、映画を見ようと思っているところだったんです。","en":"The thing is, at that moment I was just thinking of watching a movie.","audio":"audio/sentence08.mp3","focus":"だった","correct":"A timing expression set in the past","options":["A timing expression set in the past","At the point of doing/thinking now","An event happening just as something else was about to happen","An action completed with an unintended/regrettable nuance","Giving background or an explanation","Introducing a reason / “because”"],"why":"ところだった sets the timing expression in the past; んです adds explanation.","level":3,"group":"intent"},{"id":"intent-8","jp":"今夜は早く寝ようと思っています。","en":"I’m planning to go to bed early tonight.","audio":"audio/sentence09.mp3","focus":"思っています","correct":"A plan or thought currently held","options":["A plan or thought currently held","Volitional form / intention","An intention held in the past","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"The speaker currently has a plan to go to bed early.","level":3,"group":"intent"},{"id":"intent-9","jp":"帰ろうと思っていたところに、雨が降ってきました。","en":"Just as I was thinking of heading home, it started raining.","audio":"audio/sentence10.mp3","focus":"ところに","correct":"An event happening just as something else was about to happen","options":["An event happening just as something else was about to happen","At the point of doing/thinking now","A timing expression set in the past","An action completed with an unintended/regrettable nuance","Giving background or an explanation","Introducing a reason / “because”"],"why":"The rain started just as the speaker was about to head home.","level":3,"group":"intent"},{"id":"try-0","jp":"ケーキを作ります。","en":"I will make a cake.","audio":"audio/sentence11.mp3","focus":"作ります","correct":"A simple non-past action or habit","options":["A simple non-past action or habit","A habit continuing over time","Past affirmative of an い-adjective","Past inability / “could not”","Present inability / “cannot”","A past action that did not happen"],"why":"作ります is a simple non-past verb; ～てみる would be needed to mean “try making”.","level":1,"group":"try"},{"id":"try-1","jp":"ケーキを作ってみます。","en":"I’ll try making a cake.","audio":"audio/sentence12.mp3","focus":"作ってみます","correct":"Trying an action","options":["Trying an action","Wanting to try an action","Planning to try an action","A desire held in the past","A plan or thought currently held","An intention held in the past"],"why":"Verb て-form + みます means to try doing the action.","level":1,"group":"try"},{"id":"try-2","jp":"ケーキを作ってみたいです。","en":"I want to try making a cake.","audio":"audio/sentence13.mp3","focus":"みたい","correct":"Wanting to try an action","options":["Wanting to try an action","Trying an action","Planning to try an action","A desire held in the past","A plan or thought currently held","An intention held in the past"],"why":"～てみたい expresses a wish to try the action.","level":2,"group":"try"},{"id":"try-3","jp":"ケーキを作ってみたいと思っています。","en":"I’ve been thinking I’d like to try making a cake.","audio":"audio/sentence14.mp3","focus":"思っています","correct":"A plan or thought currently held","options":["A plan or thought currently held","Volitional form / intention","An intention held in the past","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"The desire to try is framed as a thought the speaker currently holds.","level":2,"group":"try"},{"id":"try-4","jp":"ケーキを作ってみたいと思っているんです。","en":"Actually, I’ve been thinking I’d like to try making a cake.","audio":"audio/sentence15.mp3","focus":"んです","correct":"Giving background or an explanation","options":["Giving background or an explanation","Giving a reason with an い-adjective","Introducing a reason / “because”","Expressing a purpose / “for the sake of”","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"～んです adds an explanatory tone: “Actually, ...”.","level":2,"group":"try"},{"id":"try-5","jp":"週末にケーキを作ってみようと思っています。","en":"I’m planning to try making a cake this weekend.","audio":"audio/sentence16.mp3","focus":"みよう","correct":"Planning to try an action","options":["Planning to try an action","Trying an action","Wanting to try an action","A desire held in the past","A plan or thought currently held","An intention held in the past"],"why":"みよう is the volitional of みる; 作ってみようと思っています is planning to try.","level":3,"group":"try"},{"id":"try-6","jp":"ケーキを作ってみようと思っていたんですが、材料が足りませんでした。","en":"I was planning to try making a cake, but I didn’t have enough ingredients.","audio":"audio/sentence17.mp3","focus":"思っていた","correct":"An intention held in the past","options":["An intention held in the past","Volitional form / intention","A plan or thought currently held","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"思っていた describes a plan held earlier, before the lack of ingredients.","level":3,"group":"try"},{"id":"try-7","jp":"ケーキを作ってみたかったんですが、時間がありませんでした。","en":"I wanted to try making a cake, but I didn’t have time.","audio":"audio/sentence18.mp3","focus":"みたかった","correct":"A desire held in the past","options":["A desire held in the past","Trying an action","Wanting to try an action","Planning to try an action","A plan or thought currently held","An intention held in the past"],"why":"～てみたかった is the past of wanting to try.","level":3,"group":"try"},{"id":"try-8","jp":"新しいレシピを試してみたいと思っています。","en":"I’ve been thinking I’d like to try a new recipe.","audio":"audio/sentence19.mp3","focus":"みたい","correct":"Wanting to try an action","options":["Wanting to try an action","Trying an action","Planning to try an action","A desire held in the past","A plan or thought currently held","An intention held in the past"],"why":"試してみたい is a desire to try a new recipe.","level":3,"group":"try"},{"id":"reason-0","jp":"昨日は忙しかったです。","en":"I was busy yesterday.","audio":"audio/sentence20.mp3","focus":"忙しかった","correct":"Past affirmative of an い-adjective","options":["Past affirmative of an い-adjective","A simple non-past action or habit","A habit continuing over time","Past inability / “could not”","Present inability / “cannot”","A past action that did not happen"],"why":"忙しい changes to 忙しかった in the past affirmative.","level":1,"group":"reason"},{"id":"reason-1","jp":"昨日は忙しくて、買い物に行けませんでした。","en":"I was busy yesterday, so I couldn’t go shopping.","audio":"audio/sentence21.mp3","focus":"忙しくて","correct":"Giving a reason with an い-adjective","options":["Giving a reason with an い-adjective","Introducing a reason / “because”","Giving background or an explanation","Expressing a purpose / “for the sake of”","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"忙しくて is the くて form of 忙しい and links the reason to the result.","level":1,"group":"reason"},{"id":"reason-2","jp":"昨日は忙しくて、買い物に行けなかったんです。","en":"The thing is, I was busy yesterday, so I couldn’t go shopping.","audio":"audio/sentence22.mp3","focus":"行けなかった","correct":"Past inability / “could not”","options":["Past inability / “could not”","A simple non-past action or habit","A habit continuing over time","Past affirmative of an い-adjective","Present inability / “cannot”","A past action that did not happen"],"why":"行けなかった is past negative potential: was unable to go.","level":2,"group":"reason"},{"id":"reason-3","jp":"昨日は忙しくて買い物に行けなかったので、今日行こうと思っています。","en":"I couldn’t go shopping yesterday because I was busy, so I’m planning to go today.","audio":"audio/sentence23.mp3","focus":"ので","correct":"Introducing a reason / “because”","options":["Introducing a reason / “because”","Giving a reason with an い-adjective","Giving background or an explanation","Expressing a purpose / “for the sake of”","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"ので connects the inability to go shopping with the plan for today.","level":2,"group":"reason"},{"id":"reason-4","jp":"時間がなくて、昼ご飯を食べられませんでした。","en":"I didn’t have time, so I couldn’t eat lunch.","audio":"audio/sentence24.mp3","focus":"食べられませんでした","correct":"Past inability / “could not”","options":["Past inability / “could not”","A simple non-past action or habit","A habit continuing over time","Past affirmative of an い-adjective","Present inability / “cannot”","A past action that did not happen"],"why":"食べられませんでした is polite past negative potential: could not eat.","level":2,"group":"reason"},{"id":"reason-5","jp":"時間がなくて、昼ご飯を食べられなかったんです。","en":"The thing is, I didn’t have time, so I couldn’t eat lunch.","audio":"audio/sentence25.mp3","focus":"んです","correct":"Giving background or an explanation","options":["Giving background or an explanation","Giving a reason with an い-adjective","Introducing a reason / “because”","Expressing a purpose / “for the sake of”","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"んです explains why the speaker could not eat lunch.","level":3,"group":"reason"},{"id":"reason-6","jp":"昨日は時間がなくて買い物に行けなかったので、今日は早めに行こうと思っています。","en":"I didn’t have time to go shopping yesterday, so I’m planning to go earlier today.","audio":"audio/sentence26.mp3","focus":"行こう","correct":"Volitional form / intention","options":["Volitional form / intention","A plan or thought currently held","An intention held in the past","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"行こう is the volitional of 行く, used with 思っています to express a plan.","level":3,"group":"reason"},{"id":"reason-7","jp":"仕事が終わらなくて、映画を見られなかったんです。","en":"The thing is, I couldn’t finish work, so I couldn’t watch the movie.","audio":"audio/sentence27.mp3","focus":"終わらなくて","correct":"Introducing a reason / “because”","options":["Introducing a reason / “because”","Giving a reason with an い-adjective","Giving background or an explanation","Expressing a purpose / “for the sake of”","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"終わらなくて gives the reason why the speaker could not watch the movie. ～んです adds explanatory background (the thing is / actually).","level":3,"group":"reason"},{"id":"habit-0","jp":"毎朝歩きます。","en":"I walk every morning.","audio":"audio/sentence28.mp3","focus":"歩きます","correct":"A habit continuing over time","options":["A habit continuing over time","A deliberate habit or conscious effort","A conscious effort not to do something","Planning to begin making an effort","A plan or thought currently held","A simple non-past action or habit"],"why":"The time phrase 毎朝 makes 歩きます a regular habit here.","level":1,"group":"habit"},{"id":"habit-1","jp":"健康のために、毎朝歩いています。","en":"I walk every morning for my health.","audio":"audio/sentence29.mp3","focus":"ために","correct":"Expressing a purpose / “for the sake of”","options":["Expressing a purpose / “for the sake of”","Giving a reason with an い-adjective","Introducing a reason / “because”","Giving background or an explanation","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"健康のために means for the sake of health; it gives the purpose.","level":1,"group":"habit"},{"id":"habit-2","jp":"健康のために、毎朝歩くようにしています。","en":"I make a point of walking every morning for my health.","audio":"audio/sentence30.mp3","focus":"ようにしています","correct":"A deliberate habit or conscious effort","options":["A deliberate habit or conscious effort","A habit continuing over time","A conscious effort not to do something","Planning to begin making an effort","A plan or thought currently held","A simple non-past action or habit"],"why":"～ようにしています expresses a conscious habit or effort.","level":2,"group":"habit"},{"id":"habit-3","jp":"健康のために、エレベーターを使わないで階段を使うようにしています。","en":"For my health, I try to take the stairs instead of the elevator.","audio":"audio/sentence31.mp3","focus":"使わないで","correct":"Doing something without doing another action","options":["Doing something without doing another action","Giving a reason with an い-adjective","Introducing a reason / “because”","Giving background or an explanation","Expressing a purpose / “for the sake of”","An event happening just as something else was about to happen"],"why":"使わないで means without using; it describes using the stairs instead.","level":2,"group":"habit"},{"id":"habit-4","jp":"最近、健康のために階段を使うようにしているんです。","en":"Actually, lately I’ve been making an effort to take the stairs for my health.","audio":"audio/sentence32.mp3","focus":"しているんです","correct":"Giving background or an explanation","options":["Giving background or an explanation","Giving a reason with an い-adjective","Introducing a reason / “because”","Expressing a purpose / “for the sake of”","Doing something without doing another action","An event happening just as something else was about to happen"],"why":"The habitual effort is given as explanatory background with んです. ～んです adds explanatory background (the thing is / actually).","level":2,"group":"habit"},{"id":"habit-5","jp":"運動するために、来週から毎朝歩こうと思っています。","en":"I’m planning to start walking every morning next week to get some exercise.","audio":"audio/sentence33.mp3","focus":"歩こう","correct":"Volitional form / intention","options":["Volitional form / intention","A plan or thought currently held","An intention held in the past","Planning to begin making an effort","Planning to try an action","A desire held in the past"],"why":"歩こう is volitional; with 思っています it signals a future plan.","level":3,"group":"habit"},{"id":"habit-6","jp":"今朝は歩こうと思っていたんですが、雨が降ってしまいました。","en":"I was planning to walk this morning, but it ended up raining.","audio":"audio/sentence34.mp3","focus":"しまいました","correct":"An action completed with an unintended/regrettable nuance","options":["An action completed with an unintended/regrettable nuance","At the point of doing/thinking now","A timing expression set in the past","An event happening just as something else was about to happen","Giving background or an explanation","Introducing a reason / “because”"],"why":"～てしまいました presents the rain as an unwanted or unfortunate outcome.","level":3,"group":"habit"},{"id":"habit-7","jp":"健康のために、夜は甘いものを食べないようにしています。","en":"For my health, I try not to eat sweets at night.","audio":"audio/sentence35.mp3","focus":"食べないようにしています","correct":"A conscious effort not to do something","options":["A conscious effort not to do something","A habit continuing over time","A deliberate habit or conscious effort","Planning to begin making an effort","A plan or thought currently held","A simple non-past action or habit"],"why":"ない-form + ようにしています expresses a deliberate effort to avoid the action.","level":3,"group":"habit"},{"id":"habit-8","jp":"明日から早く起きるようにしようと思っています。","en":"I’m planning to start making an effort to get up early tomorrow.","audio":"audio/sentence36.mp3","focus":"しようと思っています","correct":"Planning to begin making an effort","options":["Planning to begin making an effort","Volitional form / intention","A plan or thought currently held","An intention held in the past","Planning to try an action","A desire held in the past"],"why":"ようにしよう is the volitional of ようにする: planning to begin making an effort.","level":3,"group":"habit"}],"sentence":[{"id":"intent-1","audio":"audio/sentence02.mp3","jp":"映画を見ようと思います。","en":"I think I’ll watch a movie.","tokens":["映画を","見よう","と","思います。"],"decoys":["見たい","見た","見て","思って","見る","見られる"],"why":"The recording says 「映画を見ようと思います。」. Notice how the verb form and grammar connect.","level":1,"group":"intent","kind":"sentence"},{"id":"intent-2","audio":"audio/sentence03.mp3","jp":"映画を見ようと思っています。","en":"I’m planning to watch a movie.","tokens":["映画を","見よう","と","思って","います。"],"decoys":["見る","見たい","思います。","思っていました。","見た","見て","見られる"],"why":"The recording says 「映画を見ようと思っています。」. Notice how the verb form and grammar connect.","level":2,"group":"intent","kind":"sentence"},{"id":"intent-3","audio":"audio/sentence04.mp3","jp":"今、映画を見ようと思っているところです。","en":"I’m just thinking of watching a movie now.","tokens":["今、","映画を","見よう","と","思って","いる","ところです。"],"decoys":["見る","見たい","いた","ところでした。","見た","見て","見られる"],"why":"The recording says 「今、映画を見ようと思っているところです。」. Notice how the verb form and grammar connect.","level":2,"group":"intent","kind":"sentence"},{"id":"intent-4","audio":"audio/sentence05.mp3","jp":"ちょうど映画を見ようと思っていたところです。","en":"I was just thinking of watching a movie.","tokens":["ちょうど","映画を","見よう","と","思って","いた","ところです。"],"decoys":["見る","見たい","いる","思っています。","見た","見て","見られる"],"why":"The recording says 「ちょうど映画を見ようと思っていたところです。」. Notice how the verb form and grammar connect.","level":2,"group":"intent","kind":"sentence"},{"id":"intent-5","audio":"audio/sentence06.mp3","jp":"映画を見ようと思っていたところに、友達から電話がかかってきました。","en":"Just as I was thinking of watching a movie, a friend called.","tokens":["映画を","見よう","と","思って", hy":"The recording says 「ケーキを作ってみます。」. Notice how the verb form and grammar connect.","level":1,"group":"try","kind":"sentence"},{"id":"try-2","audio":"audio/sentence13.mp3","jp":"ケーキを作ってみたいです。","en":"I want to try making a cake.","tokens":["ケーキを","作って","みたい","です。"],"decoys":["作ります。","みます。","みたかった","みよう","作り","作る","作った"],"why":"The recording says 「ケーキを作ってみたいです。」. Notice how the verb form and grammar connect.","level":2,"group":"try","kind":"sentence"},{"id":"try-3","audio":"audio/sentence14.mp3","jp":"ケーキを作ってみたいと思っています。","en":"I’ve been thinking I’d like to try making a cake.","tokens":["ケーキを","作って","みたい","と","思って","います。"],"decoys":["みよう","みたかった","思います。","いました。","作り","作る","作った"],"why":"The recording says 「ケーキを作ってみたいと思っています。」. Notice how the verb form and grammar connect.","level":2,"group":"try","kind":"sentence"},{"id":"try-4","audio":"audio/sentence15.mp3","jp":"ケーキを作ってみたいと思っているんです。","en":"Actually, I’ve been thinking I’d like to try making a cake.","tokens":["ケーキを","作って","みたい","と","思って","いる","んです。"],"decoys":["みよう","みたかった","いた","います。","作り","作る","作った"],"why":"The recording says 「ケーキを作ってみたいと思っているんです。」. Notice how the verb form and grammar connect.","level":2,"group":"try","kind":"sentence"},{"id":"try-5","audio":"audio/sentence16.mp3","jp":"週末にケーキを作ってみようと思っています。","en":"I’m planning to try making a cake this weekend.","tokens":["週末に","ケーキを","作って","みよう","と","思って","います。"],"decoys":["みたい","みたかった","みます。","思います。","作り","作る","作った"],"why":"The recording says 「週末にケーキを作ってみようと思っています。」. Notice how the verb form and grammar connect.","level":3,"group":"try","kind":"sentence"},{"id":"try-6","audio":"audio/sentence17.mp3","jp":"ケーキを作ってみようと思っていたんですが、材料が足りませんでした。","en":"I was planning to try making a cake, but I didn’t have enough ingredients.","tokens":["ケーキを","作って","みよう","と","思って","いた","んですが、","材料が","足りませんでした。"],"decoys":["みたい","みたかった","いる","足りません。","作り","作る","作った"],"why":"The recording says 「ケーキを作ってみようと思っていたんですが、材料が足りませんでした。」. Notice how the verb form and grammar connect.","level":3,"group":"try","kind":"sentence"},{"id":"try-7","audio":"audio/sentence18.mp3","jp":"ケーキを作ってみたかったんですが、時間がありませんでした。","en":"I wanted to try making a cake, but I didn’t have time.","tokens":["ケーキを","作って","みたかった","んですが、","時間が","ありませんでした。"],"decoys":["みたい","みよう","みます。","ありません。","作り","作る","作った"],"why":"The recording says 「ケーキを作ってみたかったんですが、時間がありませんでした。」. Notice how the verb form and grammar connect.","level":3,"group":"try","kind":"sentence"},{"id":"try-8","audio":"audio/sentence19.mp3","jp":"新しいレシピを試してみたいと思っています。","en":"I’ve been thinking I’d like to try a new recipe.","tokens":["新しい","レシピを","試して","みたい","と","思って","います。"],"decoys":["みよう","みたかった","思います。","いました。","試す","試した","試し"],"why":"The recording says 「新しいレシピを試してみたいと思っています。」. Notice how the verb form and grammar connect.","level":3,"group":"try","kind":"sentence"},{"id":"reason-1","audio":"audio/sentence21.mp3","jp":"昨日は忙しくて、買い物に行けませんでした。","en":"I was busy yesterday, so I couldn’t go shopping.","tokens":["昨日は","忙しくて、","買い物に","行けませんでした。"],"decoys":["忙しいので、","行けました。","行けません。","行きませんでした。","忙しかったので、","忙しくなくて、"],"why":"The recording says 「昨日は忙しくて、買い物に行けませんでした。」. Notice how the verb form and grammar connect.","level":1,"group":"reason","kind":"sentence"},{"id":"reason-2","audio":"audio/sentence22.mp3","jp":"昨日は忙しくて、買い物に行けなかったんです。","en":"The thing is, I was busy yesterday, so I couldn’t go shopping.","tokens":["昨日は","忙しくて、","買い物に","行けなかった","んです。"],"decoys":["忙しいので、","行けました。","行けませんでした。","行かなかった","忙しかったので、","忙しくなくて、","忙しかったけど、"],"why":"The recording says 「昨日は忙しくて、買い物に行けなかったんです。」. Notice how the verb form and grammar connect.","level":2,"group":"reason","kind":"sentence"},{"id":"reason-3","audio":"audio/sentence23.mp3","jp":"昨日は忙しくて買い物に行けなかったので、今日行こうと思っています。","en":"I couldn’t go shopping yesterday because I was busy, so I’m planning to go today.","tokens":["昨日は","忙しくて","買い物に","行けなかった","ので、","今日","行こう","と","思って","います。"],"decoys":["行けた","行った","行く","思いました。","行かなかった","行けない","行きたかった"],"why":"The recording says 「昨日は忙しくて買い物に行けなかったので、 ","歩こう","いました。","歩く","歩いた"],"why":"The recording says 「健康のために、毎朝歩いています。」. Notice how the verb form and grammar connect.","level":1,"group":"habit","kind":"sentence"},{"id":"habit-2","audio":"audio/sentence30.mp3","jp":"健康のために、毎朝歩くようにしています。","en":"I make a point of walking every morning for my health.","tokens":["健康の","ために、","毎朝","歩く","ように","しています。"],"decoys":["する。","した。","していた。","しよう。","歩き","歩いた","歩いて"],"why":"The recording says 「健康のために、毎朝歩くようにしています。」. Notice how the verb form and grammar connect.","level":2,"group":"habit","kind":"sentence"},{"id":"habit-3","audio":"audio/sentence31.mp3","jp":"健康のために、エレベーターを使わないで階段を使うようにしています。","en":"For my health, I try to take the stairs instead of the elevator.","tokens":["健康の","ために、","エレベーターを","使わないで","階段を","使う","ように","しています。"],"decoys":["使わなくて","使った","する。","していました。","使って","使わなかったら","使いませんでした"],"why":"The recording says 「健康のために、エレベーターを使わないで階段を使うようにしています。」. Notice how the verb form and grammar connect.","level":2,"group":"habit","kind":"sentence"},{"id":"habit-4","audio":"audio/sentence32.mp3","jp":"最近、健康のために階段を使うようにしているんです。","en":"Lately, I’ve been making an effort to take the stairs for my health.","tokens":["最近、","健康の","ために","階段を","使う","ように","している","んです。"],"decoys":["使った","した","する","していた","使って","使わない","使える"],"why":"The recording says 「最近、健康のために階段を使うようにしているんです。」. Notice how the verb form and grammar connect.","level":2,"group":"habit","kind":"sentence"},{"id":"habit-5","audio":"audio/sentence33.mp3","jp":"運動するために、来週から毎朝歩こうと思っています。","en":"I’m planning to start walking every morning next week to get some exercise.","tokens":["運動する","ために、","来週から","毎朝","歩こう","と","思って","います。"],"decoys":["運動した","運動している","歩く","思いました。","歩いた","歩きたい","歩いて"],"why":"The recording says 「運動するために、来週から毎朝歩こうと思っています。」. Notice how the verb form and grammar connect.","level":3,"group":"habit","kind":"sentence"},{"id":"habit-6","audio":"audio/sentence34.mp3","jp":"今朝は歩こうと思っていたんですが、雨が降ってしまいました。","en":"I was planning to walk this morning, but it ended up raining.","tokens":["今朝は","歩こう","と","思って","いた","んですが、","雨が","降って","しまいました。"],"decoys":["歩く","歩きたい","いる","しまいます。","歩いた","歩いて","歩きます"],"why":"The recording says 「今朝は歩こうと思っていたんですが、雨が降ってしまいました。」. Notice how the verb form and grammar connect.","level":3,"group":"habit","kind":"sentence"},{"id":"habit-7","audio":"audio/sentence35.mp3","jp":"健康のために、夜は甘いものを食べないようにしています。","en":"For my health, I try not to eat sweets at night.","tokens":["健康の","ために、","夜は","甘いものを","食べない","ように","しています。"],"decoys":["食べる","食べた","する。","していました。","食べなかった","食べなくて","食べたい"],"why":"The recording says 「健康のために、夜は甘いものを食べないようにしています。」. Notice how the verb form and grammar connect.","level":3,"group":"habit","kind":"sentence"},{"id":"habit-8","audio":"audio/sentence36.mp3","jp":"明日から早く起きるようにしようと思っています。","en":"I’m planning to start making an effort to get up early tomorrow.","tokens":["明日から","早く","起きる","ように","しよう","と","思って","います。"],"decoys":["起きたい","する","した","している","ことに","ために","前に"],"why":"The recording says 「明日から早く起きるようにしようと思っています。」. Notice how the verb form and grammar connect.","level":3,"group":"habit","kind":"sentence"}],"triple":[{"id":"triple-match-0","style":"match","en":"I think I’ll watch a movie.","options":["映画を見ようと思います。","映画を見ようと思っています。","映画を見ようと思っていました。"],"correct":"映画を見ようと思います。","why":"～ようと思います can express a decision or thought at the moment.","level":1,"model":"映画を見ようと思います。","audio":"audio/sentence02.mp3"},{"id":"triple-match-1","style":"match","en":"I’m planning to watch a movie.","options":["映画を見ようと思っています。","映画を見ようと思います。","映画を見ようと思っていました。"],"correct":"映画を見ようと思っています。","why":"～ようと思っています describes an intention already held.","level":1,"model":"映画を見ようと思っています。","audio":"audio/sentence03.mp3"},{"id":"triple-match-2","style":"match","en":"I had been planning to watch a movie.","options":["映画を見ようと思っていました。","映画を見ようと思います。","映画を見ようと思っています。"],"correct":"映画を見ようと思っていました。","why":"～ようと思っていました puts that ongoing intention in the past.","level":1,"model":"映画を見ようと思っていました。","audio":null},{"id":"triple-match-3","style":"match","en":"I want to watch a movie.","options":["映画を見たいです。","映画を見ようと思います。","映画を見ようと思っています。"],"correct":"映画を見たいです。","why":"～たい expresses desire, not necessarily a concrete plan.","level":1,"model":"映画を見たいです。","audio":null},{"id":"triple-match-4","style":"match","en":"I’ll try making a cake.","options":["ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみたかったです。"],"correct":"ケーキを作ってみます。","why":"～てみます expresses trying an action.","level":1,"model":"ケーキを作ってみます。","audio":"audio/sentence12.mp3"},{"id":"triple-match-5","style":"match","en":"I want to try making a cake.","options":["ケーキを作ってみたいです。","ケーキを作ってみます。","ケーキを作ってみたかったです。"],"correct":"ケーキを作ってみたいです。","why":"～てみたい expresses the desire to try.","level":1,"model":"ケーキを作ってみたいです。","audio":"audio/sentence13.mp3"},{"id":"triple-match-6","style":"match","en":"I wanted to try making a cake.","options":["ケーキを作ってみたかったです。","ケーキを作ってみます。","ケーキを作ってみたいです。"],"correct":"ケーキを作ってみたかったです。","why":"～てみたかった is the past of wanting to try.","level":1,"model":"ケーキを作ってみたかったです。","audio":null},{"id":"triple-match-7","style":"match","en":"I’m planning to try making a cake.","options":["ケーキを作ってみようと思っています。","ケーキを作ってみます。","ケーキを作ってみたいです。"],"correct":"ケーキを作ってみようと思っています。","why":"～てみようと思っています expresses an intention to try.","level":1,"model":"ケーキを作ってみようと思っています。","audio":null},{"id":"triple-match-8","style":"match","en":"I did not go shopping yesterday.","options":["昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。","昨日、買い物に行きたくありませんでした。"],"correct":"昨日、買い物に行きませんでした。","why":"行きませんでした reports the action did not happen, without stating inability.","level":2,"model":"昨日、買い物に行きませんでした。","audio":null},{"id":"triple-match-9","style":"match","en":"I could not go shopping yesterday.","options":["昨日、買い物に行けませんでした。","昨日、買い物に行きませんでした。","昨日、買い物に行きたくありませんでした。"],"correct":"昨日、買い物に行けませんでした。","why":"行けませんでした is past negative potential: unable to go.","level":2,"model":"昨日、買い物に行けませんでした。","audio":null},{"id":"triple-match-10","style":"match","en":"I did not want to go shopping yesterday.","options":["昨日、買い物に行きたくありませんでした。","昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。"],"correct":"昨日、買い物に行きたくありませんでした。","why":"行きたくありませんでした describes a lack of desire.","level":2,"model":"昨日、買い物に行きたくありませんでした。","audio":null},{"id":"triple-match-11","style":"match","en":"I had been planning to go shopping yesterday.","options":["昨日、買い物に行こうと思っていました。","昨日、買い物に行きませんでした。","昨日、買い物に行けませんでした。"],"correct":"昨日、買い物に行こうと思っていました。","why":"行こうと思っていました describes an earlier intention.","level":2,"model":"昨日、買い物に行こうと思っていました。","audio":null},{"id":"triple-correct-0","style":"onlycorrect","options":["映画を見ようと思っています。","映画を見ように思っています。","映画を見ようと思いています。"],"correct":"映画を見ようと思っています。","why":"「思う」のて形は「思って」。現在の計画は「思っています」。","level":2,"model":"映画を見ようと思っています。","audio":"audio/sentence03.mp3"},{"id":"triple-correct-1","style":"onlycorrect","options":["ケーキを作ってみたいです。","ケーキを作ってみたくです。","ケーキを作ってみたいだ。"],"correct":"ケーキを作ってみたいです。","why":"～たい is conjugated like an い-adjective. ～たいです is correct.","level":1,"model":"ケーキを作ってみたいです。","audio":"audio/sentence13.mp3"},{"id":"triple-correct-2","style":"onlycorrect","options":["昨日は忙しくて、買い物に行けませんでした。","昨日は忙しいで、買い物に行けませんでした。","昨日は忙しくので、買い物に行けませんでした。"],"correct":"昨日は忙しくて、買い物に行けませんでした。","why":"忙しい→忙しくて。The negative past potential form is 行けませんでした.","level":2,"model":"昨日は忙しくて、買い物に行けませんでした。","audio":"audio/sentence21.mp3"},{"id":"triple-correct-3","style":"onlycorrect","options":["健康のために、毎朝歩くようにしています。","健康のために、毎朝歩きようにしています。","健康のために、毎朝歩くようをしています。"],"correct":"健康のために、毎朝歩くようにしています。","why":"Dictionary form + ようにしています: 歩くようにしています。","level":2,"model":"健康のために、毎朝歩くようにしています。","audio":"audio/sentence30.mp3"},{"id":"triple-correct-4","style":"onlycorrect","options":["時間がなくて、昼ご飯を食べられませんでした。","時間がないで、昼ご飯を食べられませんでした。","時間がなかったで、昼ご飯を食べられませんでした。"],"correct":"時間がなくて、昼ご飯を食べられませんでした。","why":"時間がなくて = because there was no time. Compare: 時間がなかったから and 時間がなかったので are also natural reasons; 時間がないで / なかったで are not the right connectors.","level":2,"model":"時間がなくて、昼ご飯を食べられませんでした。","audio":"audio/sentence24.mp3"},{"id":"triple-correct-5","style":"onlycorrect","options":["健康のために、夜は甘いものを食べないようにしています。","健康のために、夜は甘いものを食べなくようにしています。","健康のために、夜は甘いものを食べないようをしています。"],"correct":"健康のために、夜は甘いものを食べないようにしています。","why":"ない-form + ようにしています describes a deliberate effort to avoid something.","level":3,"model":"健康のために、夜は甘いものを食べないようにしています。","audio":"audio/sentence35.mp3"},{"id":"triple-correct-6","style":"onlycorrect","options":["明日から早く起きるようにしようと思っています。","明日から早く起きようにしようと思っています。","明日から早く起きるようにしように思っています。"],"correct":"明日から早く起きるようにしようと思っています。","why":"Volitional + と思っています is correct: しようと思っています。","level":3,"model":"明日から早く起きるようにしようと思っています。","audio":"audio/sentence36.mp3"},{"id":"triple-correct-7","style":"onlycorrect","options":["ケーキを作ってみようと思っています。","ケーキを作ってみろうと思っています。","ケーキを作ってみように思っています。"],"correct":"ケーキを作ってみようと思っています。","why":"作ってみよう is the volitional of 作ってみる.","level":3,"model":"ケーキを作ってみようと思っています。","audio":null},{"id":"triple-wrong-0","style":"onlywrong","options":["映画を見ようと思います。","映画を見ようと思っています。","映画を見ように思っています。"],"correct":"映画を見ように思っています。","repairParts":["と"],"repair":"と","why":"Use と to quote a thought before 思っています.","level":1,"model":"映画を見ようと思っています。","audio":"audio/sentence03.mp3","wrong":"映画を見よう【に】思っています。","charDecoys":["に","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"triple-wrong-1","style":"onlywrong","options":["ケーキを作ってみたいです。","ケーキを作ってみたかったです。","ケーキを作ってみたくです。"],"correct":"ケーキを作ってみたくです。","repairParts":["た","い"],"repair":"たい","why":"Use ～たいです for desire; ～たく is not a sentence-final form before です.","level":1,"model":"ケーキを作ってみたいです。","audio":null,"wrong":"ケーキを作ってみ【たく】です。","charDecoys":["た","く","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"triple-wrong-2","style":"onlywrong","options":["昨日は忙しくて、買い物に行けませんでした。","昨日は忙しかったので、買い物に行けませんでした。","昨日は忙しいで、買い物に行けませんでした。"],"correct":"昨日は忙しいで、買い物に行けませんでした。","repairParts":["忙","し","く","て"],"repair":"忙しくて","why":"Use 忙しくて with an い-adjective. 忙しかったので is also a natural reason.","level":2,"model":"昨日は忙しくて、買い物に行けませんでした。","audio":"audio/sentence21.mp3","wrong":"昨日は【忙しいで】、買い物に行けませんでした。","charDecoys":["忙","し","い","で","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"triple-wrong-3","style":"onlywrong","options":["健康のために、毎朝歩くようにしています。","健康のために、毎朝歩いています。","健康のために、毎朝歩きようにしています。"],"correct":"健康のために、毎朝歩きようにしています。","repairParts":["歩","く"],"repair":"歩く","why":"Use dictionary form 歩く before ～ようにしています.","level":2,"model":"健康のために、毎朝歩くようにしています。","audio":"audio/sentence30.mp3","wrong":"健康のために、毎朝【歩き】ようにしています。","charDecoys":["歩","き","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"triple-wrong-4","style":"onlywrong","options":["ケーキを作ってみます。","ケーキを作ってみたいです。","ケーキを作ってみように思っています。"],"correct":"ケーキを作ってみように思っています。","repairParts":["と"],"repair":"と","why":"Use と after the volitional form: ～ようと思っています.","level":2,"model":"ケーキを作ってみようと思っています。","audio":"audio/sentence13.mp3","wrong":"ケーキを作ってみよう【に】思っています。","charDecoys":["に","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]},{"id":"triple-wrong-5","style":"onlywrong","options":["時間がなくて、昼ご飯を食べられませんでした。","時間がなくて、昼ご飯を食べられなかったんです。","時間がないで、昼ご飯を食べられませんでした。"],"correct":"時間がないで、昼ご飯を食べられませんでした。","repairParts":["な","く","て"],"repair":"なくて","why":"Use ～なくて for the reason. 時間がなかったから / 時間がなかったので also work, but 時間がないで does not express this reason naturally.","level":3,"model":"時間がなくて、昼ご飯を食べられませんでした。","audio":"audio/sentence24.mp3","wrong":"時間が【ないで】、昼ご飯を食べられませんでした。","charDecoys":["な","い","で","の","で","に","を","て","で","く","た","な","っ","い","ま","し","よ","る","う","と","思","か","っ"]}],"forms":[{"id":"form-0","meaning":"have to / must","pattern":"～なければならない","en":"I have to work.","jp":"働かなければなりません。","tokens":["働か","なければ","なりません。"],"decoys":["働き","なくても","いいです。","なりました。"],"why":"Verb ない-form without い + なければならない expresses obligation.","level":1,"audio":null},{"id":"form-1","meaning":"don't have to","pattern":"～なくてもいい","en":"I do not have to work.","jp":"働かなくてもいいです。","tokens":["働か","なくても","いいです。"],"decoys":["なければ","なりません。","働いて","ません。"],"why":"～なくてもいい means it is not necessary to do something.","level":1,"audio":null},{"id":"form-2","meaning":"must not / prohibited","pattern":"～てはいけない","en":"You must not eat here.","jp":"ここで食べてはいけません。","tokens":["ここで","食べて","はいけません。"],"decoys":["食べないで","いいです。","なりません。"],"why":"て-form + はいけません expresses prohibition.","level":1,"audio":null},{"id":"form-3","meaning":"want to do","pattern":"～たい","en":"I want to watch a movie.","jp":"映画を見たいです。","tokens":["映画を","見たい","です。"],"decoys":["見よう","見ました。","思っています。"],"why":"Verb ます-stem + たい expresses the speaker’s desire.","level":1,"audio":null},{"id":"form-4","meaning":"want to try doing","pattern":"～てみたい","en":"I want to try making a cake.","jp":"ケーキを作ってみたいです。","tokens":["ケーキを","作って","みたい","です。"],"decoys":["みよう","みます。","作る","でした。"],"why":"て-form + みたい means wanting to try an action.","level":2,"audio":"audio/sentence13.mp3"},{"id":"form-5","meaning":"plan to do","pattern":"～ようと思っている","en":"I am planning to watch a movie.","jp":"映画を見ようと思っています。","tokens":["映画を","見よう","と","思って","います。"],"decoys":["見たい","見ました。","思います。","いました。"],"why":"Volitional + と思っています expresses an intention already held.","level":2,"audio":"audio/sentence03.mp3"},{"id":"form-6","meaning":"decide to do","pattern":"～ことにする","en":"I decided to walk every morning.","jp":"毎朝歩くことにしました。","tokens":["毎朝","歩く","ことに","しました。"],"decoys":["歩き","ように","しています。","します。"],"why":"Dictionary form + ことにする expresses a decision.","level":2,"audio":null},{"id":"form-7","meaning":"make a point of doing","pattern":"～ようにしている","en":"I make a point of walking every morning.","jp":"毎朝歩くようにしています。","tokens":["毎朝","歩く","ように","しています。"],"decoys":["歩き","歩いた","する","しました。"],"why":"Dictionary form + ようにしています expresses deliberate ongoing effort.","level":2,"audio":null},{"id":"form-8","meaning":"can / be able to","pattern":"potential form","en":"I can watch the movie.","jp":"映画を見られます。","tokens":["映画を","見られます。"],"decoys":["見ます。","見たいです。","見ました。"],"why":"見られます is the potential form of 見る.","level":2,"audio":null},{"id":"form-9","meaning":"without doing","pattern":"～ないで","en":"I go out without eating.","jp":"食べないで出かけます。","tokens":["食べないで","出かけます。"],"decoys":["食べなくて","食べて","出かけました。"],"why":"ない-form + で expresses doing something without another action.","level":2,"audio":null},{"id":"form-10","meaning":"before doing","pattern":"～前に","en":"I study before going to bed.","jp":"寝る前に勉強します。","tokens":["寝る","前に","勉強します。"],"decoys":["寝て","後で","勉強しました。"],"why":"Dictionary form + 前に means before doing an action.","level":2,"audio":null},{"id":"form-11","meaning":"after doing","pattern":"～てから","en":"I go out after eating.","jp":"食べてから出かけます。","tokens":["食べて","から","出かけます。"],"decoys":["食べないで","前に","出かけました。"],"why":"て-form + から expresses one action followed by another.","level":2,"audio":null}],"grammaren":[{"id":"en-0","en":"have to / must","jp":"～なければならない","correct":"～なければならない","options":["～なければならない","～なくてもいい","～てはいけない","～てもいい","～ないほうがいい","～たい"],"why":"Verb ない-form without い + なければならない expresses obligation. Compare: ～なければならない = must; ～なくてもいい = do not need to; ～てはいけない = must not; ～てもいい = may.","model":"働かなければなりません。","audio":null,"level":1},{"id":"en-1","en":"don't have to","jp":"～なくてもいい","correct":"～なくてもいい","options":["～なくてもいい","～なければならない","～てはいけない","～てもいい","～ないほうがいい","～ないで"],"why":"～なくてもいい means it is not necessary to do something. Compare: ～なくてもいい = no obligation; ～てはいけない = prohibition; ～なければならない = obligation.","model":"働かなくてもいいです。","audio":null,"level":1},{"id":"en-2","en":"must not / prohibited","jp":"～てはいけない","correct":"～てはいけない","options":["～てはいけない","～なくてもいい","～なければならない","～てもいい","～ないほうがいい","～ないで"],"why":"て-form + はいけません expresses prohibition. Compare: ～てはいけない = forbidden; ～なくてもいい = not necessary; ～てもいい = allowed.","model":"ここで食べてはいけません。","audio":null,"level":1},{"id":"en-3","en":"want to do","jp":"～たい","correct":"～たい","options":["～たい","～てみたい","～ようと思っている","～ことにする","～てもいい","～ようにしている"],"why":"Verb ます-stem + たい expresses the speaker’s desire. Compare: ～たい = want; ～てみたい = want to try; ～ようと思っている = have a plan.","model":"映画を見たいです。","audio":null,"level":1},{"id":"en-4","en":"want to try doing","jp":"～てみたい","correct":"～てみたい","options":["～てみたい","～たい","～てみる","～てみた","～ようと思っている","～ことにする"],"why":"て-form + みたい means wanting to try an action. Compare: ～てみる = try; ～てみたい = want to try; ～てみた = tried.","model":"ケーキを作ってみたいです。","audio":"audio/sentence13.mp3","level":2},{"id":"en-5","en":"plan to do","jp":"～ようと思っている","correct":"～ようと思っている","options":["～ようと思っている","～たい","～ことにする","～ようにしている","～ようと思っていた","～てみたい"],"why":"Volitional + と思っています expresses an intention already held. Compare: ～ようと思っている = a plan already held; ～ようと思っていた = a plan held in the past; ～たい = desire.","model":"映画を見ようと思っています。","audio":"audio/sentence03.mp3","level":2},{"id":"en-6","en":"decide to do","jp":"～ことにする","correct":"～ことにする","options":["～ことにする","～ことになる","～ようと思っている","～ようにしている","～ことにしていた","～たい"],"why":"Dictionary form + ことにする expresses a decision. Compare: ～ことにする = decide yourself; ～ことになる = it is decided; ～ようにしている = make an effort regularly.","model":"毎朝歩くことにしました。","audio":null,"level":2},{"id":"en-7","en":"make a point of doing","jp":"～ようにしている","correct":"～ようにしている","options":["～ようにしている","～ようにする","～ようと思っている","～ようにしていた","～ことにする","～ている"],"why":"Dictionary form + ようにしています expresses deliberate ongoing effort. Compare: ～ようにしている = an ongoing conscious effort; ～ようにする = try to do; ～ようにしていた = that effort in the past.","model":"毎朝歩くようにしています。","audio":null,"level":2},{"id":"en-8","en":"can / be able to","jp":"可能形（見られる・行ける）","correct":"可能形（見られる・行ける）","options":["可能形（見られる・行ける）","～てもいい","～なければならない","～たい","～られない","～てはいけない"],"why":"見られます is the potential form of 見る. Compare: the potential form means ability; ～てもいい expresses permission; ～なければならない expresses obligation.","model":"映画を見られます。","audio":null,"level":2},{"id":"en-9","en":"without doing","jp":"～ないで","correct":"～ないで","options":["～ないで","～なくて","～なくてもいい","～てから","～前に","～てはいけない"]
